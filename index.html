<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MR Hex Power Wall v3.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #070d11;
      color: #eaf6f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .launch-wrap {
      position: relative;
      z-index: 10;
      max-width: 420px;
      width: 100%;
      background: radial-gradient(circle at top, #162831 0%, #0d181e 100%);
      border: 1px solid #264552;
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
    }
    .version-badge {
      display: inline-block;
      background: rgba(38, 198, 218, 0.14);
      color: #4dd0e1;
      border: 1px solid rgba(77, 208, 225, 0.4);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    p.sub {
      color: #93b7c2;
      font-size: 0.92rem;
      line-height: 1.48;
      margin-bottom: 24px;
    }
    #start-btn {
      width: 100%;
      padding: 22px;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, #26c6da, #00acc1);
      color: #041519;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 172, 193, 0.38);
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    #start-btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
    #start-btn:active:not(:disabled) { transform: scale(0.98); }
    #status {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #90b4be;
      min-height: 1.2em;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="launch-wrap" id="launch-screen">
    <div class="version-badge">VERSION 3.0 • KINETIC POWER WALL</div>
    <h1>Hex Power Wall</h1>
    <p class="sub">Place the wall in front of you, lock it in, and charge the center reactor with matching hexagons across escalating stages.</p>
    <button id="start-btn" disabled>Checking Quest XR...</button>
    <div id="status"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    const APP_VERSION = 'v3.0';

    const launchScreen = document.getElementById('launch-screen');
    const startBtn = document.getElementById('start-btn');
    const statusEl = document.getElementById('status');

    window.addEventListener('error', (e) => {
      statusEl.textContent = 'Error: ' + (e.message || 'Unknown error');
    });

    // =========================================================================
    // 1. MULTI-LAYERED PROCEDURAL WEB AUDIO ENGINE
    // =========================================================================
    let audioCtx = null;
    let softNoiseBuffer = null;
    const scaleFreqs = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99];

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const sr = audioCtx.sampleRate;
      const len = Math.floor(sr * 0.45);
      softNoiseBuffer = audioCtx.createBuffer(1, len, sr);
      const ch = softNoiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) {
        ch[i] = (Math.random() * 2 - 1);
      }
    }

    function ensureAudioReady() {
      if (!audioCtx) return false;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return true;
    }

    // Crisp crystalline touch + rising harmonic bell + energy conduit whoosh
    function playTileTouchAndSurge(stepIndex, isSuperTile = false) {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const freq = scaleFreqs[stepIndex % scaleFreqs.length];

      // 1. Tactile glass tap transient
      const tapOsc = audioCtx.createOscillator();
      const tapGain = audioCtx.createGain();
      tapOsc.type = 'triangle';
      tapOsc.frequency.setValueAtTime(freq * 2, now);
      tapOsc.frequency.exponentialRampToValueAtTime(freq * 0.5, now + 0.065);
      tapGain.gain.setValueAtTime(0.001, now);
      tapGain.gain.exponentialRampToValueAtTime(0.22, now + 0.008);
      tapGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
      tapOsc.connect(tapGain);
      tapGain.connect(audioCtx.destination);
      tapOsc.start(now);
      tapOsc.stop(now + 0.09);

      // 2. Warm bell chime + fifth/octave shimmer
      const ratios = isSuperTile ? [1, 1.5, 2] : [1, 2];
      ratios.forEach((mult, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq * mult, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(idx === 0 ? 0.17 : 0.06, now + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.48);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.52);
      });

      // 3. Soft filtered plasma whoosh along the power line
      if (softNoiseBuffer) {
        const src = audioCtx.createBufferSource();
        src.buffer = softNoiseBuffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.value = 3.2;
        filter.frequency.setValueAtTime(420, now);
        filter.frequency.exponentialRampToValueAtTime(1450, now + 0.34);

        const nGain = audioCtx.createGain();
        nGain.gain.setValueAtTime(0.001, now);
        nGain.gain.exponentialRampToValueAtTime(0.08, now + 0.08);
        nGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.36);

        src.connect(filter);
        filter.connect(nGain);
        nGain.connect(audioCtx.destination);
        src.start(now);
        src.stop(now + 0.38);
      }
    }

    // Deep resonant reactor dock + rising liquid charge ping when energy reaches center
    function playCoreDockSound(fillRatio) {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const baseFreq = 290 + fillRatio * 360;

      // Sub-bass warm thump
      const sub = audioCtx.createOscillator();
      const subGain = audioCtx.createGain();
      sub.type = 'sine';
      sub.frequency.setValueAtTime(135 + fillRatio * 45, now);
      sub.frequency.exponentialRampToValueAtTime(62, now + 0.22);
      subGain.gain.setValueAtTime(0.001, now);
      subGain.gain.exponentialRampToValueAtTime(0.24, now + 0.015);
      subGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
      sub.connect(subGain);
      subGain.connect(audioCtx.destination);
      sub.start(now);
      sub.stop(now + 0.27);

      // Rising harmonic lock ping
      const ping = audioCtx.createOscillator();
      const pingGain = audioCtx.createGain();
      ping.type = 'triangle';
      ping.frequency.setValueAtTime(baseFreq, now);
      ping.frequency.exponentialRampToValueAtTime(baseFreq * 1.4, now + 0.18);
      pingGain.gain.setValueAtTime(0.001, now);
      pingGain.gain.exponentialRampToValueAtTime(0.16, now + 0.02);
      pingGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
      ping.connect(pingGain);
      pingGain.connect(audioCtx.destination);
      ping.start(now);
      ping.stop(now + 0.30);
    }

    // Lush shimmering stage-complete chord cascade
    function playStageCompleteFanfare() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const chord = [261.63, 329.63, 392.00, 493.88, 587.33, 783.99];
      chord.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
        const t0 = now + idx * 0.055;
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.exponentialRampToValueAtTime(0.13, t0 + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.85);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.90);
      });
    }

    function playSoftCountdownTick(secondsLeft) {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(secondsLeft === 1 ? 660 : 480, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.07, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.10);
    }

    function playGentleWrongTap() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(155, now);
      osc.frequency.exponentialRampToValueAtTime(118, now + 0.15);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.07, now + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.17);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.19);
    }

    function playGentleResetTone() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(340, now);
      osc.frequency.exponentialRampToValueAtTime(210, now + 0.36);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.11, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.40);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.42);
    }

    function playClickTone() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(540, now);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    }

    // =========================================================================
    // 2. THREE.JS SCENE, LIGHTING & PROCEDURAL TEXTURES
    // =========================================================================
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.28;
    renderer.domElement.style.position = 'fixed';
    renderer.domElement.style.inset = '0';
    renderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 30);

    scene.add(new THREE.HemisphereLight(0xe4f9ff, 0x102028, 1.15));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.35);
    keyLight.position.set(1.6, 2.8, 2.6);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x80deea, 0.65);
    fillLight.position.set(-2.2, 0.8, 2.0);
    scene.add(fillLight);

    function createDiffuserTexture() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(size / 2, size / 2, size * 0.04, size / 2, size / 2, size * 0.5);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.42, 'rgba(240, 240, 240, 0.94)');
      grad.addColorStop(0.82, 'rgba(175, 175, 175, 0.80)');
      grad.addColorStop(1.0, 'rgba(125, 125, 125, 0.72)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(canvas);
    }

    function createBloomHaloTexture() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(size / 2, size / 2, size * 0.04, size / 2, size / 2, size * 0.5);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 0.98)');
      grad.addColorStop(0.32, 'rgba(255, 255, 255, 0.48)');
      grad.addColorStop(0.68, 'rgba(255, 255, 255, 0.14)');
      grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(canvas);
    }

    // Subtle geometric circuit-trace texture etched onto the dark glass backboard
    function createCircuitBackboardTexture() {
      const w = 1024;
      const h = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#071217';
      ctx.fillRect(0, 0, w, h);

      // Radial gradient vignette
      const bgGrad = ctx.createRadialGradient(w / 2, h / 2, 40, w / 2, h / 2, w * 0.55);
      bgGrad.addColorStop(0, 'rgba(20, 48, 58, 0.65)');
      bgGrad.addColorStop(1, 'rgba(5, 12, 16, 0.92)');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // Subtle concentric hex rings & radial power traces
      ctx.strokeStyle = 'rgba(77, 208, 225, 0.13)';
      ctx.lineWidth = 2;
      const cx = w / 2;
      const cy = h / 2;

      for (let r = 130; r <= 460; r += 110) {
        ctx.beginPath();
        for (let i = 0; i <= 6; i++) {
          const a = (Math.PI / 3) * i;
          const px = cx + Math.cos(a) * r;
          const py = cy + Math.sin(a) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }

      // Radial power line traces
      ctx.strokeStyle = 'rgba(77, 208, 225, 0.10)';
      for (let i = 0; i < 12; i++) {
        const a = (Math.PI / 6) * i;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * 95, cy + Math.sin(a) * 95);
        ctx.lineTo(cx + Math.cos(a) * 490, cy + Math.sin(a) * 490);
        ctx.stroke();
      }

      return new THREE.CanvasTexture(canvas);
    }

    const diffuserTex = createDiffuserTexture();
    const bloomHaloTex = createBloomHaloTexture();
    const circuitBoardTex = createCircuitBackboardTexture();

    // --- Shared Effect Geometries ---
    const hexShockwaveGeo = new THREE.RingGeometry(0.085, 0.118, 6);
    const flashSphereGeo = new THREE.SphereGeometry(0.105, 18, 18);
    const shardGeo = new THREE.OctahedronGeometry(0.022, 0);
    const energyOrbGeo = new THREE.SphereGeometry(0.026, 16, 16);
    const energyTrailGeo = new THREE.SphereGeometry(0.015, 10, 10);

    const activeEffects = [];
    const boardRipples = [];
    const powerPulses = [];

    // --- Vibrant Stage Color Palette (Starts with Purple) ---
    const COLOR_PALETTE = [
      { name: 'Purple', css: '#d500f9', cssLight: '#ea80fc', cssDark: '#4a0072', hex: 0xd500f9, emissive: 0xaa00ff, rim: 0xf3e5f5, halo: 0xea80fc },
      { name: 'Blue',   css: '#00b0ff', cssLight: '#80d8ff', cssDark: '#004c8c', hex: 0x00b0ff, emissive: 0x0091ea, rim: 0xb3e5fc, halo: 0x40c4ff },
      { name: 'Pink',   css: '#ff4081', cssLight: '#ff80ab', cssDark: '#880e4f', hex: 0xff4081, emissive: 0xf50057, rim: 0xffcce0, halo: 0xff80ab },
      { name: 'Gold',   css: '#ffc400', cssLight: '#ffe57f', cssDark: '#8d6e00', hex: 0xffc400, emissive: 0xffab00, rim: 0xfff8e1, halo: 0xffd740 },
      { name: 'Green',  css: '#00e676', cssLight: '#b9f6ca', cssDark: '#005005', hex: 0x00e676, emissive: 0x00c853, rim: 0xd0f8ce, halo: 0x69f0ae }
    ];

    // --- Board Dimensions (Saved) + Fresh Front Placement Every Launch ---
    const SIZE_STORAGE_KEY = 'mr_hex_wall_size_v3';
    const DEFAULT_SIZE = { width: 1.98, height: 1.32 };

    function loadSavedSize() {
      try {
        const raw = localStorage.getItem(SIZE_STORAGE_KEY);
        if (!raw) return { ...DEFAULT_SIZE };
        const p = JSON.parse(raw);
        return {
          width: Math.max(0.85, Math.min(4.5, p.width || DEFAULT_SIZE.width)),
          height: Math.max(0.75, Math.min(3.2, p.height || DEFAULT_SIZE.height))
        };
      } catch {
        return { ...DEFAULT_SIZE };
      }
    }

    function saveBoardSize() {
      try {
        localStorage.setItem(SIZE_STORAGE_KEY, JSON.stringify({
          width: boardState.width,
          height: boardState.height
        }));
      } catch {}
    }

    const savedSize = loadSavedSize();
    const boardState = {
      x: 0,
      y: 1.25,
      z: -1.35,
      yaw: 0,
      width: savedSize.width,
      height: savedSize.height
    };

    let isEditMode = true;
    let needsInitialSnapToFront = false;

    // --- Dynamic Difficulty & Stage Progression State ---
    let stageNumber = 1;
    let targetColorIdx = 0; // Starts Purple
    let roundDuration = 20.0;
    let timeRemaining = 20.0;
    let lastTickSecond = -1;

    // Dynamic target count: fluctuates up & down across stages (e.g., 3 -> 5 -> 4 -> 6 -> 3 -> 7 -> 5...)
    const STAGE_COUNT_PATTERN = [3, 5, 4, 6, 3, 7, 5, 8];
    let requiredSegments = 3; // Total power units needed to fill center hexagon
    let filledSegments = 0;   // Segments physically arrived at center
    let spawnedTargetPoints = 0; // Total power points currently on board or in-flight
    let targetFill = 0.0;
    let displayFill = 0.0;
    let stageClearPause = 0;
    let stageSwapTimer = 0;   // Gentle tile shift timer on higher stages (Stage 3+)
    let coreFlashBoost = 0;   // Dynamic point-light boost on energy arrival

    // --- Movable & Resizable Game Board Group ---
    const boardRoot = new THREE.Group();
    scene.add(boardRoot);

    // Dynamic Reactor PointLight illuminating the bevelled glass tiles in real time
    const reactorLight = new THREE.PointLight(COLOR_PALETTE[0].hex, 1.4, 2.6, 1.5);
    reactorLight.position.set(0, 0, 0.28);
    boardRoot.add(reactorLight);

    function spawnBoardRipple(localPos, colorHex, scaleMult = 1.0) {
      const mat = new THREE.MeshBasicMaterial({
        color: colorHex,
        transparent: true,
        opacity: 0.95,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(hexShockwaveGeo, mat);
      mesh.position.copy(localPos);
      mesh.position.z += 0.032;
      boardRoot.add(mesh);
      boardRipples.push({ mesh, mat, age: 0, scaleMult });
    }

    const backPlaneMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      map: circuitBoardTex,
      roughness: 0.22,
      metalness: 0.15,
      transparent: true,
      opacity: 0.56,
      side: THREE.DoubleSide
    });
    const backPlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), backPlaneMat);
    boardRoot.add(backPlane);

    const frameMat = new THREE.MeshStandardMaterial({
      color: 0x26c6da,
      emissive: 0x00acc1,
      emissiveIntensity: 0.75,
      roughness: 0.22,
      metalness: 0.7,
      transparent: true,
      opacity: 0.92
    });
    const topBar = new THREE.Mesh(new THREE.BoxGeometry(1, 0.016, 0.020), frameMat);
    const botBar = new THREE.Mesh(new THREE.BoxGeometry(1, 0.016, 0.020), frameMat);
    const leftBar = new THREE.Mesh(new THREE.BoxGeometry(0.016, 1, 0.020), frameMat);
    const rightBar = new THREE.Mesh(new THREE.BoxGeometry(0.016, 1, 0.020), frameMat);
    boardRoot.add(topBar, botBar, leftBar, rightBar);

    // Version Badge on bottom-right corner of the 3D board frame
    function createVersionTagMesh(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(10, 22, 28, 0.88)';
      ctx.beginPath();
      ctx.roundRect(4, 4, 248, 56, 28);
      ctx.fill();
      ctx.strokeStyle = 'rgba(77, 208, 225, 0.5)';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#80deea';
      ctx.font = 'bold 28px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 33);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
      return new THREE.Mesh(new THREE.PlaneGeometry(0.18, 0.045), mat);
    }
    const versionBadgeMesh = createVersionTagMesh(APP_VERSION);
    boardRoot.add(versionBadgeMesh);

    const cornerHandles = [];
    const cornerSigns = [
      { sx: -1, sy:  1 },
      { sx:  1, sy:  1 },
      { sx: -1, sy: -1 },
      { sx:  1, sy: -1 }
    ];
    const handleGeo = new THREE.SphereGeometry(0.055, 20, 20);
    const handleHitGeo = new THREE.SphereGeometry(0.115, 12, 12);

    for (const sign of cornerSigns) {
      const hMat = new THREE.MeshStandardMaterial({
        color: 0xffc400,
        emissive: 0xff8f00,
        emissiveIntensity: 0.75,
        roughness: 0.2
      });
      const visMesh = new THREE.Mesh(handleGeo, hMat);
      const hitMesh = new THREE.Mesh(handleHitGeo, new THREE.MeshBasicMaterial({ visible: false }));
      visMesh.add(hitMesh);
      visMesh.position.z = 0.022;
      boardRoot.add(visMesh);
      cornerHandles.push({ mesh: visMesh, hitMesh, mat: hMat, sx: sign.sx, sy: sign.sy });
    }

    function create3DButton(label, bgHex, textHex, w = 0.34, h = 0.095) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 144;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = bgHex;
      ctx.beginPath();
      ctx.roundRect(6, 6, 500, 132, 66);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 6;
      ctx.stroke();

      ctx.fillStyle = textHex;
      ctx.font = 'bold 46px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 256, 74);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      mesh.position.z = 0.025;
      return { mesh, w, h };
    }

    const lockBtnObj = create3DButton('Lock & Play', '#26c6da', '#05181c', 0.36, 0.092);
    const bringHereBtnObj = create3DButton('Bring Here', '#1b3840', '#d0eaef', 0.34, 0.092);
    const editBtnObj = create3DButton('Move / Resize', '#162b32', '#9bd2dc', 0.32, 0.08);

    const lockBtn = lockBtnObj.mesh;
    const bringHereBtn = bringHereBtnObj.mesh;
    const editBtn = editBtnObj.mesh;

    boardRoot.add(lockBtn, bringHereBtn, editBtn);

    // =========================================================================
    // 3. ARCHITECTURAL HEXAGON GRID & CENTER REACTOR CORE
    // =========================================================================
    const hexContainer = new THREE.Group();
    boardRoot.add(hexContainer);

    const HEX_RADIUS = 0.132;
    const CENTER_HEX_RADIUS = 0.285;

    function makeHexShape(r) {
      const s = new THREE.Shape();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i === 0) s.moveTo(x, y);
        else s.lineTo(x, y);
      }
      s.closePath();
      return s;
    }

    function applyCenteredHexUVs(geo, radius) {
      const pos = geo.attributes.position;
      const uv = geo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        const u = (pos.getX(i) / (radius * 2)) + 0.5;
        const v = (pos.getY(i) / (radius * 2)) + 0.5;
        uv.setXY(i, u, v);
      }
      uv.needsUpdate = true;
    }

    // Small Hexagon Geometries
    const socketGeo = new THREE.ExtrudeGeometry(makeHexShape(HEX_RADIUS * 0.95), {
      depth: 0.008,
      bevelEnabled: true,
      bevelSegments: 2,
      steps: 1,
      bevelSize: 0.004,
      bevelThickness: 0.003
    });
    const socketMat = new THREE.MeshStandardMaterial({
      color: 0x0a1419,
      roughness: 0.3,
      metalness: 0.72,
      transparent: true,
      opacity: 0.88
    });

    const tileRadius = HEX_RADIUS * 0.84;
    const hexGeo = new THREE.ExtrudeGeometry(makeHexShape(tileRadius), {
      depth: 0.019,
      bevelEnabled: true,
      bevelSegments: 3,
      steps: 1,
      bevelSize: 0.005,
      bevelThickness: 0.005
    });
    applyCenteredHexUVs(hexGeo, tileRadius);

    const ringGeo = new THREE.RingGeometry(HEX_RADIUS * 0.72, HEX_RADIUS * 0.84, 6);
    // Extra inner diamond/hex sigil for "Super Charge" (2x power) tiles!
    const superSigilGeo = new THREE.RingGeometry(HEX_RADIUS * 0.32, HEX_RADIUS * 0.44, 6);
    const haloPlaneGeo = new THREE.PlaneGeometry(HEX_RADIUS * 2.8, HEX_RADIUS * 2.8);

    // --- Center Power-Core Hexagon ---
    const centerSocketGeo = new THREE.ExtrudeGeometry(makeHexShape(CENTER_HEX_RADIUS * 1.03), {
      depth: 0.012,
      bevelEnabled: true,
      bevelSegments: 3,
      steps: 1,
      bevelSize: 0.006,
      bevelThickness: 0.005
    });

    const centerCoreRadius = CENTER_HEX_RADIUS * 0.86;
    const centerHexGeo = new THREE.ExtrudeGeometry(makeHexShape(centerCoreRadius), {
      depth: 0.025,
      bevelEnabled: true,
      bevelSegments: 4,
      steps: 1,
      bevelSize: 0.006,
      bevelThickness: 0.006
    });
    applyCenteredHexUVs(centerHexGeo, centerCoreRadius);

    const centerRimBandGeo = new THREE.RingGeometry(CENTER_HEX_RADIUS * 0.84, CENTER_HEX_RADIUS * 0.99, 6);
    const centerOuterWhiteRimGeo = new THREE.RingGeometry(CENTER_HEX_RADIUS * 0.98, CENTER_HEX_RADIUS * 1.03, 6);
    const centerHaloGeo = new THREE.PlaneGeometry(CENTER_HEX_RADIUS * 3.5, CENTER_HEX_RADIUS * 3.5);

    const centerCanvas = document.createElement('canvas');
    centerCanvas.width = 512;
    centerCanvas.height = 512;
    const centerCtx = centerCanvas.getContext('2d');
    const centerGaugeTex = new THREE.CanvasTexture(centerCanvas);

    const centerMat = new THREE.MeshBasicMaterial({ map: centerGaugeTex });
    const centerRimBandMat = new THREE.MeshBasicMaterial({ color: COLOR_PALETTE[0].hex });
    const centerOuterWhiteRimMat = new THREE.MeshBasicMaterial({
      color: COLOR_PALETTE[0].rim,
      transparent: true,
      opacity: 0.95
    });
    const centerHaloMat = new THREE.MeshBasicMaterial({
      color: COLOR_PALETTE[0].halo,
      map: bloomHaloTex,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const centerBeaconGroup = new THREE.Group();
    const centerSocketMesh = new THREE.Mesh(centerSocketGeo, socketMat);
    const centerHaloMesh = new THREE.Mesh(centerHaloGeo, centerHaloMat);
    centerHaloMesh.position.z = 0.008;

    const centerBeaconMesh = new THREE.Mesh(centerHexGeo, centerMat);
    centerBeaconMesh.position.z = 0.010;

    const centerRimBand = new THREE.Mesh(centerRimBandGeo, centerRimBandMat);
    centerRimBand.position.z = 0.032;

    const centerOuterWhiteRim = new THREE.Mesh(centerOuterWhiteRimGeo, centerOuterWhiteRimMat);
    centerOuterWhiteRim.position.z = 0.034;

    centerBeaconMesh.add(centerRimBand, centerOuterWhiteRim);
    centerBeaconGroup.add(centerSocketMesh, centerHaloMesh, centerBeaconMesh);
    centerBeaconGroup.position.set(0, 0, 0.008);
    boardRoot.add(centerBeaconGroup);

    // Rising micro-bubbles inside the center liquid energy
    const liquidBubbles = Array.from({ length: 14 }, () => ({
      x: 90 + Math.random() * 332,
      y: Math.random() * 512,
      r: 3 + Math.random() * 6,
      spd: 45 + Math.random() * 65
    }));

    let lastDrawnSeconds = -1;
    let lastDrawnFill = -1;
    let lastDrawnColorIdx = -1;
    let lastDrawnStage = -1;
    let lastDrawnSegments = -1;

    function renderCenterGaugeCanvas(elapsed, dt) {
      const secInt = Math.max(0, Math.ceil(timeRemaining));
      const quantizedFill = Math.round(displayFill * 250) / 250;
      const isAnimatingWave = quantizedFill > 0.005 && quantizedFill < 0.995;

      if (
        !isAnimatingWave &&
        secInt === lastDrawnSeconds &&
        quantizedFill === lastDrawnFill &&
        targetColorIdx === lastDrawnColorIdx &&
        stageNumber === lastDrawnStage &&
        requiredSegments === lastDrawnSegments
      ) {
        return;
      }

      lastDrawnSeconds = secInt;
      lastDrawnFill = quantizedFill;
      lastDrawnColorIdx = targetColorIdx;
      lastDrawnStage = stageNumber;
      lastDrawnSegments = requiredSegments;

      const pal = COLOR_PALETTE[targetColorIdx];
      const w = 512;
      const h = 512;

      // 1. Deep dark glass interior
      centerCtx.fillStyle = '#071015';
      centerCtx.fillRect(0, 0, w, h);

      // Subtle inner hexagonal grid pattern inside the hollow gauge
      centerCtx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      centerCtx.lineWidth = 2;
      for (let gx = 64; gx < w; gx += 64) {
        centerCtx.beginPath();
        centerCtx.moveTo(gx, 0);
        centerCtx.lineTo(gx, h);
        centerCtx.stroke();
      }
      for (let gy = 64; gy < h; gy += 64) {
        centerCtx.beginPath();
        centerCtx.moveTo(0, gy);
        centerCtx.lineTo(w, gy);
        centerCtx.stroke();
      }

      // 2. Dual-Wave Liquid Energy Fill + Rising Bubbles
      if (quantizedFill > 0.002) {
        const fillHeight = h * quantizedFill;
        const topY = h - fillHeight;

        // Back secondary wave (darker, offset phase for depth)
        centerCtx.fillStyle = pal.cssDark;
        centerCtx.beginPath();
        centerCtx.moveTo(0, h);
        for (let x = 0; x <= w; x += 16) {
          const wy = topY + Math.sin(x * 0.022 - elapsed * 4.5) * 8 - 3;
          centerCtx.lineTo(x, wy);
        }
        centerCtx.lineTo(w, h);
        centerCtx.closePath();
        centerCtx.fill();

        // Main luminous liquid gradient
        const grad = centerCtx.createLinearGradient(0, topY, 0, h);
        grad.addColorStop(0.0, pal.cssLight);
        grad.addColorStop(0.25, pal.css);
        grad.addColorStop(1.0, pal.cssDark);

        centerCtx.fillStyle = grad;
        centerCtx.beginPath();
        centerCtx.moveTo(0, h);
        for (let x = 0; x <= w; x += 16) {
          const wy = quantizedFill < 0.99
            ? topY + Math.sin(x * 0.026 + elapsed * 6.2) * 6
            : topY;
          centerCtx.lineTo(x, wy);
        }
        centerCtx.lineTo(w, h);
        centerCtx.closePath();
        centerCtx.fill();

        // Rising effervescent energy bubbles inside the filled portion
        centerCtx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        for (const b of liquidBubbles) {
          b.y -= b.spd * dt;
          if (b.y < topY + 8) {
            b.y = h - 10;
            b.x = 95 + Math.random() * 322;
          }
          if (b.y > topY + 6) {
            centerCtx.beginPath();
            centerCtx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            centerCtx.fill();
          }
        }

        // Crisp glowing meniscus highlight line
        if (quantizedFill < 0.99) {
          centerCtx.strokeStyle = '#ffffff';
          centerCtx.lineWidth = 6;
          centerCtx.beginPath();
          for (let x = 0; x <= w; x += 16) {
            const wy = topY + Math.sin(x * 0.026 + elapsed * 6.2) * 6;
            if (x === 0) centerCtx.moveTo(x, wy);
            else centerCtx.lineTo(x, wy);
          }
          centerCtx.stroke();
        }
      }

      // 3. Segmented Charge Ring Around Timer (Shows exact required segments for this stage!)
      centerCtx.save();
      const ringRadius = 114;
      const gapAngle = 0.09;
      const sliceAngle = (Math.PI * 2) / requiredSegments;
      centerCtx.lineWidth = 12;
      centerCtx.lineCap = 'round';

      for (let s = 0; s < requiredSegments; s++) {
        const startA = -Math.PI / 2 + s * sliceAngle + gapAngle * 0.5;
        const endA = -Math.PI / 2 + (s + 1) * sliceAngle - gapAngle * 0.5;
        const isCharged = s < filledSegments;

        centerCtx.strokeStyle = isCharged ? '#ffffff' : 'rgba(255, 255, 255, 0.18)';
        centerCtx.beginPath();
        centerCtx.arc(256, 246, ringRadius, startA, endA);
        centerCtx.stroke();
      }

      // Dark backing disc behind countdown digits
      centerCtx.fillStyle = 'rgba(6, 14, 18, 0.62)';
      centerCtx.beginPath();
      centerCtx.arc(256, 246, 92, 0, Math.PI * 2);
      centerCtx.fill();

      // Countdown Timer Digits
      centerCtx.textAlign = 'center';
      centerCtx.textBaseline = 'middle';
      centerCtx.font = '800 112px system-ui, -apple-system, sans-serif';
      centerCtx.fillStyle = (secInt <= 5 && stageClearPause <= 0) ? '#ff8a80' : '#ffffff';
      centerCtx.fillText(String(secInt), 256, 248);

      // Stage Indicator Pill at Bottom
      centerCtx.font = '800 26px system-ui, -apple-system, sans-serif';
      centerCtx.fillStyle = pal.cssLight;
      centerCtx.fillText(`STAGE ${stageNumber}`, 256, 392);
      centerCtx.restore();

      centerGaugeTex.needsUpdate = true;
    }

    // --- Tile Grid & Dynamic Difficulty Stage Setup ---
    let tiles = [];

    function lightTileWithColor(tile, cIdx, isSuper = false) {
      const pal = COLOR_PALETTE[cIdx];
      tile.isLit = true;
      tile.colorIdx = cIdx;
      tile.isSuper = isSuper;

      tile.mat.color.setHex(pal.hex);
      tile.mat.emissive.setHex(pal.emissive);
      tile.mat.emissiveIntensity = isSuper ? 1.75 : 1.38;
      tile.mat.opacity = 1.0;

      tile.rimMat.color.setHex(isSuper ? 0xffffff : pal.rim);
      tile.rimMat.opacity = 1.0;

      tile.superSigil.visible = isSuper;
      tile.superSigilMat.color.setHex(0xffffff);

      tile.haloMat.color.setHex(pal.halo);
      tile.haloMesh.visible = true;
    }

    function resetTileToIdle(t) {
      t.isLit = false;
      t.isSuper = false;
      t.mat.color.setHex(0x142830);
      t.mat.emissive.setHex(0x09181e);
      t.mat.emissiveIntensity = 0.25;
      t.mat.opacity = 0.88;

      t.rimMat.color.setHex(0x284e5c);
      t.rimMat.opacity = 0.55;

      t.superSigil.visible = false;
      t.haloMesh.visible = false;
    }

    function computeStageRequirements(stage, availableTileCount) {
      // Varies up and down across stages while gradually trending slightly higher
      const basePatternVal = STAGE_COUNT_PATTERN[(stage - 1) % STAGE_COUNT_PATTERN.length];
      const cycleBonus = Math.floor((stage - 1) / STAGE_COUNT_PATTERN.length);
      const rawNeeded = basePatternVal + cycleBonus;
      const clampedNeeded = Math.min(Math.max(2, Math.floor(availableTileCount * 0.52)), Math.max(3, rawNeeded));

      // Adjust round duration based on tile count & stage pacing (always fair, slightly tighter later)
      const stageSpeedTrim = Math.min(4.0, (stage - 1) * 0.45);
      const duration = Math.max(14.0, Math.min(24.0, 15.0 + clampedNeeded * 1.15 - stageSpeedTrim));

      return { needed: clampedNeeded, duration };
    }

    function startNewStage(advanceColor = true, withRipple = true) {
      if (advanceColor) {
        stageNumber++;
        targetColorIdx = (targetColorIdx + 1) % COLOR_PALETTE.length;
      }

      const pal = COLOR_PALETTE[targetColorIdx];
      centerRimBandMat.color.setHex(pal.hex);
      centerOuterWhiteRimMat.color.setHex(pal.rim);
      centerHaloMat.color.setHex(pal.halo);
      reactorLight.color.setHex(pal.hex);
      reactorLight.intensity = 1.4;

      // Clear in-flight energy packets
      for (let i = powerPulses.length - 1; i >= 0; i--) {
        const pp = powerPulses[i];
        boardRoot.remove(pp.mesh);
        pp.mat.dispose();
        pp.haloMat.dispose();
        pp.trails.forEach(tr => {
          boardRoot.remove(tr.mesh);
          tr.mat.dispose();
        });
      }
      powerPulses.length = 0;

      const req = computeStageRequirements(stageNumber, tiles.length || 12);
      requiredSegments = req.needed;
      roundDuration = req.duration;
      timeRemaining = roundDuration;
      lastTickSecond = -1;

      filledSegments = 0;
      spawnedTargetPoints = 0;
      targetFill = 0.0;
      displayFill = 0.0;
      stageClearPause = 0;
      stageSwapTimer = 0;

      if (withRipple) {
        spawnBoardRipple(centerBeaconGroup.position, pal.halo, 2.1);
      }

      if (tiles.length === 0) return;
      for (const t of tiles) resetTileToIdle(t);

      const shuffled = [...tiles].sort(() => Math.random() - 0.5);
      let idx = 0;

      // On Stage 2+, occasionally include a 2x "Super Charge" tile (inner ring) when 4+ segments are needed
      const useSuperTile = (stageNumber >= 2 && requiredSegments >= 4 && Math.random() < 0.55);
      let remainingUnits = requiredSegments;

      if (useSuperTile && idx < shuffled.length) {
        lightTileWithColor(shuffled[idx++], targetColorIdx, true);
        remainingUnits -= 2;
      }

      while (remainingUnits > 0 && idx < shuffled.length) {
        lightTileWithColor(shuffled[idx++], targetColorIdx, false);
        remainingUnits -= 1;
      }

      // Distractor count gently scales with stage number for higher visual challenge
      const maxDistractors = Math.min(shuffled.length - idx, 4 + Math.min(6, stageNumber));
      for (let i = 0; i < maxDistractors; i++, idx++) {
        let otherColor = Math.floor(Math.random() * COLOR_PALETTE.length);
        if (otherColor === targetColorIdx) {
          otherColor = (otherColor + 1) % COLOR_PALETTE.length;
        }
        lightTileWithColor(shuffled[idx], otherColor, false);
      }

      renderCenterGaugeCanvas(0, 0);
    }

    // Gentle mid-round shift on Stage 3+: one uncollected target tile hops to an empty socket every ~4.5s
    function shiftOneTargetTile() {
      const activeTargets = tiles.filter(t => t.isLit && t.colorIdx === targetColorIdx);
      const idleSockets = tiles.filter(t => !t.isLit);
      if (activeTargets.length === 0 || idleSockets.length === 0) return;

      const src = activeTargets[Math.floor(Math.random() * activeTargets.length)];
      const dst = idleSockets[Math.floor(Math.random() * idleSockets.length)];
      const wasSuper = src.isSuper;

      resetTileToIdle(src);
      lightTileWithColor(dst, targetColorIdx, wasSuper);
      spawnBoardRipple(dst.mesh.position, COLOR_PALETTE[targetColorIdx].halo, 0.85);
    }

    // Celebratory outward wave across all board tiles when a stage completes
    function triggerStageClearWave() {
      for (const t of tiles) {
        const dist = Math.hypot(t.localX, t.localY);
        t.waveDelay = -dist * 0.25;
      }
    }

    function rebuildHexGrid() {
      while (hexContainer.children.length > 0) {
        hexContainer.remove(hexContainer.children[0]);
      }
      tiles = [];

      const halfW = boardState.width / 2 - HEX_RADIUS * 0.98;
      const halfH = boardState.height / 2 - HEX_RADIUS * 0.98;
      if (halfW <= 0 || halfH <= 0) return;

      const dx = HEX_RADIUS * 1.56;
      const dy = HEX_RADIUS * Math.sqrt(3) * 0.93;
      const centerClearance = CENTER_HEX_RADIUS + HEX_RADIUS * 1.05;
      let col = 0;

      for (let x = -halfW; x <= halfW; x += dx) {
        const yOffset = (col % 2 === 1) ? dy * 0.5 : 0;
        for (let y = -halfH + yOffset; y <= halfH; y += dy) {
          if (Math.hypot(x, y) < centerClearance) continue;

          const socketMesh = new THREE.Mesh(socketGeo, socketMat);
          socketMesh.position.set(x, y, 0.002);
          hexContainer.add(socketMesh);

          const haloMat = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            map: bloomHaloTex,
            transparent: true,
            opacity: 0.72,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          const haloMesh = new THREE.Mesh(haloPlaneGeo, haloMat);
          haloMesh.position.set(x, y, 0.006);
          haloMesh.visible = false;
          hexContainer.add(haloMesh);

          const tileMat = new THREE.MeshPhysicalMaterial({
            color: 0x142830,
            map: diffuserTex,
            emissive: 0x09181e,
            emissiveMap: diffuserTex,
            emissiveIntensity: 0.25,
            roughness: 0.14,
            metalness: 0.05,
            clearcoat: 1.0,
            clearcoatRoughness: 0.08,
            transparent: true,
            opacity: 0.88
          });
          const rimMat = new THREE.MeshBasicMaterial({
            color: 0x284e5c,
            transparent: true,
            opacity: 0.55
          });
          const superSigilMat = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.95
          });

          const mesh = new THREE.Mesh(hexGeo, tileMat);
          const rim = new THREE.Mesh(ringGeo, rimMat);
          rim.position.z = 0.025;
          const superSigil = new THREE.Mesh(superSigilGeo, superSigilMat);
          superSigil.position.z = 0.026;
          superSigil.visible = false;
          mesh.add(rim, superSigil);

          mesh.position.set(x, y, 0.006);
          hexContainer.add(mesh);

          tiles.push({
            mesh,
            rim,
            superSigil,
            haloMesh,
            mat: tileMat,
            rimMat,
            superSigilMat,
            haloMat,
            localX: x,
            localY: y,
            worldPos: new THREE.Vector3(),
            isLit: false,
            isSuper: false,
            colorIdx: 0,
            popZ: 0.006,
            nudgeTimer: 0,
            waveDelay: 0
          });
        }
        col++;
      }

      startNewStage(false, false);
    }

    function updateBoardLayout(rebuildTiles = true) {
      boardRoot.position.set(boardState.x, boardState.y, boardState.z);
      boardRoot.rotation.set(0, boardState.yaw, 0);

      const w = boardState.width;
      const h = boardState.height;

      backPlane.scale.set(w, h, 1);
      backPlaneMat.opacity = isEditMode ? 0.62 : 0.34;

      topBar.scale.set(w, 1, 1);
      topBar.position.set(0, h / 2, 0.01);

      botBar.scale.set(w, 1, 1);
      botBar.position.set(0, -h / 2, 0.01);

      leftBar.scale.set(1, h, 1);
      leftBar.position.set(-w / 2, 0, 0.01);

      rightBar.scale.set(1, h, 1);
      rightBar.position.set(w / 2, 0, 0.01);

      frameMat.opacity = isEditMode ? 0.95 : 0.42;

      versionBadgeMesh.position.set(w / 2 - 0.11, -h / 2 - 0.032, 0.022);

      for (const ch of cornerHandles) {
        ch.mesh.visible = isEditMode;
        ch.mesh.position.set(ch.sx * (w / 2), ch.sy * (h / 2), 0.022);
      }

      lockBtn.visible = isEditMode;
      bringHereBtn.visible = isEditMode;
      editBtn.visible = !isEditMode;

      const dockY = -h / 2 - 0.095;
      lockBtn.position.set(-0.20, dockY, 0.025);
      bringHereBtn.position.set(0.20, dockY, 0.025);
      editBtn.position.set(0, -h / 2 - 0.085, 0.025);

      if (rebuildTiles) rebuildHexGrid();
    }

    function snapBoardInFrontOfUser(resetDimensions = false) {
      const headPos = new THREE.Vector3();
      const headDir = new THREE.Vector3();
      camera.getWorldPosition(headPos);
      camera.getWorldDirection(headDir);
      headDir.y = 0;
      if (headDir.lengthSq() < 0.001) headDir.set(0, 0, -1);
      headDir.normalize();

      boardState.x = headPos.x + headDir.x * 1.30;
      boardState.y = Math.max(0.95, headPos.y - 0.10);
      boardState.z = headPos.z + headDir.z * 1.30;
      boardState.yaw = Math.atan2(-headDir.x, -headDir.z);

      if (resetDimensions) {
        boardState.width = DEFAULT_SIZE.width;
        boardState.height = DEFAULT_SIZE.height;
      }
      updateBoardLayout(resetDimensions);
    }

    function setEditMode(enabled) {
      isEditMode = enabled;
      updateBoardLayout(false);
      saveBoardSize();
      if (!enabled) {
        timeRemaining = roundDuration;
        lastTickSecond = -1;
      }
    }

    updateBoardLayout(true);

    // =========================================================================
    // 4. POWER-LINE ENERGY PACKET & PARTICLE EFFECTS
    // =========================================================================
    function spawnPowerTransferPacket(startLocalX, startLocalY, pal, segmentUnits) {
      const mat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 1.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(energyOrbGeo, mat);
      mesh.scale.setScalar(segmentUnits > 1 ? 1.35 : 1.0);
      mesh.position.set(startLocalX, startLocalY, 0.018);
      boardRoot.add(mesh);

      const haloMat = new THREE.MeshBasicMaterial({
        color: pal.halo,
        map: bloomHaloTex,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const halo = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 0.18), haloMat);
      mesh.add(halo);

      // Luminous plasma trail behind the energy orb
      const trails = [];
      for (let i = 0; i < 5; i++) {
        const tMat = new THREE.MeshBasicMaterial({
          color: i % 2 === 0 ? pal.halo : pal.hex,
          transparent: true,
          opacity: 0.82 - i * 0.14,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const tMesh = new THREE.Mesh(energyTrailGeo, tMat);
        tMesh.position.set(startLocalX, startLocalY, 0.016);
        tMesh.scale.setScalar((0.9 - i * 0.14) * (segmentUnits > 1 ? 1.25 : 1.0));
        boardRoot.add(tMesh);
        trails.push({ mesh: tMesh, mat: tMat });
      }

      const perpX = -startLocalY * 0.24;
      const perpY = startLocalX * 0.24;

      powerPulses.push({
        mesh,
        mat,
        haloMat,
        trails,
        startX: startLocalX,
        startY: startLocalY,
        ctrlX: startLocalX * 0.5 + perpX,
        ctrlY: startLocalY * 0.5 + perpY,
        age: 0,
        duration: 0.36,
        pal,
        segmentUnits
      });
    }

    function spawnHexPopEffect(worldPos, colorHex, haloHex, isSuper = false) {
      const fMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const fMesh = new THREE.Mesh(flashSphereGeo, fMat);
      fMesh.position.copy(worldPos);
      scene.add(fMesh);
      activeEffects.push({
        mesh: fMesh, mat: fMat,
        vx: 0, vy: 0, vz: 0, rx: 0, ry: 0, rz: 0,
        age: 0, maxAge: 0.20, kind: 'scale', startScale: 0.7, endScale: isSuper ? 2.8 : 2.3
      });

      const rMat = new THREE.MeshBasicMaterial({
        color: haloHex,
        transparent: true,
        opacity: 0.95,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const rMesh = new THREE.Mesh(hexShockwaveGeo, rMat);
      rMesh.position.copy(worldPos);
      rMesh.rotation.y = boardState.yaw;
      scene.add(rMesh);
      activeEffects.push({
        mesh: rMesh, mat: rMat,
        vx: 0, vy: 0, vz: 0, rx: 0, ry: 0, rz: 0,
        age: 0, maxAge: 0.36, kind: 'scale', startScale: 0.65, endScale: isSuper ? 3.8 : 3.2
      });

      const shardCount = isSuper ? 16 : 11;
      for (let i = 0; i < shardCount; i++) {
        const mat = new THREE.MeshStandardMaterial({
          color: i % 2 === 0 ? colorHex : 0xffffff,
          emissive: colorHex,
          emissiveIntensity: 0.9,
          roughness: 0.1,
          flatShading: true,
          transparent: true,
          opacity: 1.0
        });
        const mesh = new THREE.Mesh(shardGeo, mat);
        mesh.position.copy(worldPos);
        scene.add(mesh);

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        const spd = 0.65 + Math.random() * 0.85;
        activeEffects.push({
          mesh, mat,
          vx: Math.sin(phi) * Math.cos(theta) * spd,
          vy: Math.cos(phi) * spd + 0.25,
          vz: Math.sin(phi) * Math.sin(theta) * spd,
          rx: (Math.random() - 0.5) * 16,
          ry: (Math.random() - 0.5) * 16,
          rz: (Math.random() - 0.5) * 16,
          age: 0,
          maxAge: 0.52,
          kind: 'shard'
        });
      }
    }

    // =========================================================================
    // 5. BARE-HAND TOUCH & SETUP RAY INPUT
    // =========================================================================
    const touchProbes = [];
    const raycaster = new THREE.Raycaster();
    let activeDrag = null;

    function handleRaySelectStart(origin, dir, dragOwner, pulseFn) {
      raycaster.set(origin, dir);

      if (isEditMode) {
        if (raycaster.intersectObject(lockBtn).length > 0) {
          playClickTone();
          if (pulseFn) pulseFn(0.45, 50);
          setEditMode(false);
          return true;
        }
        if (raycaster.intersectObject(bringHereBtn).length > 0) {
          playClickTone();
          if (pulseFn) pulseFn(0.45, 50);
          snapBoardInFrontOfUser(false);
          return true;
        }

        const cornerMeshes = cornerHandles.map(c => c.hitMesh);
        const cornerHits = raycaster.intersectObjects(cornerMeshes, false);
        if (cornerHits.length > 0) {
          const hitHandle = cornerHandles.find(c => c.hitMesh === cornerHits[0].object);
          if (hitHandle) {
            if (pulseFn) pulseFn(0.35, 40);
            activeDrag = {
              owner: dragOwner,
              type: 'resize',
              distance: cornerHits[0].distance
            };
            return true;
          }
        }

        const boardHits = raycaster.intersectObject(backPlane, false);
        if (boardHits.length > 0) {
          if (pulseFn) pulseFn(0.3, 35);
          const localHit = boardRoot.worldToLocal(boardHits[0].point.clone());
          activeDrag = {
            owner: dragOwner,
            type: 'move',
            distance: boardHits[0].distance,
            offsetLocalX: localHit.x,
            offsetLocalY: localHit.y
          };
          return true;
        }
      } else {
        if (raycaster.intersectObject(editBtn).length > 0) {
          playClickTone();
          if (pulseFn) pulseFn(0.45, 50);
          setEditMode(true);
          return true;
        }
      }
      return false;
    }

    function setupInputRayController(index) {
      const controller = renderer.xr.getController(index);
      scene.add(controller);

      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, -0.02),
        new THREE.Vector3(0, 0, -3.5)
      ]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x4dd0e1, transparent: true, opacity: 0.65 });
      const rayLine = new THREE.Line(lineGeo, lineMat);
      rayLine.visible = false;
      controller.add(rayLine);

      const state = {
        controller,
        rayLine,
        inputSource: null,
        connected: false,
        isHandSource: false
      };

      controller.addEventListener('connected', (e) => {
        state.inputSource = e.data;
        state.connected = true;
        state.isHandSource = Boolean(e.data && e.data.hand);
      });
      controller.addEventListener('disconnected', () => {
        state.inputSource = null;
        state.connected = false;
        state.isHandSource = false;
        rayLine.visible = false;
        if (activeDrag && activeDrag.owner === state) activeDrag = null;
      });

      const pulseHaptic = (strength = 0.45, ms = 40) => {
        const gp = state.inputSource && state.inputSource.gamepad;
        if (gp && gp.hapticActuators && gp.hapticActuators[0]) {
          gp.hapticActuators[0].pulse(strength, ms);
        }
      };

      const onSelectStart = () => {
        const origin = new THREE.Vector3();
        const dir = new THREE.Vector3();
        controller.getWorldPosition(origin);
        dir.set(0, 0, -1).applyQuaternion(controller.quaternion).normalize();
        handleRaySelectStart(origin, dir, state, pulseHaptic);
      };

      const onSelectEnd = () => {
        if (activeDrag && activeDrag.owner === state) {
          activeDrag = null;
          saveBoardSize();
        }
      };

      controller.addEventListener('selectstart', onSelectStart);
      controller.addEventListener('selectend', onSelectEnd);
      controller.addEventListener('squeezestart', onSelectStart);
      controller.addEventListener('squeezeend', onSelectEnd);

      return state;
    }

    function setupBareHand(index) {
      const hand = renderer.xr.getHand(index);
      scene.add(hand);

      const trackedJoints = [
        { name: 'index-finger-tip',          showCursor: true },
        { name: 'middle-finger-tip',         showCursor: false },
        { name: 'ring-finger-tip',           showCursor: false },
        { name: 'thumb-tip',                 showCursor: false },
        { name: 'middle-finger-metacarpal',  showCursor: false }
      ];

      for (const jCfg of trackedJoints) {
        let cursorGroup = null;
        if (jCfg.showCursor) {
          cursorGroup = new THREE.Group();
          const core = new THREE.Mesh(
            new THREE.SphereGeometry(0.011, 14, 14),
            new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.94 })
          );
          const aura = new THREE.Mesh(
            new THREE.SphereGeometry(0.024, 16, 16),
            new THREE.MeshBasicMaterial({
              color: 0x00e5ff,
              transparent: true,
              opacity: 0.38,
              blending: THREE.AdditiveBlending,
              depthWrite: false
            })
          );
          cursorGroup.add(core, aura);
          cursorGroup.visible = false;
          scene.add(cursorGroup);
        }

        touchProbes.push({
          getPoint: (outPt) => {
            const joint = hand.joints && hand.joints[jCfg.name];
            if (!joint) {
              if (cursorGroup) cursorGroup.visible = false;
              return false;
            }
            joint.getWorldPosition(outPt);
            if (outPt.lengthSq() < 0.0001) {
              if (cursorGroup) cursorGroup.visible = false;
              return false;
            }
            if (cursorGroup) {
              cursorGroup.position.copy(outPt);
              cursorGroup.visible = true;
            }
            return true;
          }
        });
      }
    }

    const rayControllers = [setupInputRayController(0), setupInputRayController(1)];
    setupBareHand(0);
    setupBareHand(1);

    // --- Check WebXR Support & Start AR ---
    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-ar').then(supported => {
        if (supported) {
          startBtn.disabled = false;
          startBtn.textContent = 'START AR';
        } else {
          startBtn.textContent = 'AR Not Supported Here';
          statusEl.textContent = 'Open this page inside the Meta Quest Browser on Quest 3.';
        }
      }).catch(err => {
        statusEl.textContent = 'XR Check Error: ' + err.message;
      });
    } else {
      startBtn.textContent = 'WebXR Unavailable';
      statusEl.textContent = 'Requires HTTPS and Meta Quest Browser.';
    }

    startBtn.addEventListener('click', async () => {
      try {
        statusEl.textContent = 'Launching AR...';
        initAudio();

        isEditMode = true;
        needsInitialSnapToFront = true;
        stageNumber = 1;
        targetColorIdx = 0; // Purple first
        rebuildHexGrid();
        updateBoardLayout(false);

        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['local-floor'],
          optionalFeatures: ['hand-tracking']
        });

        launchScreen.style.display = 'none';
        statusEl.textContent = '';

        renderer.xr.setReferenceSpaceType('local-floor');
        await renderer.xr.setSession(session);

        session.addEventListener('end', () => {
          activeDrag = null;
          launchScreen.style.display = 'block';
        });
      } catch (err) {
        launchScreen.style.display = 'block';
        statusEl.textContent = 'Could not start AR: ' + err.message;
      }
    });

    // --- Helper for Board-Local Button Poke Detection ---
    function isPointInsideBoardButton(localPt, btnObj) {
      const bx = btnObj.mesh.position.x;
      const by = btnObj.mesh.position.y;
      return (
        Math.abs(localPt.x - bx) <= btnObj.w * 0.56 &&
        Math.abs(localPt.y - by) <= btnObj.h * 0.65 &&
        localPt.z >= -0.09 &&
        localPt.z <= 0.12
      );
    }

    // =========================================================================
    // 6. MAIN FRAME LOOP
    // =========================================================================
    const clock = new THREE.Clock();
    const probePt = new THREE.Vector3();
    const rayOrigin = new THREE.Vector3();
    const rayDir = new THREE.Vector3();
    const targetWorldPt = new THREE.Vector3();
    const localPt = new THREE.Vector3();

    const HEX_HIT_RADIUS = HEX_RADIUS * 1.18;
    let buttonCooldownUntil = 0;

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      // Snap board directly in front of the user on the first tracked XR frame
      if (needsInitialSnapToFront) {
        camera.getWorldPosition(targetWorldPt);
        if (targetWorldPt.lengthSq() > 0.0001) {
          snapBoardInFrontOfUser(false);
          needsInitialSnapToFront = false;
        }
      }

      // Show aiming rays only during Wall Setup Mode (for controllers; hand pinch rays stay invisible)
      for (const rc of rayControllers) {
        rc.rayLine.visible = isEditMode && rc.connected && !rc.isHandSource;
      }

      // 1. Handle Active Board Dragging or Corner Resizing
      if (activeDrag && isEditMode) {
        activeDrag.owner.controller.getWorldPosition(rayOrigin);
        rayDir.set(0, 0, -1).applyQuaternion(activeDrag.owner.controller.quaternion).normalize();
        targetWorldPt.copy(rayOrigin).addScaledVector(rayDir, activeDrag.distance);

        if (activeDrag.type === 'move') {
          const flatDirX = -rayDir.x;
          const flatDirZ = -rayDir.z;
          if (flatDirX * flatDirX + flatDirZ * flatDirZ > 0.01) {
            boardState.yaw = Math.atan2(flatDirX, flatDirZ);
          }

          const cosY = Math.cos(boardState.yaw);
          const sinY = Math.sin(boardState.yaw);
          const worldOffsetX = activeDrag.offsetLocalX * cosY;
          const worldOffsetZ = -activeDrag.offsetLocalX * sinY;

          boardState.x = targetWorldPt.x - worldOffsetX;
          boardState.y = Math.max(0.45, targetWorldPt.y - activeDrag.offsetLocalY);
          boardState.z = targetWorldPt.z - worldOffsetZ;
          updateBoardLayout(false);
        } else if (activeDrag.type === 'resize') {
          localPt.copy(targetWorldPt);
          boardRoot.worldToLocal(localPt);

          const newWidth = Math.max(0.85, Math.min(4.2, Math.abs(localPt.x) * 2));
          const newHeight = Math.max(0.75, Math.min(3.0, Math.abs(localPt.y) * 2));

          if (Math.abs(newWidth - boardState.width) > 0.015 || Math.abs(newHeight - boardState.height) > 0.015) {
            boardState.width = newWidth;
            boardState.height = newHeight;
            updateBoardLayout(true);
          }
        }
      }

      // 2. Stage Timer, Progressive Tile Shifts & Power-Fill Progression
      if (!isEditMode) {
        if (stageClearPause > 0) {
          stageClearPause -= dt;
          if (stageClearPause <= 0) {
            startNewStage(true, true);
          }
        } else {
          timeRemaining -= dt;
          const secCeil = Math.ceil(timeRemaining);
          if (secCeil <= 4 && secCeil >= 1 && secCeil !== lastTickSecond) {
            lastTickSecond = secCeil;
            playSoftCountdownTick(secCeil);
          }

          // Gentle difficulty escalation on Stage 3+: uncollected target tiles occasionally shift sockets
          if (stageNumber >= 3) {
            const shiftInterval = Math.max(3.2, 6.2 - (stageNumber - 3) * 0.45);
            stageSwapTimer += dt;
            if (stageSwapTimer >= shiftInterval) {
              stageSwapTimer = 0;
              shiftOneTargetTile();
            }
          }

          if (timeRemaining <= 0) {
            timeRemaining = 0;
            playGentleResetTone();
            startNewStage(false, true);
          }
        }
      }

      // Smooth liquid fill interpolation + dynamic point-light decay
      displayFill += (targetFill - displayFill) * Math.min(1, dt * 8.5);
      if (Math.abs(targetFill - displayFill) < 0.002) displayFill = targetFill;

      coreFlashBoost = Math.max(0, coreFlashBoost - dt * 3.5);
      reactorLight.intensity = 1.25 + displayFill * 0.9 + coreFlashBoost * 2.2;

      // Stage completion once all energy packets have docked and filled the center hexagon
      if (!isEditMode && stageClearPause <= 0 && filledSegments >= requiredSegments && displayFill >= 0.985) {
        displayFill = 1.0;
        stageClearPause = 1.15;
        coreFlashBoost = 1.5;
        const pal = COLOR_PALETTE[targetColorIdx];
        spawnBoardRipple(centerBeaconGroup.position, pal.halo, 2.4);
        triggerStageClearWave();
        playStageCompleteFanfare();
      }

      renderCenterGaugeCanvas(elapsed, dt);

      // 3. Animate Center Reactor & Wall Hexagons
      boardRoot.updateMatrixWorld(true);

      const beaconPulse = 1.0 + Math.sin(elapsed * 3.8) * 0.032 + (stageClearPause > 0 ? 0.065 : 0);
      centerBeaconMesh.scale.setScalar(beaconPulse);
      centerHaloMat.opacity = 0.58 + displayFill * 0.36 + Math.sin(elapsed * 4.0) * 0.08;

      const stagePal = COLOR_PALETTE[targetColorIdx];

      for (let i = 0; i < tiles.length; i++) {
        const t = tiles[i];
        if (t.nudgeTimer > 0) {
          t.nudgeTimer = Math.max(0, t.nudgeTimer - dt);
        }

        // Celebratory cascade wave when stage completes
        let waveZ = 0;
        if (t.waveDelay !== 0) {
          t.waveDelay += dt * 1.9;
          if (t.waveDelay > 0 && t.waveDelay < 0.55) {
            const env = Math.sin((t.waveDelay / 0.55) * Math.PI);
            waveZ = env * 0.028;
            t.mat.color.setHex(stagePal.hex);
            t.mat.emissive.setHex(stagePal.emissive);
            t.mat.emissiveIntensity = 0.5 + env * 1.4;
            t.haloMat.color.setHex(stagePal.halo);
            t.haloMat.opacity = env * 0.85;
            t.haloMesh.visible = true;
          } else if (t.waveDelay >= 0.55) {
            t.waveDelay = 0;
            if (!t.isLit) resetTileToIdle(t);
          }
        }

        const isMatchingColor = t.isLit && (t.colorIdx === targetColorIdx);
        const breathe = (t.isLit && !isEditMode) ? Math.sin(elapsed * 4.8 + i * 0.7) : 0;

        if (t.isLit && !isEditMode) {
          const baseEmissive = t.isSuper ? 1.75 : 1.42;
          t.mat.emissiveIntensity = isMatchingColor ? (baseEmissive + breathe * 0.30) : 1.12;
          t.haloMat.opacity = isMatchingColor ? (0.72 + breathe * 0.18) : 0.44;
          const s = isMatchingColor ? (1.0 + breathe * (t.isSuper ? 0.042 : 0.025)) : 1.0;
          t.mesh.scale.setScalar(s);
          if (t.isSuper) {
            t.superSigil.rotation.z = elapsed * 1.4;
          }
        } else {
          t.mesh.scale.setScalar(1.0);
        }

        const pulseZ = isMatchingColor ? breathe * 0.004 : 0;
        const nudgeDip = t.nudgeTimer > 0 ? -Math.sin((t.nudgeTimer / 0.25) * Math.PI) * 0.014 : 0;
        const targetZ = ((t.isLit && !isEditMode) ? (0.026 + pulseZ + nudgeDip) : 0.006) + waveZ;

        t.popZ += (targetZ - t.popZ) * Math.min(1, dt * 15);
        t.mesh.position.z = t.popZ;
        if (t.isLit) t.mesh.getWorldPosition(t.worldPos);
      }

      // 4. Animate Travelling Energy Packets Along Invisible Power Lines Into Center
      for (let i = powerPulses.length - 1; i >= 0; i--) {
        const pp = powerPulses[i];
        pp.age += dt;
        const rawT = Math.min(1, pp.age / pp.duration);
        const t = rawT < 0.5 ? 2 * rawT * rawT : 1 - Math.pow(-2 * rawT + 2, 2) / 2;

        const invT = 1 - t;
        const bx = invT * invT * pp.startX + 2 * invT * t * pp.ctrlX;
        const by = invT * invT * pp.startY + 2 * invT * t * pp.ctrlY;
        pp.mesh.position.set(bx, by, 0.025);

        for (let k = 0; k < pp.trails.length; k++) {
          const trailT = Math.max(0, t - (k + 1) * 0.055);
          const invTrail = 1 - trailT;
          const tx = invTrail * invTrail * pp.startX + 2 * invTrail * trailT * pp.ctrlX;
          const ty = invTrail * invTrail * pp.startY + 2 * invTrail * trailT * pp.ctrlY;
          pp.trails[k].mesh.position.set(tx, ty, 0.022);
        }

        if (rawT >= 1) {
          filledSegments = Math.min(requiredSegments, filledSegments + pp.segmentUnits);
          targetFill = Math.min(1.0, filledSegments / requiredSegments);
          coreFlashBoost = 1.0;

          spawnBoardRipple(centerBeaconGroup.position, pp.pal.halo, 1.45);
          playCoreDockSound(targetFill);

          boardRoot.remove(pp.mesh);
          pp.mat.dispose();
          pp.haloMat.dispose();
          pp.trails.forEach(tr => {
            boardRoot.remove(tr.mesh);
            tr.mat.dispose();
          });
          powerPulses.splice(i, 1);
        }
      }

      // 5. Bare-Hand Touch Detection (Buttons & Wall Hexagons)
      const nowMs = performance.now();
      for (let p = 0; p < touchProbes.length; p++) {
        const probe = touchProbes[p];
        if (!probe.getPoint(probePt)) continue;

        localPt.copy(probePt);
        boardRoot.worldToLocal(localPt);

        if (nowMs >= buttonCooldownUntil) {
          if (isEditMode) {
            if (isPointInsideBoardButton(localPt, lockBtnObj)) {
              buttonCooldownUntil = nowMs + 600;
              playClickTone();
              setEditMode(false);
              break;
            }
            if (isPointInsideBoardButton(localPt, bringHereBtnObj)) {
              buttonCooldownUntil = nowMs + 600;
              playClickTone();
              snapBoardInFrontOfUser(false);
              break;
            }
          } else {
            if (isPointInsideBoardButton(localPt, editBtnObj)) {
              buttonCooldownUntil = nowMs + 600;
              playClickTone();
              setEditMode(true);
              break;
            }
          }
        }

        if (isEditMode || stageClearPause > 0) continue;

        for (let i = 0; i < tiles.length; i++) {
          const t = tiles[i];
          if (!t.isLit) continue;

          const planarDist = Math.hypot(localPt.x - t.localX, localPt.y - t.localY);
          const isHit = (planarDist <= HEX_HIT_RADIUS && localPt.z >= -0.09 && localPt.z <= 0.11);

          if (isHit) {
            if (t.colorIdx === targetColorIdx) {
              const pal = COLOR_PALETTE[t.colorIdx];
              const units = t.isSuper ? 2 : 1;

              spawnBoardRipple(t.mesh.position, pal.halo, t.isSuper ? 1.35 : 1.1);
              spawnHexPopEffect(t.worldPos, pal.hex, pal.halo, t.isSuper);
              playTileTouchAndSurge(spawnedTargetPoints, t.isSuper);

              resetTileToIdle(t);
              spawnedTargetPoints += units;

              spawnPowerTransferPacket(t.localX, t.localY, pal, units);
            } else if (t.nudgeTimer <= 0) {
              t.nudgeTimer = 0.25;
              playGentleWrongTap();
            }
            break;
          }
        }
      }

      // 6. Animate Board Ripples & 3D Pop Particles
      for (let i = boardRipples.length - 1; i >= 0; i--) {
        const r = boardRipples[i];
        r.age += dt;
        const prog = r.age / 0.44;
        if (prog >= 1) {
          boardRoot.remove(r.mesh);
          r.mat.dispose();
          boardRipples.splice(i, 1);
        } else {
          r.mesh.scale.setScalar((1 + prog * 1.25) * (r.scaleMult || 1));
          r.mat.opacity = 0.92 * (1 - prog);
        }
      }

      for (let i = activeEffects.length - 1; i >= 0; i--) {
        const ef = activeEffects[i];
        ef.age += dt;
        const prog = ef.age / ef.maxAge;
        if (prog >= 1) {
          scene.remove(ef.mesh);
          ef.mat.dispose();
          activeEffects.splice(i, 1);
          continue;
        }

        if (ef.kind === 'scale') {
          const s = ef.startScale + (ef.endScale - ef.startScale) * (1 - Math.pow(1 - prog, 2));
          ef.mesh.scale.setScalar(s);
          ef.mat.opacity = 0.92 * (1 - prog);
        } else {
          ef.vy -= 2.1 * dt;
          ef.mesh.position.x += ef.vx * dt;
          ef.mesh.position.y += ef.vy * dt;
          ef.mesh.position.z += ef.vz * dt;
          ef.mesh.rotation.x += ef.rx * dt;
          ef.mesh.rotation.y += ef.ry * dt;
          ef.mesh.rotation.z += ef.rz * dt;
          ef.mat.opacity = 1.0 - prog;
        }
      }

      renderer.render(scene, camera);
    });
  </script>
</body>
