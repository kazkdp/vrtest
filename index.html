<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MR Color Match & Balloons</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0d171a;
      color: #e6f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #142429;
      border: 1px solid #244048;
      border-radius: 24px;
      padding: 28px 24px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      position: relative;
      z-index: 10;
    }
    h1 { font-size: 1.65rem; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.02em; }
    p.sub { color: #8fb3bd; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.45; }
    .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: #7fa3ad; margin-bottom: 8px; display: block; }
    .pill-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .pill {
      background: #0e1a1e;
      border: 2px solid #233d45;
      color: #b8d4dc;
      padding: 12px 6px;
      border-radius: 13px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill.active {
      background: #1b3d47;
      border-color: #4dd0e1;
      color: #ffffff;
    }
    #start-btn {
      width: 100%;
      padding: 19px;
      font-size: 1.2rem;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #26c6da, #00acc1);
      color: #06181c;
      cursor: pointer;
      margin-top: 6px;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    #start-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    #start-btn:active:not(:disabled) { transform: scale(0.98); }
    #status { margin-top: 12px; font-size: 0.84rem; color: #8fb3bd; min-height: 1.2em; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="card" id="menu-card">
    <h1>MR Color Match & Balloons</h1>
    <p class="sub">Match the big center hexagon color using your bare hands (or controller), and pop floating balloons.</p>

    <span class="label">1. Game Mode</span>
    <div class="pill-group" id="mode-group">
      <button class="pill active" data-val="both">Color Hex + Balloons</button>
      <button class="pill" data-val="hex">Color Hex Only</button>
      <button class="pill" data-val="balloons">Balloons Only</button>
    </div>

    <span class="label">2. Controller Blade (Optional)</span>
    <div class="pill-group" id="length-group">
      <button class="pill active" data-val="0.95">Saber (0.95m)</button>
      <button class="pill" data-val="0.55">Short Wand (0.55m)</button>
      <button class="pill" data-val="0.14">Touch Tip (0.14m)</button>
    </div>

    <button id="start-btn" disabled>Checking Quest XR...</button>
    <div id="status"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    const menuCard = document.getElementById('menu-card');
    const startBtn = document.getElementById('start-btn');
    const statusEl = document.getElementById('status');

    // Surface any unexpected setup error visibly instead of failing silently
    window.addEventListener('error', (e) => {
      statusEl.textContent = 'Error: ' + (e.message || 'Unknown error');
    });

    // --- Pre-AR Settings ---
    let playElements = 'both'; // 'both' | 'hex' | 'balloons'
    let bladeLength = 0.95;
    const bladeAngleDeg = 52;

    function bindPills(groupId, onChange) {
      const btns = document.querySelectorAll(`#${groupId} .pill`);
      btns.forEach(btn => {
        btn.addEventListener('click', () => {
          btns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          onChange(btn.dataset.val);
        });
      });
    }

    bindPills('mode-group', v => { playElements = v; });
    bindPills('length-group', v => { bladeLength = parseFloat(v); });

    // --- Procedural Sound Effects (Web Audio API) ---
    let audioCtx = null;
    let noiseBuffer = null;
    const pentatonicNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
    let noteIdx = 0;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const sampleRate = audioCtx.sampleRate;
      const len = Math.floor(sampleRate * 0.16);
      noiseBuffer = audioCtx.createBuffer(1, len, sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sampleRate * 0.032));
      }
    }

    function ensureAudioReady() {
      if (!audioCtx) return false;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return true;
    }

    function playHexChime() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const freq = pentatonicNotes[noteIdx % pentatonicNotes.length];
      noteIdx++;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.52);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.56);
    }

    function playColorChangeChime() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const notes = [392.00, 523.25];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        const t0 = now + idx * 0.07;
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.exponentialRampToValueAtTime(0.16, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.48);
      });
    }

    function playGentleWrongTap() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(165, now);
      osc.frequency.exponentialRampToValueAtTime(135, now + 0.14);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.07, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.18);
    }

    function playRealisticBalloonPop() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(195, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.085);
      oscGain.gain.setValueAtTime(0.32, now);
      oscGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.095);
      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.10);

      if (noiseBuffer) {
        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1400, now);
        filter.frequency.exponentialRampToValueAtTime(420, now + 0.12);
        filter.Q.value = 1.4;

        const nGain = audioCtx.createGain();
        nGain.gain.setValueAtTime(0.38, now);
        nGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);

        noise.connect(filter);
        filter.connect(nGain);
        nGain.connect(audioCtx.destination);
        noise.start(now);
      }
    }

    function playClickTone() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, now);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    }

    // --- Three.js Scene & Renderer ---
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    renderer.domElement.style.position = 'fixed';
    renderer.domElement.style.inset = '0';
    renderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 30);

    scene.add(new THREE.AmbientLight(0xffffff, 0.95));
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.95);
    keyLight.position.set(1.5, 3.2, 2.4);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xb2ebf2, 0.45);
    rimLight.position.set(-2.0, 1.0, 1.5);
    scene.add(rimLight);

    // --- Shared Effect & Balloon Geometries (Initialized Before Board Build) ---
    const shredGeo = new THREE.BufferGeometry();
    const shredVerts = new Float32Array([
      -0.024, -0.016,  0.006,
       0.026, -0.012, -0.005,
       0.002,  0.028,  0.008
    ]);
    shredGeo.setAttribute('position', new THREE.BufferAttribute(shredVerts, 3));
    shredGeo.computeVertexNormals();

    const shockwaveGeo = new THREE.RingGeometry(0.075, 0.105, 32);
    const flashSphereGeo = new THREE.SphereGeometry(0.095, 18, 18);
    const sparkGeo = new THREE.SphereGeometry(0.011, 8, 8);
    const shardGeo = new THREE.ConeGeometry(0.020, 0.050, 4);

    const activeEffects = [];
    const boardRipples = [];

    // --- Distinct, High-Contrast Color Palette for Matching ---
    const COLOR_PALETTE = [
      { name: 'Pink',   hex: 0xff5e84, rim: 0xffc2d1, light: 0xff9eb5 },
      { name: 'Blue',   hex: 0x29b6f6, rim: 0xb3e5fc, light: 0x81d4fa },
      { name: 'Gold',   hex: 0xffb300, rim: 0xffe082, light: 0xffd54f },
      { name: 'Green',  hex: 0x66bb6a, rim: 0xc8e6c9, light: 0xa5d6a7 },
      { name: 'Purple', hex: 0xab47bc, rim: 0xe1bee7, light: 0xce93d8 }
    ];

    // --- Saved Board Layout ---
    const STORAGE_KEY = 'mr_play_wall_layout_v1';
    const DEFAULT_STATE = {
      x: 0,
      y: 1.25,
      z: -1.35,
      yaw: 0,
      width: 1.90,
      height: 1.25
    };

    function loadBoardState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { state: { ...DEFAULT_STATE }, hasSaved: false };
        const parsed = JSON.parse(raw);
        return {
          state: {
            x: Number.isFinite(parsed.x) ? parsed.x : DEFAULT_STATE.x,
            y: Number.isFinite(parsed.y) ? parsed.y : DEFAULT_STATE.y,
            z: Number.isFinite(parsed.z) ? parsed.z : DEFAULT_STATE.z,
            yaw: Number.isFinite(parsed.yaw) ? parsed.yaw : DEFAULT_STATE.yaw,
            width: Math.max(0.75, Math.min(4.5, parsed.width || DEFAULT_STATE.width)),
            height: Math.max(0.65, Math.min(3.2, parsed.height || DEFAULT_STATE.height))
          },
          hasSaved: true
        };
      } catch {
        return { state: { ...DEFAULT_STATE }, hasSaved: false };
      }
    }

    function saveBoardState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(boardState));
      } catch {}
    }

    const loaded = loadBoardState();
    let boardState = loaded.state;
    let isEditMode = !loaded.hasSaved;
    let activeXRSession = null;

    // --- Movable & Resizable Game Board Group ---
    const boardRoot = new THREE.Group();
    scene.add(boardRoot);

    function spawnBoardRipple(localPos, colorHex, scaleMult = 1.0) {
      const mat = new THREE.MeshBasicMaterial({
        color: colorHex,
        transparent: true,
        opacity: 0.9,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(shockwaveGeo, mat);
      mesh.position.copy(localPos);
      mesh.position.z += 0.025;
      boardRoot.add(mesh);
      boardRipples.push({ mesh, mat, age: 0, scaleMult });
    }

    const backPlaneMat = new THREE.MeshBasicMaterial({
      color: 0x0d2229,
      transparent: true,
      opacity: 0.28,
      side: THREE.DoubleSide
    });
    const backPlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), backPlaneMat);
    boardRoot.add(backPlane);

    const frameMat = new THREE.MeshBasicMaterial({ color: 0x4dd0e1, transparent: true, opacity: 0.85 });
    const topBar = new THREE.Mesh(new THREE.BoxGeometry(1, 0.018, 0.018), frameMat);
    const botBar = new THREE.Mesh(new THREE.BoxGeometry(1, 0.018, 0.018), frameMat);
    const leftBar = new THREE.Mesh(new THREE.BoxGeometry(0.018, 1, 0.018), frameMat);
    const rightBar = new THREE.Mesh(new THREE.BoxGeometry(0.018, 1, 0.018), frameMat);
    boardRoot.add(topBar, botBar, leftBar, rightBar);

    const cornerHandles = [];
    const cornerSigns = [
      { sx: -1, sy:  1 },
      { sx:  1, sy:  1 },
      { sx: -1, sy: -1 },
      { sx:  1, sy: -1 }
    ];
    const handleGeo = new THREE.SphereGeometry(0.055, 20, 20);
    const handleHitGeo = new THREE.SphereGeometry(0.10, 12, 12);

    for (const sign of cornerSigns) {
      const hMat = new THREE.MeshBasicMaterial({ color: 0xffb74d });
      const visMesh = new THREE.Mesh(handleGeo, hMat);
      const hitMesh = new THREE.Mesh(handleHitGeo, new THREE.MeshBasicMaterial({ visible: false }));
      visMesh.add(hitMesh);
      visMesh.position.z = 0.02;
      boardRoot.add(visMesh);
      cornerHandles.push({ mesh: visMesh, hitMesh, mat: hMat, sx: sign.sx, sy: sign.sy });
    }

    function create3DButton(label, bgHex, textHex, w = 0.34, h = 0.095) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 144;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = bgHex;
      ctx.beginPath();
      ctx.roundRect(6, 6, 500, 132, 66);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 6;
      ctx.stroke();

      ctx.fillStyle = textHex;
      ctx.font = 'bold 46px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 256, 74);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      mesh.position.z = 0.025;
      return mesh;
    }

    // Edit Mode Dock Buttons
    const lockBtn = create3DButton('Lock & Play', '#26c6da', '#05181c', 0.34, 0.09);
    const resetBtn = create3DButton('Reset Center', '#1b3840', '#d0eaef', 0.34, 0.09);
    const editMenuBtn = create3DButton('Main Menu', '#2b1e29', '#f8bbd0', 0.32, 0.09);

    // Play Mode Dock Buttons (right next to each other)
    const editBtn = create3DButton('Move / Resize', '#162b32', '#9bd2dc', 0.32, 0.08);
    const playMenuBtn = create3DButton('Main Menu', '#2b1e29', '#f8bbd0', 0.28, 0.08);

    boardRoot.add(lockBtn, resetBtn, editMenuBtn, editBtn, playMenuBtn);

    // --- Hexagon Grid + Big Center Color Target Hexagon ---
    const hexContainer = new THREE.Group();
    boardRoot.add(hexContainer);

    const HEX_RADIUS = 0.125;
    const CENTER_HEX_RADIUS = 0.245;

    function makeHexShape(r) {
      const s = new THREE.Shape();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i === 0) s.moveTo(x, y);
        else s.lineTo(x, y);
      }
      s.closePath();
      return s;
    }

    const hexGeo = new THREE.ExtrudeGeometry(makeHexShape(HEX_RADIUS * 0.90), {
      depth: 0.016,
      bevelEnabled: true,
      bevelSegments: 2,
      steps: 1,
      bevelSize: 0.004,
      bevelThickness: 0.004
    });
    const ringGeo = new THREE.RingGeometry(HEX_RADIUS * 0.78, HEX_RADIUS * 0.92, 6);

    const centerHexGeo = new THREE.ExtrudeGeometry(makeHexShape(CENTER_HEX_RADIUS * 0.92), {
      depth: 0.024,
      bevelEnabled: true,
      bevelSegments: 3,
      steps: 1,
      bevelSize: 0.006,
      bevelThickness: 0.006
    });
    const centerOuterRingGeo = new THREE.RingGeometry(CENTER_HEX_RADIUS * 0.94, CENTER_HEX_RADIUS * 1.06, 6);
    const centerInnerRingGeo = new THREE.RingGeometry(CENTER_HEX_RADIUS * 0.74, CENTER_HEX_RADIUS * 0.82, 6);

    const centerMat = new THREE.MeshBasicMaterial({ color: COLOR_PALETTE[1].hex, transparent: true, opacity: 0.96 });
    const centerOuterRingMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95 });
    const centerInnerRingMat = new THREE.MeshBasicMaterial({ color: COLOR_PALETTE[1].rim, transparent: true, opacity: 0.95 });

    const centerBeaconGroup = new THREE.Group();
    const centerBeaconMesh = new THREE.Mesh(centerHexGeo, centerMat);
    const centerOuterRing = new THREE.Mesh(centerOuterRingGeo, centerOuterRingMat);
    centerOuterRing.position.z = 0.028;
    const centerInnerRing = new THREE.Mesh(centerInnerRingGeo, centerInnerRingMat);
    centerInnerRing.position.z = 0.031;
    centerBeaconMesh.add(centerOuterRing, centerInnerRing);
    centerBeaconGroup.add(centerBeaconMesh);
    centerBeaconGroup.position.set(0, 0, 0.014);
    boardRoot.add(centerBeaconGroup);

    let targetColorIdx = 1; // Starts with Blue
    let tiles = [];

    function setCenterTargetColor(newIdx, withRipple = true) {
      targetColorIdx = newIdx;
      const pal = COLOR_PALETTE[targetColorIdx];
      centerMat.color.setHex(pal.hex);
      centerInnerRingMat.color.setHex(pal.rim);
      if (withRipple) {
        spawnBoardRipple(centerBeaconGroup.position, pal.hex, 1.8);
      }
    }

    function lightTileWithColor(tile, cIdx) {
      const pal = COLOR_PALETTE[cIdx];
      tile.isLit = true;
      tile.colorIdx = cIdx;
      tile.mat.color.setHex(pal.hex);
      tile.mat.opacity = 0.94;
      tile.rimMat.color.setHex(pal.rim);
      tile.rimMat.opacity = 1.0;
    }

    function resetTileToIdle(t) {
      t.isLit = false;
      t.mat.color.setHex(0x132c33);
      t.mat.opacity = 0.45;
      t.rimMat.color.setHex(0x265c69);
      t.rimMat.opacity = 0.62;
    }

    function populateColorMatchRound(pickNewColor = true, withRipple = true) {
      if (tiles.length === 0) return;

      for (const t of tiles) resetTileToIdle(t);

      if (pickNewColor) {
        let nextIdx = Math.floor(Math.random() * COLOR_PALETTE.length);
        if (nextIdx === targetColorIdx) {
          nextIdx = (nextIdx + 1) % COLOR_PALETTE.length;
        }
        setCenterTargetColor(nextIdx, withRipple);
      } else {
        setCenterTargetColor(targetColorIdx, withRipple);
      }

      const shuffled = [...tiles].sort(() => Math.random() - 0.5);
      const matchCount = Math.min(3, Math.max(1, Math.floor(shuffled.length * 0.25)));
      const distractorCount = Math.min(6, Math.max(0, shuffled.length - matchCount));

      let idx = 0;
      for (let i = 0; i < matchCount; i++, idx++) {
        lightTileWithColor(shuffled[idx], targetColorIdx);
      }

      for (let i = 0; i < distractorCount; i++, idx++) {
        let otherColor = Math.floor(Math.random() * COLOR_PALETTE.length);
        if (otherColor === targetColorIdx) {
          otherColor = (otherColor + 1) % COLOR_PALETTE.length;
        }
        lightTileWithColor(shuffled[idx], otherColor);
      }
    }

    function rebuildHexGrid() {
      while (hexContainer.children.length > 0) {
        hexContainer.remove(hexContainer.children[0]);
      }
      tiles = [];

      const showHex = (playElements !== 'balloons');
      centerBeaconGroup.visible = showHex;
      if (!showHex) return;

      const halfW = boardState.width / 2 - HEX_RADIUS * 0.95;
      const halfH = boardState.height / 2 - HEX_RADIUS * 0.95;
      if (halfW <= 0 || halfH <= 0) return;

      const dx = HEX_RADIUS * 1.56;
      const dy = HEX_RADIUS * Math.sqrt(3) * 0.92;
      const centerClearance = CENTER_HEX_RADIUS + HEX_RADIUS * 1.05;
      let col = 0;

      for (let x = -halfW; x <= halfW; x += dx) {
        const yOffset = (col % 2 === 1) ? dy * 0.5 : 0;
        for (let y = -halfH + yOffset; y <= halfH; y += dy) {
          if (Math.hypot(x, y) < centerClearance) continue;

          const tileMat = new THREE.MeshBasicMaterial({ color: 0x132c33, transparent: true, opacity: 0.45 });
          const rimMat = new THREE.MeshBasicMaterial({ color: 0x265c69, transparent: true, opacity: 0.62 });
          const mesh = new THREE.Mesh(hexGeo, tileMat);
          const rim = new THREE.Mesh(ringGeo, rimMat);
          rim.position.z = 0.021;
          mesh.add(rim);

          mesh.position.set(x, y, 0.002);
          hexContainer.add(mesh);

          tiles.push({
            mesh,
            rim,
            mat: tileMat,
            rimMat,
            localX: x,
            localY: y,
            worldPos: new THREE.Vector3(),
            isLit: false,
            colorIdx: 0,
            popZ: 0.002,
            nudgeTimer: 0
          });
        }
        col++;
      }

      populateColorMatchRound(false, false);
    }

    function updateBoardLayout(rebuildTiles = true) {
      boardRoot.position.set(boardState.x, boardState.y, boardState.z);
      boardRoot.rotation.set(0, boardState.yaw, 0);

      const w = boardState.width;
      const h = boardState.height;

      backPlane.scale.set(w, h, 1);
      backPlaneMat.opacity = isEditMode ? 0.38 : 0.14;

      topBar.scale.set(w, 1, 1);
      topBar.position.set(0, h / 2, 0.01);

      botBar.scale.set(w, 1, 1);
      botBar.position.set(0, -h / 2, 0.01);

      leftBar.scale.set(1, h, 1);
      leftBar.position.set(-w / 2, 0, 0.01);

      rightBar.scale.set(1, h, 1);
      rightBar.position.set(w / 2, 0, 0.01);

      frameMat.opacity = isEditMode ? 0.95 : 0.30;

      for (const ch of cornerHandles) {
        ch.mesh.visible = isEditMode;
        ch.mesh.position.set(ch.sx * (w / 2), ch.sy * (h / 2), 0.02);
      }

      lockBtn.visible = isEditMode;
      resetBtn.visible = isEditMode;
      editMenuBtn.visible = isEditMode;

      editBtn.visible = !isEditMode;
      playMenuBtn.visible = !isEditMode;

      const dockY = -h / 2 - 0.09;
      lockBtn.position.set(-0.37, dockY, 0.025);
      resetBtn.position.set(0.00, dockY, 0.025);
      editMenuBtn.position.set(0.36, dockY, 0.025);

      editBtn.position.set(-0.17, -h / 2 - 0.08, 0.025);
      playMenuBtn.position.set(0.17, -h / 2 - 0.08, 0.025);

      if (rebuildTiles) rebuildHexGrid();
    }

    function setEditMode(enabled) {
      isEditMode = enabled;
      updateBoardLayout(false);
      saveBoardState();
    }

    function returnToMainMenu() {
      playClickTone();
      if (activeXRSession) {
        activeXRSession.end().catch(() => {});
      }
    }

    updateBoardLayout(true);

    // --- Balloons & Pop Effects ---
    const balloonPts = [
      new THREE.Vector2(0.000, -0.118),
      new THREE.Vector2(0.016, -0.114),
      new THREE.Vector2(0.008, -0.102),
      new THREE.Vector2(0.024, -0.088),
      new THREE.Vector2(0.052, -0.062),
      new THREE.Vector2(0.076, -0.025),
      new THREE.Vector2(0.089,  0.018),
      new THREE.Vector2(0.088,  0.058),
      new THREE.Vector2(0.072,  0.092),
      new THREE.Vector2(0.044,  0.112),
      new THREE.Vector2(0.000,  0.119)
    ];
    const balloonBodyGeo = new THREE.LatheGeometry(balloonPts, 28);
    const balloonNeckRingGeo = new THREE.TorusGeometry(0.012, 0.004, 8, 16);
    balloonNeckRingGeo.rotateX(Math.PI / 2);

    const ribbonCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0.009, -0.045, 0.005),
      new THREE.Vector3(-0.008, -0.095, -0.004),
      new THREE.Vector3(0.006, -0.145, 0.004),
      new THREE.Vector3(-0.003, -0.190, 0)
    ]);
    const balloonStringGeo = new THREE.TubeGeometry(ribbonCurve, 16, 0.0022, 6, false);
    const balloonStringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });

    const fallingBalloons = [];
    let spawnTimer = 0;

    function spawnBalloon() {
      if (playElements === 'hex' || isEditMode) return;
      if (fallingBalloons.length >= 5) return;

      const pal = COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)];
      const group = new THREE.Group();

      const mat = new THREE.MeshPhysicalMaterial({
        color: pal.hex,
        emissive: pal.hex,
        emissiveIntensity: 0.14,
        roughness: 0.16,
        metalness: 0.02,
        clearcoat: 1.0,
        clearcoatRoughness: 0.10
      });

      const body = new THREE.Mesh(balloonBodyGeo, mat);
      const knot = new THREE.Mesh(balloonNeckRingGeo, mat);
      knot.position.y = -0.106;

      const stringPivot = new THREE.Group();
      stringPivot.position.y = -0.114;
      const stringMesh = new THREE.Mesh(balloonStringGeo, balloonStringMat);
      stringPivot.add(stringMesh);

      group.add(body, knot, stringPivot);

      const localX = (Math.random() - 0.5) * Math.max(0.45, boardState.width - 0.28);
      const localY = boardState.height / 2 + 0.14;
      const localZ = 0.15 + Math.random() * 0.12;

      group.position.set(localX, localY, localZ);
      boardRoot.add(group);

      fallingBalloons.push({
        group,
        mat,
        stringPivot,
        colorHex: pal.hex,
        lightHex: pal.light,
        speed: 0.15 + Math.random() * 0.09,
        swayPhase: Math.random() * Math.PI * 2,
        baseX: localX,
        worldPos: new THREE.Vector3()
      });
    }

    function spawnShockwaveAndFlash(worldPos, colorHex) {
      const fMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.92 });
      const fMesh = new THREE.Mesh(flashSphereGeo, fMat);
      fMesh.position.copy(worldPos);
      scene.add(fMesh);
      activeEffects.push({
        mesh: fMesh, mat: fMat,
        vx: 0, vy: 0, vz: 0, rx: 0, ry: 0, rz: 0,
        age: 0, maxAge: 0.16, kind: 'scale', startScale: 0.7, endScale: 2.3
      });

      const rMat = new THREE.MeshBasicMaterial({
        color: colorHex,
        transparent: true,
        opacity: 0.95,
        side: THREE.DoubleSide
      });
      const rMesh = new THREE.Mesh(shockwaveGeo, rMat);
      rMesh.position.copy(worldPos);
      rMesh.rotation.y = boardState.yaw;
      scene.add(rMesh);
      activeEffects.push({
        mesh: rMesh, mat: rMat,
        vx: 0, vy: 0, vz: 0, rx: 0, ry: 0, rz: 0,
        age: 0, maxAge: 0.34, kind: 'scale', startScale: 0.6, endScale: 3.4
      });
    }

    function spawnBalloonPopEffect(worldPos, colorHex, lightHex) {
      spawnShockwaveAndFlash(worldPos, colorHex);

      for (let i = 0; i < 16; i++) {
        const useLight = (i % 3 === 0);
        const mat = new THREE.MeshStandardMaterial({
          color: useLight ? lightHex : colorHex,
          emissive: colorHex,
          emissiveIntensity: 0.2,
          roughness: 0.25,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 1.0
        });
        const mesh = new THREE.Mesh(shredGeo, mat);
        mesh.position.copy(worldPos);
        mesh.rotation.set(Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28);
        scene.add(mesh);

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        const spd = 0.85 + Math.random() * 1.15;
        activeEffects.push({
          mesh, mat,
          vx: Math.sin(phi) * Math.cos(theta) * spd,
          vy: Math.cos(phi) * spd + 0.35,
          vz: Math.sin(phi) * Math.sin(theta) * spd,
          rx: (Math.random() - 0.5) * 18,
          ry: (Math.random() - 0.5) * 18,
          rz: (Math.random() - 0.5) * 18,
          age: 0,
          maxAge: 0.62 + Math.random() * 0.22,
          kind: 'latex'
        });
      }

      for (let i = 0; i < 12; i++) {
        const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95 });
        const mesh = new THREE.Mesh(sparkGeo, mat);
        mesh.position.copy(worldPos);
        scene.add(mesh);

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        const spd = 0.5 + Math.random() * 0.9;
        activeEffects.push({
          mesh, mat,
          vx: Math.sin(phi) * Math.cos(theta) * spd,
          vy: Math.cos(phi) * spd + 0.2,
          vz: Math.sin(phi) * Math.sin(theta) * spd,
          rx: 0, ry: 0, rz: 0,
          age: 0,
          maxAge: 0.42,
          kind: 'spark'
        });
      }
    }

    function spawnHexPopEffect(worldPos, colorHex) {
      spawnShockwaveAndFlash(worldPos, colorHex);
      for (let i = 0; i < 10; i++) {
        const mat = new THREE.MeshStandardMaterial({
          color: i % 2 === 0 ? colorHex : 0xffffff,
          emissive: colorHex,
          emissiveIntensity: 0.35,
          roughness: 0.1,
          flatShading: true,
          transparent: true,
          opacity: 1.0
        });
        const mesh = new THREE.Mesh(shardGeo, mat);
        mesh.position.copy(worldPos);
        scene.add(mesh);

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        const spd = 0.65 + Math.random() * 0.85;
        activeEffects.push({
          mesh, mat,
          vx: Math.sin(phi) * Math.cos(theta) * spd,
          vy: Math.cos(phi) * spd + 0.25,
          vz: Math.sin(phi) * Math.sin(theta) * spd,
          rx: (Math.random() - 0.5) * 16,
          ry: (Math.random() - 0.5) * 16,
          rz: (Math.random() - 0.5) * 16,
          age: 0,
          maxAge: 0.58,
          kind: 'shard'
        });
      }
    }

    // --- Bare Hands (Primary) & Controllers (Optional Saber) ---
    const controllers = [];
    const touchProbes = [];
    const raycaster = new THREE.Raycaster();
    let activeDrag = null;

    function getSaberRay(state, outOrigin, outDir) {
      state.hiltOriginMesh.getWorldPosition(outOrigin);
      state.tipMesh.getWorldPosition(outDir);
      outDir.sub(outOrigin).normalize();
    }

    function handleRaySelectStart(origin, dir, dragOwner, pulseFn) {
      raycaster.set(origin, dir);

      if (isEditMode) {
        if (raycaster.intersectObject(lockBtn).length > 0) {
          playClickTone();
          if (pulseFn) pulseFn(0.45, 50);
          setEditMode(false);
          return true;
        }
        if (raycaster.intersectObject(resetBtn).length > 0) {
          playClickTone();
          if (pulseFn) pulseFn(0.45, 50);
          const headPos = new THREE.Vector3();
          const headDir = new THREE.Vector3();
          camera.getWorldPosition(headPos);
          camera.getWorldDirection(headDir);
          headDir.y = 0;
          if (headDir.lengthSq() < 0.001) headDir.set(0, 0, -1);
          headDir.normalize();

          boardState.x = headPos.x + headDir.x * 1.35;
          boardState.y = Math.max(0.95, headPos.y - 0.15);
          boardState.z = headPos.z + headDir.z * 1.35;
          boardState.yaw = Math.atan2(-headDir.x, -headDir.z);
          boardState.width = DEFAULT_STATE.width;
          boardState.height = DEFAULT_STATE.height;
          updateBoardLayout(true);
          saveBoardState();
          return true;
        }
        if (raycaster.intersectObject(editMenuBtn).length > 0) {
          if (pulseFn) pulseFn(0.45, 50);
          returnToMainMenu();
          return true;
        }

        const cornerMeshes = cornerHandles.map(c => c.hitMesh);
        const cornerHits = raycaster.intersectObjects(cornerMeshes, false);
        if (cornerHits.length > 0) {
          const hitHandle = cornerHandles.find(c => c.hitMesh === cornerHits[0].object);
          if (hitHandle) {
            if (pulseFn) pulseFn(0.35, 40);
            activeDrag = {
              owner: dragOwner,
              type: 'resize',
              distance: cornerHits[0].distance
            };
            return true;
          }
        }

        const boardHits = raycaster.intersectObject(backPlane, false);
        if (boardHits.length > 0) {
          if (pulseFn) pulseFn(0.3, 35);
          const localHit = boardRoot.worldToLocal(boardHits[0].point.clone());
          activeDrag = {
            owner: dragOwner,
            type: 'move',
            distance: boardHits[0].distance,
            offsetLocalX: localHit.x,
            offsetLocalY: localHit.y
          };
          return true;
        }
      } else {
        if (raycaster.intersectObject(editBtn).length > 0) {
          playClickTone();
          if (pulseFn) pulseFn(0.45, 50);
          setEditMode(true);
          return true;
        }
        if (raycaster.intersectObject(playMenuBtn).length > 0) {
          if (pulseFn) pulseFn(0.45, 50);
          returnToMainMenu();
          return true;
        }
      }
      return false;
    }

    function setupController(index) {
      const controller = renderer.xr.getController(index);
      scene.add(controller);

      const bladePivot = new THREE.Group();
      bladePivot.rotation.x = THREE.MathUtils.degToRad(bladeAngleDeg);
      bladePivot.visible = false;
      controller.add(bladePivot);

      const bladeColor = index === 0 ? 0x26c6da : 0xffb300;

      const hiltGeo = new THREE.CylinderGeometry(0.015, 0.017, 0.13, 16);
      hiltGeo.rotateX(Math.PI / 2);
      hiltGeo.translate(0, 0, 0.045);
      const hiltMat = new THREE.MeshStandardMaterial({ color: 0x37474f, roughness: 0.35, metalness: 0.8 });
      bladePivot.add(new THREE.Mesh(hiltGeo, hiltMat));

      const emitterGeo = new THREE.CylinderGeometry(0.019, 0.019, 0.018, 16);
      emitterGeo.rotateX(Math.PI / 2);
      emitterGeo.translate(0, 0, -0.022);
      const emitterMat = new THREE.MeshStandardMaterial({ color: 0xb0bec5, roughness: 0.25, metalness: 0.9 });
      bladePivot.add(new THREE.Mesh(emitterGeo, emitterMat));

      const coreGeo = new THREE.CylinderGeometry(0.0075, 0.009, bladeLength, 14);
      coreGeo.rotateX(Math.PI / 2);
      coreGeo.translate(0, 0, -0.025 - bladeLength / 2);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      bladePivot.add(new THREE.Mesh(coreGeo, coreMat));

      const auraGeo = new THREE.CylinderGeometry(0.018, 0.022, bladeLength + 0.01, 16);
      auraGeo.rotateX(Math.PI / 2);
      auraGeo.translate(0, 0, -0.025 - bladeLength / 2);
      const auraMat = new THREE.MeshBasicMaterial({
        color: bladeColor,
        transparent: true,
        opacity: 0.42
      });
      bladePivot.add(new THREE.Mesh(auraGeo, auraMat));

      const tipAuraGeo = new THREE.SphereGeometry(0.020, 16, 16);
      const tipAuraMesh = new THREE.Mesh(tipAuraGeo, auraMat);
      tipAuraMesh.position.set(0, 0, -0.025 - bladeLength);
      bladePivot.add(tipAuraMesh);

      const hiltOriginMesh = new THREE.Object3D();
      hiltOriginMesh.position.set(0, 0, -0.025);
      bladePivot.add(hiltOriginMesh);

      const tipMesh = new THREE.Object3D();
      tipMesh.position.set(0, 0, -0.025 - bladeLength);
      bladePivot.add(tipMesh);

      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, -0.025 - bladeLength),
        new THREE.Vector3(0, 0, -4.5)
      ]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0xffb74d, transparent: true, opacity: 0.7 });
      const rayLine = new THREE.Line(lineGeo, lineMat);
      bladePivot.add(rayLine);

      const state = {
        controller,
        bladePivot,
        hiltOriginMesh,
        tipMesh,
        rayLine,
        inputSource: null,
        isHandSource: false
      };

      controller.addEventListener('connected', (e) => {
        state.inputSource = e.data;
        state.isHandSource = Boolean(e.data && e.data.hand);
        bladePivot.visible = !state.isHandSource;
      });
      controller.addEventListener('disconnected', () => {
        state.inputSource = null;
        state.isHandSource = false;
        bladePivot.visible = false;
        if (activeDrag && activeDrag.owner === state) activeDrag = null;
      });

      const pulseHaptic = (strength = 0.55, ms = 50) => {
        const gp = state.inputSource && state.inputSource.gamepad;
        if (gp && gp.hapticActuators && gp.hapticActuators[0]) {
          gp.hapticActuators[0].pulse(strength, ms);
        }
      };

      const onSelectStart = () => {
        const origin = new THREE.Vector3();
        const dir = new THREE.Vector3();
        if (state.isHandSource) {
          controller.getWorldPosition(origin);
          dir.set(0, 0, -1).applyQuaternion(controller.quaternion).normalize();
        } else {
          getSaberRay(state, origin, dir);
        }
        handleRaySelectStart(origin, dir, state, pulseHaptic);
      };

      const onSelectEnd = () => {
        if (activeDrag && activeDrag.owner === state) {
          activeDrag = null;
          saveBoardState();
        }
      };

      controller.addEventListener('selectstart', onSelectStart);
      controller.addEventListener('selectend', onSelectEnd);
      controller.addEventListener('squeezestart', onSelectStart);
      controller.addEventListener('squeezeend', onSelectEnd);

      touchProbes.push({
        isSaber: true,
        state,
        getSegment: (outA, outB) => {
          if (!state.bladePivot.visible) return false;
          state.hiltOriginMesh.getWorldPosition(outA);
          state.tipMesh.getWorldPosition(outB);
          return true;
        },
        triggerHaptic: (strength = 0.65, ms = 50) => pulseHaptic(strength, ms)
      });

      controllers.push(state);
    }

    function setupBareHand(index) {
      const hand = renderer.xr.getHand(index);
      scene.add(hand);

      const trackedJoints = [
        { name: 'index-finger-tip',          showDot: true,  radius: 0.015 },
        { name: 'middle-finger-tip',         showDot: true,  radius: 0.014 },
        { name: 'ring-finger-tip',           showDot: false, radius: 0.012 },
        { name: 'thumb-tip',                 showDot: false, radius: 0.012 },
        { name: 'middle-finger-metacarpal',  showDot: true,  radius: 0.018 }
      ];

      for (const jCfg of trackedJoints) {
        let dotMesh = null;
        if (jCfg.showDot) {
          const dotGeo = new THREE.SphereGeometry(jCfg.radius, 14, 14);
          const dotMat = new THREE.MeshBasicMaterial({
            color: jCfg.name === 'middle-finger-metacarpal' ? 0x4dd0e1 : 0xffffff,
            transparent: true,
            opacity: jCfg.name === 'middle-finger-metacarpal' ? 0.45 : 0.90
          });
          dotMesh = new THREE.Mesh(dotGeo, dotMat);
          dotMesh.visible = false;
          scene.add(dotMesh);
        }

        touchProbes.push({
          isSaber: false,
          getSegment: (outA, outB) => {
            const joint = hand.joints && hand.joints[jCfg.name];
            if (!joint || joint.position.lengthSq() === 0) {
              if (dotMesh) dotMesh.visible = false;
              return false;
            }
            joint.getWorldPosition(outA);
            outB.copy(outA);
            if (dotMesh) {
              dotMesh.position.copy(outA);
              dotMesh.visible = true;
            }
            return true;
          },
          triggerHaptic: null
        });
      }
    }

    setupController(0);
    setupController(1);
    setupBareHand(0);
    setupBareHand(1);

    // --- Check WebXR Support & Attach Start AR Handler ---
    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-ar').then(supported => {
        if (supported) {
          startBtn.disabled = false;
          startBtn.textContent = 'START AR';
        } else {
          startBtn.textContent = 'AR Not Supported Here';
          statusEl.textContent = 'Open this page inside the Meta Quest Browser on Quest 3.';
        }
      }).catch(err => {
        statusEl.textContent = 'XR Check Error: ' + err.message;
      });
    } else {
      startBtn.textContent = 'WebXR Unavailable';
      statusEl.textContent = 'Requires HTTPS and Meta Quest Browser.';
    }

    startBtn.addEventListener('click', async () => {
      try {
        statusEl.textContent = 'Starting AR...';
        initAudio();
        rebuildHexGrid();

        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['local-floor'],
          optionalFeatures: ['hand-tracking']
        });

        activeXRSession = session;
        menuCard.style.display = 'none';
        statusEl.textContent = '';

        renderer.xr.setReferenceSpaceType('local-floor');
        await renderer.xr.setSession(session);

        session.addEventListener('end', () => {
          activeXRSession = null;
          activeDrag = null;
          menuCard.style.display = 'block';
        });
      } catch (err) {
        menuCard.style.display = 'block';
        statusEl.textContent = 'Could not start AR: ' + err.message;
      }
    });

    // --- Main Frame Loop ---
    const clock = new THREE.Clock();
    const segA = new THREE.Vector3();
    const segB = new THREE.Vector3();
    const midOuterA = new THREE.Vector3();
    const closestPt = new THREE.Vector3();
    const line3 = new THREE.Line3();
    const outerBladeLine = new THREE.Line3();
    const rayOrigin = new THREE.Vector3();
    const rayDir = new THREE.Vector3();
    const targetWorldPt = new THREE.Vector3();
    const localPt = new THREE.Vector3();

    const HEX_HIT_RADIUS = HEX_RADIUS * 1.18;
    const BALLOON_HIT_RADIUS = 0.14;
    let buttonCooldownUntil = 0;

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      for (const c of controllers) {
        if (c.rayLine) c.rayLine.visible = isEditMode && c.bladePivot.visible;
      }

      // 1. Handle Active Board Dragging or Corner Resizing
      if (activeDrag && isEditMode) {
        if (activeDrag.owner.isHandSource) {
          activeDrag.owner.controller.getWorldPosition(rayOrigin);
          rayDir.set(0, 0, -1).applyQuaternion(activeDrag.owner.controller.quaternion).normalize();
        } else {
          getSaberRay(activeDrag.owner, rayOrigin, rayDir);
        }
        targetWorldPt.copy(rayOrigin).addScaledVector(rayDir, activeDrag.distance);

        if (activeDrag.type === 'move') {
          const flatDirX = -rayDir.x;
          const flatDirZ = -rayDir.z;
          if (flatDirX * flatDirX + flatDirZ * flatDirZ > 0.01) {
            boardState.yaw = Math.atan2(flatDirX, flatDirZ);
          }

          const cosY = Math.cos(boardState.yaw);
          const sinY = Math.sin(boardState.yaw);
          const worldOffsetX = activeDrag.offsetLocalX * cosY;
          const worldOffsetZ = -activeDrag.offsetLocalX * sinY;

          boardState.x = targetWorldPt.x - worldOffsetX;
          boardState.y = Math.max(0.45, targetWorldPt.y - activeDrag.offsetLocalY);
          boardState.z = targetWorldPt.z - worldOffsetZ;
          updateBoardLayout(false);
        } else if (activeDrag.type === 'resize') {
          localPt.copy(targetWorldPt);
          boardRoot.worldToLocal(localPt);

          const newWidth = Math.max(0.75, Math.min(4.2, Math.abs(localPt.x) * 2));
          const newHeight = Math.max(0.65, Math.min(3.0, Math.abs(localPt.y) * 2));

          if (Math.abs(newWidth - boardState.width) > 0.015 || Math.abs(newHeight - boardState.height) > 0.015) {
            boardState.width = newWidth;
            boardState.height = newHeight;
            updateBoardLayout(true);
          }
        }
      }

      // 2. Spawn Falling Balloons in Play Mode
      if (!isEditMode && playElements !== 'hex') {
        spawnTimer += dt;
        if (spawnTimer >= 1.35) {
          spawnTimer = 0;
          spawnBalloon();
        }
      }

      // 3. Animate Big Center Target Hexagon & Board Hexagons
      boardRoot.updateMatrixWorld(true);

      if (centerBeaconGroup.visible) {
        const beaconPulse = 1.0 + Math.sin(elapsed * 3.8) * 0.045;
        centerBeaconMesh.scale.setScalar(beaconPulse);
      }

      for (let i = 0; i < tiles.length; i++) {
        const t = tiles[i];
        if (t.nudgeTimer > 0) {
          t.nudgeTimer = Math.max(0, t.nudgeTimer - dt);
        }

        const isMatchingColor = t.isLit && (t.colorIdx === targetColorIdx);
        const pulseAmt = isMatchingColor ? Math.sin(elapsed * 5.2 + i) * 0.005 : 0;
        const nudgeDip = t.nudgeTimer > 0 ? -Math.sin((t.nudgeTimer / 0.25) * Math.PI) * 0.012 : 0;
        const targetZ = ((t.isLit && !isEditMode) ? 0.024 + pulseAmt + nudgeDip : 0.002);

        t.popZ += (targetZ - t.popZ) * Math.min(1, dt * 14);
        t.mesh.position.z = t.popZ;
        if (t.isLit) t.mesh.getWorldPosition(t.worldPos);
      }

      // 4. Animate Falling Balloons
      const bottomLimit = -boardState.height / 2 - 0.18;
      for (let i = fallingBalloons.length - 1; i >= 0; i--) {
        const b = fallingBalloons[i];
        b.group.position.y -= b.speed * dt;

        const phase = elapsed * 1.7 + b.swayPhase;
        const swayOffset = Math.sin(phase) * 0.075 + Math.sin(phase * 2.1) * 0.018;
        const swayVel = Math.cos(phase) * 0.075 * 1.7;
        b.group.position.x = b.baseX + swayOffset;

        b.group.rotation.z = -swayVel * 0.85;
        b.group.rotation.x = Math.sin(elapsed * 2.2 + b.swayPhase) * 0.08;
        b.stringPivot.rotation.z = swayVel * 1.4 + Math.sin(elapsed * 4.5 + b.swayPhase) * 0.12;
        b.group.getWorldPosition(b.worldPos);

        if (b.group.position.y < bottomLimit || isEditMode) {
          boardRoot.remove(b.group);
          b.mat.dispose();
          fallingBalloons.splice(i, 1);
        }
      }

      // 5. Check Bare Hand & Saber Collisions
      const nowMs = performance.now();
      for (let p = 0; p < touchProbes.length; p++) {
        const probe = touchProbes[p];
        if (!probe.getSegment(segA, segB)) continue;
        line3.set(segA, segB);

        if (probe.isSaber) {
          midOuterA.lerpVectors(segA, segB, 0.4);
          outerBladeLine.set(midOuterA, segB);
        } else {
          outerBladeLine.set(segA, segB);
        }

        // Direct hand/wand poke on 3D dock buttons
        if (nowMs >= buttonCooldownUntil) {
          if (isEditMode) {
            lockBtn.getWorldPosition(targetWorldPt);
            if (segB.distanceTo(targetWorldPt) < 0.085) {
              buttonCooldownUntil = nowMs + 600;
              playClickTone();
              if (probe.triggerHaptic) probe.triggerHaptic(0.45, 50);
              setEditMode(false);
              break;
            }
            editMenuBtn.getWorldPosition(targetWorldPt);
            if (segB.distanceTo(targetWorldPt) < 0.085) {
              buttonCooldownUntil = nowMs + 600;
              if (probe.triggerHaptic) probe.triggerHaptic(0.45, 50);
              returnToMainMenu();
              break;
            }
          } else {
            editBtn.getWorldPosition(targetWorldPt);
            if (segB.distanceTo(targetWorldPt) < 0.08) {
              buttonCooldownUntil = nowMs + 600;
              playClickTone();
              if (probe.triggerHaptic) probe.triggerHaptic(0.45, 50);
              setEditMode(true);
              break;
            }
            playMenuBtn.getWorldPosition(targetWorldPt);
            if (segB.distanceTo(targetWorldPt) < 0.08) {
              buttonCooldownUntil = nowMs + 600;
              if (probe.triggerHaptic) probe.triggerHaptic(0.45, 50);
              returnToMainMenu();
              break;
            }
          }
        }

        if (isEditMode) continue;

        // Check Lit Hexagons against Color Target
        for (let i = 0; i < tiles.length; i++) {
          const t = tiles[i];
          if (!t.isLit) continue;

          outerBladeLine.closestPointToPoint(t.worldPos, true, closestPt);
          if (closestPt.distanceTo(t.worldPos) <= HEX_HIT_RADIUS) {
            if (t.colorIdx === targetColorIdx) {
              const pal = COLOR_PALETTE[t.colorIdx];
              spawnBoardRipple(t.mesh.position, pal.hex, 1.0);
              spawnHexPopEffect(t.worldPos, pal.hex);
              playHexChime();
              if (probe.triggerHaptic) probe.triggerHaptic(0.50, 45);

              resetTileToIdle(t);

              const remainingMatches = tiles.some(other => other.isLit && other.colorIdx === targetColorIdx);
              if (!remainingMatches) {
                playColorChangeChime();
                populateColorMatchRound(true);
              }
            } else if (t.nudgeTimer <= 0) {
              t.nudgeTimer = 0.25;
              playGentleWrongTap();
              if (probe.triggerHaptic) probe.triggerHaptic(0.15, 25);
            }
            break;
          }
        }

        // Check Falling Balloons
        for (let i = fallingBalloons.length - 1; i >= 0; i--) {
          const b = fallingBalloons[i];
          line3.closestPointToPoint(b.worldPos, true, closestPt);
          if (closestPt.distanceTo(b.worldPos) <= BALLOON_HIT_RADIUS) {
            spawnBalloonPopEffect(b.worldPos, b.colorHex, b.lightHex);
            playRealisticBalloonPop();
            if (probe.triggerHaptic) probe.triggerHaptic(0.85, 45);

            boardRoot.remove(b.group);
            b.mat.dispose();
            fallingBalloons.splice(i, 1);
            break;
          }
        }
      }

      // 6. Animate Board Ripples & 3D Pop Particles
      for (let i = boardRipples.length - 1; i >= 0; i--) {
        const r = boardRipples[i];
        r.age += dt;
        const prog = r.age / 0.42;
        if (prog >= 1) {
          boardRoot.remove(r.mesh);
          r.mat.dispose();
          boardRipples.splice(i, 1);
        } else {
          r.mesh.scale.setScalar((1 + prog * 1.15) * (r.scaleMult || 1));
          r.mat.opacity = 0.85 * (1 - prog);
        }
      }

      for (let i = activeEffects.length - 1; i >= 0; i--) {
        const ef = activeEffects[i];
        ef.age += dt;
        const prog = ef.age / ef.maxAge;
        if (prog >= 1) {
          scene.remove(ef.mesh);
          ef.mat.dispose();
          activeEffects.splice(i, 1);
          continue;
        }

        if (ef.kind === 'scale') {
          const s = ef.startScale + (ef.endScale - ef.startScale) * (1 - Math.pow(1 - prog, 2));
          ef.mesh.scale.setScalar(s);
          ef.mat.opacity = 0.92 * (1 - prog);
        } else if (ef.kind === 'latex') {
          const drag = Math.pow(0.08, dt);
          ef.vx *= drag;
          ef.vz *= drag;
          ef.vy = ef.vy * drag - 1.15 * dt;

          ef.mesh.position.x += ef.vx * dt;
          ef.mesh.position.y += ef.vy * dt;
          ef.mesh.position.z += ef.vz * dt;
          ef.mesh.rotation.x += ef.rx * dt;
          ef.mesh.rotation.y += ef.ry * dt;
          ef.mesh.rotation.z += ef.rz * dt;
          ef.mat.opacity = prog < 0.65 ? 1.0 : 1.0 - (prog - 0.65) / 0.35;
        } else if (ef.kind === 'shard') {
          ef.vy -= 2.2 * dt;
          ef.mesh.position.x += ef.vx * dt;
          ef.mesh.position.y += ef.vy * dt;
          ef.mesh.position.z += ef.vz * dt;
          ef.mesh.rotation.x += ef.rx * dt;
          ef.mesh.rotation.y += ef.ry * dt;
          ef.mesh.rotation.z += ef.rz * dt;
          ef.mat.opacity = 1.0 - prog;
        } else {
          ef.vy -= 1.4 * dt;
          ef.mesh.position.x += ef.vx * dt;
          ef.mesh.position.y += ef.vy * dt;
          ef.mesh.position.z += ef.vz * dt;
          ef.mesh.scale.setScalar(1 - prog * 0.8);
          ef.mat.opacity = 0.95 * (1 - prog);
        }
      }

      renderer.render(scene, camera);
    });
  </script>
