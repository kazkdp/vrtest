<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MR Hex Power Wall v2.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #091115;
      color: #eaf6f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .launch-wrap {
      position: relative;
      z-index: 10;
      max-width: 420px;
      width: 100%;
      background: #111e24;
      border: 1px solid #223b45;
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    .version-badge {
      display: inline-block;
      background: #18323c;
      color: #4dd0e1;
      border: 1px solid #2b5564;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    p.sub {
      color: #8fb3bd;
      font-size: 0.92rem;
      line-height: 1.45;
      margin-bottom: 24px;
    }
    #start-btn {
      width: 100%;
      padding: 22px;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, #26c6da, #00acc1);
      color: #041519;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0, 172, 193, 0.35);
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    #start-btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
    #start-btn:active:not(:disabled) { transform: scale(0.98); }
    #status {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #90b4be;
      min-height: 1.2em;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="launch-wrap" id="launch-screen">
    <div class="version-badge">VERSION 2.0 • POWER FILL</div>
    <h1>Hex Power Wall</h1>
    <p class="sub">Position the wall in front of you, lock it in, and charge the center hexagon with matching colors before time runs out.</p>
    <button id="start-btn" disabled>Checking Quest XR...</button>
    <div id="status"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    const APP_VERSION = 'v2.0';
    const ROUND_DURATION = 20.0; // seconds per stage

    const launchScreen = document.getElementById('launch-screen');
    const startBtn = document.getElementById('start-btn');
    const statusEl = document.getElementById('status');

    window.addEventListener('error', (e) => {
      statusEl.textContent = 'Error: ' + (e.message || 'Unknown error');
    });

    // --- Procedural Sound Effects (Web Audio API) ---
    let audioCtx = null;
    const pentatonicNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
    let noteIdx = 0;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function ensureAudioReady() {
      if (!audioCtx) return false;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return true;
    }

    function playTileTouchChime() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const freq = pentatonicNotes[noteIdx % pentatonicNotes.length];
      noteIdx++;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.16, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.45);
    }

    function playPowerAbsorbSound(fillRatio) {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      // Rising pitch as center hexagon fills up
      const baseFreq = 320 + fillRatio * 340;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(baseFreq, now);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.35, now + 0.16);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.24);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.26);
    }

    function playStageCompleteChord() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const chord = [392.00, 493.88, 587.33, 783.99];
      chord.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        const t0 = now + idx * 0.06;
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.exponentialRampToValueAtTime(0.16, t0 + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.72);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.75);
      });
    }

    function playGentleWrongTap() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(130, now + 0.14);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.06, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.18);
    }

    function playGentleResetTone() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(340, now);
      osc.frequency.exponentialRampToValueAtTime(220, now + 0.35);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.12, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.42);
    }

    function playClickTone() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, now);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    }

    // --- Three.js Scene & Renderer ---
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.domElement.style.position = 'fixed';
    renderer.domElement.style.inset = '0';
    renderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 30);

    scene.add(new THREE.HemisphereLight(0xdff8ff, 0x162830, 1.15));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.35);
    keyLight.position.set(1.6, 2.8, 2.6);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x80deea, 0.65);
    fillLight.position.set(-2.2, 0.8, 2.0);
    scene.add(fillLight);

    // --- Procedural Glow Textures ---
    function createDiffuserTexture() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(size / 2, size / 2, size * 0.04, size / 2, size / 2, size * 0.5);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.45, 'rgba(235, 235, 235, 0.92)');
      grad.addColorStop(0.85, 'rgba(170, 170, 170, 0.78)');
      grad.addColorStop(1.0, 'rgba(130, 130, 130, 0.70)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(canvas);
    }

    function createBloomHaloTexture() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(size / 2, size / 2, size * 0.05, size / 2, size / 2, size * 0.5);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 0.95)');
      grad.addColorStop(0.35, 'rgba(255, 255, 255, 0.45)');
      grad.addColorStop(0.70, 'rgba(255, 255, 255, 0.12)');
      grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(canvas);
    }

    const diffuserTex = createDiffuserTexture();
    const bloomHaloTex = createBloomHaloTexture();

    // --- Shared Effect Geometries ---
    const shockwaveGeo = new THREE.RingGeometry(0.085, 0.118, 36);
    const flashSphereGeo = new THREE.SphereGeometry(0.10, 18, 18);
    const shardGeo = new THREE.ConeGeometry(0.018, 0.048, 4);
    const energyOrbGeo = new THREE.SphereGeometry(0.026, 16, 16);
    const energyTrailGeo = new THREE.SphereGeometry(0.015, 10, 10);

    const activeEffects = [];
    const boardRipples = [];
    const powerPulses = []; // Travelling energy packets from touched tiles to center hexagon

    // --- Vibrant Stage Color Palette (Starts with Purple) ---
    const COLOR_PALETTE = [
      { name: 'Purple', css: '#d500f9', cssLight: '#ea80fc', cssDark: '#4a0072', hex: 0xd500f9, emissive: 0xaa00ff, rim: 0xf3e5f5, halo: 0xea80fc },
      { name: 'Blue',   css: '#00b0ff', cssLight: '#80d8ff', cssDark: '#004c8c', hex: 0x00b0ff, emissive: 0x0091ea, rim: 0xb3e5fc, halo: 0x40c4ff },
      { name: 'Pink',   css: '#ff4081', cssLight: '#ff80ab', cssDark: '#880e4f', hex: 0xff4081, emissive: 0xf50057, rim: 0xffcce0, halo: 0xff80ab },
      { name: 'Gold',   css: '#ffc400', cssLight: '#ffe57f', cssDark: '#8d6e00', hex: 0xffc400, emissive: 0xffab00, rim: 0xfff8e1, halo: 0xffd740 },
      { name: 'Green',  css: '#00e676', cssLight: '#b9f6ca', cssDark: '#005005', hex: 0x00e676, emissive: 0x00c853, rim: 0xd0f8ce, halo: 0x69f0ae }
    ];

    // --- Board Dimensions (Saved) + Fresh Front Placement Every Launch ---
    const SIZE_STORAGE_KEY = 'mr_hex_wall_size_v2';
    const DEFAULT_SIZE = { width: 1.95, height: 1.30 };

    function loadSavedSize() {
      try {
        const raw = localStorage.getItem(SIZE_STORAGE_KEY);
        if (!raw) return { ...DEFAULT_SIZE };
        const p = JSON.parse(raw);
        return {
          width: Math.max(0.85, Math.min(4.5, p.width || DEFAULT_SIZE.width)),
          height: Math.max(0.75, Math.min(3.2, p.height || DEFAULT_SIZE.height))
        };
      } catch {
        return { ...DEFAULT_SIZE };
      }
    }

    function saveBoardSize() {
      try {
        localStorage.setItem(SIZE_STORAGE_KEY, JSON.stringify({
          width: boardState.width,
          height: boardState.height
        }));
      } catch {}
    }

    const savedSize = loadSavedSize();
    const boardState = {
      x: 0,
      y: 1.25,
      z: -1.35,
      yaw: 0,
      width: savedSize.width,
      height: savedSize.height
    };

    // Always launch in Freefall Wall Setup mode so the user can place it cleanly in front of them
    let isEditMode = true;
    let needsInitialSnapToFront = false;

    // --- Game Stage & Power-Fill State ---
    let stageNumber = 1;
    let targetColorIdx = 0; // Starts Purple
    let timeRemaining = ROUND_DURATION;
    let requiredTiles = 5;
    let collectedCount = 0;
    let targetFill = 0.0;   // Increases when energy packets arrive at center
    let displayFill = 0.0;  // Smoothly animated liquid level inside center hexagon
    let stageClearPause = 0; // Brief celebration hold at 100% before next stage

    // --- Movable & Resizable Game Board Group ---
    const boardRoot = new THREE.Group();
    scene.add(boardRoot);

    function spawnBoardRipple(localPos, colorHex, scaleMult = 1.0) {
      const mat = new THREE.MeshBasicMaterial({
        color: colorHex,
        transparent: true,
        opacity: 0.95,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(shockwaveGeo, mat);
      mesh.position.copy(localPos);
      mesh.position.z += 0.032;
      boardRoot.add(mesh);
      boardRipples.push({ mesh, mat, age: 0, scaleMult });
    }

    const backPlaneMat = new THREE.MeshPhysicalMaterial({
      color: 0x071217,
      roughness: 0.25,
      metalness: 0.1,
      transparent: true,
      opacity: 0.46,
      side: THREE.DoubleSide
    });
    const backPlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), backPlaneMat);
    boardRoot.add(backPlane);

    const frameMat = new THREE.MeshStandardMaterial({
      color: 0x26c6da,
      emissive: 0x00acc1,
      emissiveIntensity: 0.65,
      roughness: 0.25,
      metalness: 0.6,
      transparent: true,
      opacity: 0.9
    });
    const topBar = new THREE.Mesh(new THREE.BoxGeometry(1, 0.016, 0.018), frameMat);
    const botBar = new THREE.Mesh(new THREE.BoxGeometry(1, 0.016, 0.018), frameMat);
    const leftBar = new THREE.Mesh(new THREE.BoxGeometry(0.016, 1, 0.018), frameMat);
    const rightBar = new THREE.Mesh(new THREE.BoxGeometry(0.016, 1, 0.018), frameMat);
    boardRoot.add(topBar, botBar, leftBar, rightBar);

    // Subtle Version Badge on bottom-right corner of the 3D board frame
    function createVersionTagMesh(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(12, 26, 32, 0.85)';
      ctx.beginPath();
      ctx.roundRect(4, 4, 248, 56, 28);
      ctx.fill();
      ctx.strokeStyle = 'rgba(77, 208, 225, 0.45)';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#80deea';
      ctx.font = 'bold 28px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 33);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
      return new THREE.Mesh(new THREE.PlaneGeometry(0.18, 0.045), mat);
    }
    const versionBadgeMesh = createVersionTagMesh(APP_VERSION);
    boardRoot.add(versionBadgeMesh);

    const cornerHandles = [];
    const cornerSigns = [
      { sx: -1, sy:  1 },
      { sx:  1, sy:  1 },
      { sx: -1, sy: -1 },
      { sx:  1, sy: -1 }
    ];
    const handleGeo = new THREE.SphereGeometry(0.055, 20, 20);
    const handleHitGeo = new THREE.SphereGeometry(0.115, 12, 12);

    for (const sign of cornerSigns) {
      const hMat = new THREE.MeshStandardMaterial({
        color: 0xffc400,
        emissive: 0xff8f00,
        emissiveIntensity: 0.7,
        roughness: 0.2
      });
      const visMesh = new THREE.Mesh(handleGeo, hMat);
      const hitMesh = new THREE.Mesh(handleHitGeo, new THREE.MeshBasicMaterial({ visible: false }));
      visMesh.add(hitMesh);
      visMesh.position.z = 0.022;
      boardRoot.add(visMesh);
      cornerHandles.push({ mesh: visMesh, hitMesh, mat: hMat, sx: sign.sx, sy: sign.sy });
    }

    function create3DButton(label, bgHex, textHex, w = 0.34, h = 0.095) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 144;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = bgHex;
      ctx.beginPath();
      ctx.roundRect(6, 6, 500, 132, 66);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 6;
      ctx.stroke();

      ctx.fillStyle = textHex;
      ctx.font = 'bold 46px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 256, 74);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      mesh.position.z = 0.025;
      return { mesh, w, h };
    }

    const lockBtnObj = create3DButton('Lock & Play', '#26c6da', '#05181c', 0.36, 0.092);
    const bringHereBtnObj = create3DButton('Bring Here', '#1b3840', '#d0eaef', 0.34, 0.092);
    const editBtnObj = create3DButton('Move / Resize', '#162b32', '#9bd2dc', 0.32, 0.08);

    const lockBtn = lockBtnObj.mesh;
    const bringHereBtn = bringHereBtnObj.mesh;
    const editBtn = editBtnObj.mesh;

    boardRoot.add(lockBtn, bringHereBtn, editBtn);

    // --- Hexagon Grid + Center Power-Core Hexagon ---
    const hexContainer = new THREE.Group();
    boardRoot.add(hexContainer);

    const HEX_RADIUS = 0.132;
    const CENTER_HEX_RADIUS = 0.275;

    function makeHexShape(r) {
      const s = new THREE.Shape();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i === 0) s.moveTo(x, y);
        else s.lineTo(x, y);
      }
      s.closePath();
      return s;
    }

    function applyCenteredHexUVs(geo, radius) {
      const pos = geo.attributes.position;
      const uv = geo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        const u = (pos.getX(i) / (radius * 2)) + 0.5;
        const v = (pos.getY(i) / (radius * 2)) + 0.5;
        uv.setXY(i, u, v);
      }
      uv.needsUpdate = true;
    }

    // Small Hexagon Geometries
    const socketGeo = new THREE.ExtrudeGeometry(makeHexShape(HEX_RADIUS * 0.94), {
      depth: 0.008,
      bevelEnabled: true,
      bevelSegments: 2,
      steps: 1,
      bevelSize: 0.004,
      bevelThickness: 0.003
    });
    const socketMat = new THREE.MeshStandardMaterial({
      color: 0x0b161b,
      roughness: 0.35,
      metalness: 0.65,
      transparent: true,
      opacity: 0.85
    });

    const tileRadius = HEX_RADIUS * 0.84;
    const hexGeo = new THREE.ExtrudeGeometry(makeHexShape(tileRadius), {
      depth: 0.018,
      bevelEnabled: true,
      bevelSegments: 3,
      steps: 1,
      bevelSize: 0.005,
      bevelThickness: 0.005
    });
    applyCenteredHexUVs(hexGeo, tileRadius);

    const ringGeo = new THREE.RingGeometry(HEX_RADIUS * 0.72, HEX_RADIUS * 0.84, 6);
    const haloPlaneGeo = new THREE.PlaneGeometry(HEX_RADIUS * 2.7, HEX_RADIUS * 2.7);

    // --- Center Power-Core Hexagon (Glowing Colored Rim + Bottom-to-Top Fill + Timer Inside) ---
    const centerSocketGeo = new THREE.ExtrudeGeometry(makeHexShape(CENTER_HEX_RADIUS * 1.02), {
      depth: 0.012,
      bevelEnabled: true,
      bevelSegments: 3,
      steps: 1,
      bevelSize: 0.006,
      bevelThickness: 0.005
    });

    const centerCoreRadius = CENTER_HEX_RADIUS * 0.86;
    const centerHexGeo = new THREE.ExtrudeGeometry(makeHexShape(centerCoreRadius), {
      depth: 0.024,
      bevelEnabled: true,
      bevelSegments: 4,
      steps: 1,
      bevelSize: 0.006,
      bevelThickness: 0.006
    });
    applyCenteredHexUVs(centerHexGeo, centerCoreRadius);

    // Thick glowing border around the middle hexagon (always shows the target color!)
    const centerRimBandGeo = new THREE.RingGeometry(CENTER_HEX_RADIUS * 0.84, CENTER_HEX_RADIUS * 0.99, 6);
    const centerOuterWhiteRimGeo = new THREE.RingGeometry(CENTER_HEX_RADIUS * 0.98, CENTER_HEX_RADIUS * 1.03, 6);
    const centerHaloGeo = new THREE.PlaneGeometry(CENTER_HEX_RADIUS * 3.3, CENTER_HEX_RADIUS * 3.3);

    // Dynamic Canvas for Center Hexagon Fill Gauge + Timer Text
    const centerCanvas = document.createElement('canvas');
    centerCanvas.width = 512;
    centerCanvas.height = 512;
    const centerCtx = centerCanvas.getContext('2d');
    const centerGaugeTex = new THREE.CanvasTexture(centerCanvas);

    const centerMat = new THREE.MeshBasicMaterial({
      map: centerGaugeTex
    });
    const centerRimBandMat = new THREE.MeshBasicMaterial({
      color: COLOR_PALETTE[0].hex
    });
    const centerOuterWhiteRimMat = new THREE.MeshBasicMaterial({
      color: COLOR_PALETTE[0].rim,
      transparent: true,
      opacity: 0.95
    });
    const centerHaloMat = new THREE.MeshBasicMaterial({
      color: COLOR_PALETTE[0].halo,
      map: bloomHaloTex,
      transparent: true,
      opacity: 0.72,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const centerBeaconGroup = new THREE.Group();
    const centerSocketMesh = new THREE.Mesh(centerSocketGeo, socketMat);
    const centerHaloMesh = new THREE.Mesh(centerHaloGeo, centerHaloMat);
    centerHaloMesh.position.z = 0.008;

    const centerBeaconMesh = new THREE.Mesh(centerHexGeo, centerMat);
    centerBeaconMesh.position.z = 0.010;

    const centerRimBand = new THREE.Mesh(centerRimBandGeo, centerRimBandMat);
    centerRimBand.position.z = 0.032;

    const centerOuterWhiteRim = new THREE.Mesh(centerOuterWhiteRimGeo, centerOuterWhiteRimMat);
    centerOuterWhiteRim.position.z = 0.034;

    centerBeaconMesh.add(centerRimBand, centerOuterWhiteRim);
    centerBeaconGroup.add(centerSocketMesh, centerHaloMesh, centerBeaconMesh);
    centerBeaconGroup.position.set(0, 0, 0.008);
    boardRoot.add(centerBeaconGroup);

    let lastDrawnSeconds = -1;
    let lastDrawnFill = -1;
    let lastDrawnColorIdx = -1;
    let lastDrawnStage = -1;

    function renderCenterGaugeCanvas(elapsed) {
      const secInt = Math.max(0, Math.ceil(timeRemaining));
      const quantizedFill = Math.round(displayFill * 250) / 250;

      // Redraw when seconds, fill level, color, or stage changes (or wave animates while partially filled)
      const isAnimatingWave = quantizedFill > 0.005 && quantizedFill < 0.995;
      if (
        !isAnimatingWave &&
        secInt === lastDrawnSeconds &&
        quantizedFill === lastDrawnFill &&
        targetColorIdx === lastDrawnColorIdx &&
        stageNumber === lastDrawnStage
      ) {
        return;
      }

      lastDrawnSeconds = secInt;
      lastDrawnFill = quantizedFill;
      lastDrawnColorIdx = targetColorIdx;
      lastDrawnStage = stageNumber;

      const pal = COLOR_PALETTE[targetColorIdx];
      const w = 512;
      const h = 512;

      // 1. Dark hollow interior background
      centerCtx.fillStyle = '#091318';
      centerCtx.fillRect(0, 0, w, h);

      // Subtle inner border tint
      centerCtx.strokeStyle = pal.cssDark;
      centerCtx.lineWidth = 28;
      centerCtx.strokeRect(0, 0, w, h);

      // 2. Bottom-to-Top Colored Energy Fill
      if (quantizedFill > 0.002) {
        const fillHeight = h * quantizedFill;
        const topY = h - fillHeight;

        const grad = centerCtx.createLinearGradient(0, topY, 0, h);
        grad.addColorStop(0.0, pal.cssLight);
        grad.addColorStop(0.22, pal.css);
        grad.addColorStop(1.0, pal.cssDark);

        centerCtx.fillStyle = grad;
        centerCtx.beginPath();
        centerCtx.moveTo(0, h);
        centerCtx.lineTo(0, topY);

        // Gentle energy wave crest along the fill line when charging
        if (quantizedFill < 0.99) {
          for (let x = 0; x <= w; x += 16) {
            const waveY = topY + Math.sin(x * 0.025 + elapsed * 6.0) * 6;
            centerCtx.lineTo(x, waveY);
          }
        } else {
          centerCtx.lineTo(w, topY);
        }

        centerCtx.lineTo(w, h);
        centerCtx.closePath();
        centerCtx.fill();

        // Bright glowing meniscus line at the fill surface
        if (quantizedFill < 0.99) {
          centerCtx.strokeStyle = '#ffffff';
          centerCtx.lineWidth = 6;
          centerCtx.beginPath();
          for (let x = 0; x <= w; x += 16) {
            const waveY = topY + Math.sin(x * 0.025 + elapsed * 6.0) * 6;
            if (x === 0) centerCtx.moveTo(x, waveY);
            else centerCtx.lineTo(x, waveY);
          }
          centerCtx.stroke();
        }
      }

      // 3. Crisp Countdown Timer Inside the Middle Hexagon
      centerCtx.save();
      centerCtx.textAlign = 'center';
      centerCtx.textBaseline = 'middle';

      // Soft dark halo behind digits so timer is always ultra-legible against both dark & bright fill
      centerCtx.fillStyle = 'rgba(6, 14, 18, 0.52)';
      centerCtx.beginPath();
      centerCtx.arc(256, 246, 94, 0, Math.PI * 2);
      centerCtx.fill();

      centerCtx.font = '800 116px system-ui, -apple-system, sans-serif';
      centerCtx.fillStyle = (secInt <= 5 && stageClearPause <= 0) ? '#ff8a80' : '#ffffff';
      centerCtx.fillText(String(secInt), 256, 248);

      // Stage label tucked cleanly below the timer
      centerCtx.font = '700 28px system-ui, -apple-system, sans-serif';
      centerCtx.fillStyle = pal.cssLight;
      centerCtx.fillText(`STAGE ${stageNumber}`, 256, 366);
      centerCtx.restore();

      centerGaugeTex.needsUpdate = true;
    }

    // --- Tile Grid & Stage Setup ---
    let tiles = [];

    function lightTileWithColor(tile, cIdx) {
      const pal = COLOR_PALETTE[cIdx];
      tile.isLit = true;
      tile.colorIdx = cIdx;
      tile.mat.color.setHex(pal.hex);
      tile.mat.emissive.setHex(pal.emissive);
      tile.mat.emissiveIntensity = 1.35;
      tile.mat.opacity = 1.0;

      tile.rimMat.color.setHex(pal.rim);
      tile.rimMat.opacity = 1.0;

      tile.haloMat.color.setHex(pal.halo);
      tile.haloMesh.visible = true;
    }

    function resetTileToIdle(t) {
      t.isLit = false;
      t.mat.color.setHex(0x162b33);
      t.mat.emissive.setHex(0x0b1c22);
      t.mat.emissiveIntensity = 0.25;
      t.mat.opacity = 0.88;

      t.rimMat.color.setHex(0x284e5c);
      t.rimMat.opacity = 0.55;

      t.haloMesh.visible = false;
    }

    function startNewStage(advanceColor = true, withRipple = true) {
      if (advanceColor) {
        stageNumber++;
        targetColorIdx = (targetColorIdx + 1) % COLOR_PALETTE.length;
      }

      const pal = COLOR_PALETTE[targetColorIdx];
      centerRimBandMat.color.setHex(pal.hex);
      centerOuterWhiteRimMat.color.setHex(pal.rim);
      centerHaloMat.color.setHex(pal.halo);

      // Clear any in-flight energy packets from previous round
      for (let i = powerPulses.length - 1; i >= 0; i--) {
        const pp = powerPulses[i];
        boardRoot.remove(pp.mesh);
        pp.mat.dispose();
        pp.trails.forEach(tr => {
          boardRoot.remove(tr.mesh);
          tr.mat.dispose();
        });
      }
      powerPulses.length = 0;

      timeRemaining = ROUND_DURATION;
      collectedCount = 0;
      targetFill = 0.0;
      displayFill = 0.0;
      stageClearPause = 0;

      if (withRipple) {
        spawnBoardRipple(centerBeaconGroup.position, pal.halo, 2.0);
      }

      if (tiles.length === 0) return;
      for (const t of tiles) resetTileToIdle(t);

      // Determine how many matching target hexagons to place on the wall
      const shuffled = [...tiles].sort(() => Math.random() - 0.5);
      requiredTiles = Math.min(5, Math.max(2, Math.floor(shuffled.length * 0.36)));
      const distractorCount = Math.min(7, Math.max(0, shuffled.length - requiredTiles));

      let idx = 0;
      for (let i = 0; i < requiredTiles; i++, idx++) {
        lightTileWithColor(shuffled[idx], targetColorIdx);
      }

      for (let i = 0; i < distractorCount; i++, idx++) {
        let otherColor = Math.floor(Math.random() * COLOR_PALETTE.length);
        if (otherColor === targetColorIdx) {
          otherColor = (otherColor + 1) % COLOR_PALETTE.length;
        }
        lightTileWithColor(shuffled[idx], otherColor);
      }

      renderCenterGaugeCanvas(0);
    }

    function rebuildHexGrid() {
      while (hexContainer.children.length > 0) {
        hexContainer.remove(hexContainer.children[0]);
      }
      tiles = [];

      const halfW = boardState.width / 2 - HEX_RADIUS * 0.98;
      const halfH = boardState.height / 2 - HEX_RADIUS * 0.98;
      if (halfW <= 0 || halfH <= 0) return;

      const dx = HEX_RADIUS * 1.56;
      const dy = HEX_RADIUS * Math.sqrt(3) * 0.93;
      const centerClearance = CENTER_HEX_RADIUS + HEX_RADIUS * 1.05;
      let col = 0;

      for (let x = -halfW; x <= halfW; x += dx) {
        const yOffset = (col % 2 === 1) ? dy * 0.5 : 0;
        for (let y = -halfH + yOffset; y <= halfH; y += dy) {
          if (Math.hypot(x, y) < centerClearance) continue;

          const socketMesh = new THREE.Mesh(socketGeo, socketMat);
          socketMesh.position.set(x, y, 0.002);
          hexContainer.add(socketMesh);

          const haloMat = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            map: bloomHaloTex,
            transparent: true,
            opacity: 0.65,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          const haloMesh = new THREE.Mesh(haloPlaneGeo, haloMat);
          haloMesh.position.set(x, y, 0.006);
          haloMesh.visible = false;
          hexContainer.add(haloMesh);

          const tileMat = new THREE.MeshPhysicalMaterial({
            color: 0x162b33,
            map: diffuserTex,
            emissive: 0x0b1c22,
            emissiveMap: diffuserTex,
            emissiveIntensity: 0.25,
            roughness: 0.14,
            metalness: 0.05,
            clearcoat: 1.0,
            clearcoatRoughness: 0.08,
            transparent: true,
            opacity: 0.88
          });
          const rimMat = new THREE.MeshBasicMaterial({
            color: 0x284e5c,
            transparent: true,
            opacity: 0.55
          });

          const mesh = new THREE.Mesh(hexGeo, tileMat);
          const rim = new THREE.Mesh(ringGeo, rimMat);
          rim.position.z = 0.024;
          mesh.add(rim);

          mesh.position.set(x, y, 0.006);
          hexContainer.add(mesh);

          tiles.push({
            mesh,
            rim,
            haloMesh,
            mat: tileMat,
            rimMat,
            haloMat,
            localX: x,
            localY: y,
            worldPos: new THREE.Vector3(),
            isLit: false,
            colorIdx: 0,
            popZ: 0.006,
            nudgeTimer: 0
          });
        }
        col++;
      }

      startNewStage(false, false);
    }

    function updateBoardLayout(rebuildTiles = true) {
      boardRoot.position.set(boardState.x, boardState.y, boardState.z);
      boardRoot.rotation.set(0, boardState.yaw, 0);

      const w = boardState.width;
      const h = boardState.height;

      backPlane.scale.set(w, h, 1);
      backPlaneMat.opacity = isEditMode ? 0.48 : 0.22;

      topBar.scale.set(w, 1, 1);
      topBar.position.set(0, h / 2, 0.01);

      botBar.scale.set(w, 1, 1);
      botBar.position.set(0, -h / 2, 0.01);

      leftBar.scale.set(1, h, 1);
      leftBar.position.set(-w / 2, 0, 0.01);

      rightBar.scale.set(1, h, 1);
      rightBar.position.set(w / 2, 0, 0.01);

      frameMat.opacity = isEditMode ? 0.95 : 0.35;

      // Version badge tucked on bottom-right corner of the frame
      versionBadgeMesh.position.set(w / 2 - 0.11, -h / 2 - 0.032, 0.022);

      for (const ch of cornerHandles) {
        ch.mesh.visible = isEditMode;
        ch.mesh.position.set(ch.sx * (w / 2), ch.sy * (h / 2), 0.022);
      }

      lockBtn.visible = isEditMode;
      bringHereBtn.visible = isEditMode;
      editBtn.visible = !isEditMode;

      const dockY = -h / 2 - 0.095;
      lockBtn.position.set(-0.20, dockY, 0.025);
      bringHereBtn.position.set(0.20, dockY, 0.025);
      editBtn.position.set(0, -h / 2 - 0.085, 0.025);

      if (rebuildTiles) rebuildHexGrid();
    }

    function snapBoardInFrontOfUser(resetDimensions = false) {
      const headPos = new THREE.Vector3();
      const headDir = new THREE.Vector3();
      camera.getWorldPosition(headPos);
      camera.getWorldDirection(headDir);
      headDir.y = 0;
      if (headDir.lengthSq() < 0.001) headDir.set(0, 0, -1);
      headDir.normalize();

      boardState.x = headPos.x + headDir.x * 1.30;
      boardState.y = Math.max(0.95, headPos.y - 0.10);
      boardState.z = headPos.z + headDir.z * 1.30;
      boardState.yaw = Math.atan2(-headDir.x, -headDir.z);

      if (resetDimensions) {
        boardState.width = DEFAULT_SIZE.width;
        boardState.height = DEFAULT_SIZE.height;
      }
      updateBoardLayout(resetDimensions);
    }

    function setEditMode(enabled) {
      isEditMode = enabled;
      updateBoardLayout(false);
      saveBoardSize();
      if (!enabled) {
        // Fresh 20s timer as soon as player locks the wall and begins
        timeRemaining = ROUND_DURATION;
      }
    }

    updateBoardLayout(true);

    // --- Invisible Power-Line Energy Packet Spawner ---
    function spawnPowerTransferPacket(startLocalX, startLocalY, pal, fillContribution) {
      const mat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 1.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(energyOrbGeo, mat);
      // Travels along the board plane (z = 0.016, just behind the raised tiles) straight into center hexagon
      mesh.position.set(startLocalX, startLocalY, 0.016);
      boardRoot.add(mesh);

      // Glowing colored aura around the energy packet
      const haloMat = new THREE.MeshBasicMaterial({
        color: pal.halo,
        map: bloomHaloTex,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const halo = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.16), haloMat);
      mesh.add(halo);

      // Create 4 trailing streak dots behind the main orb
      const trails = [];
      for (let i = 0; i < 4; i++) {
        const tMat = new THREE.MeshBasicMaterial({
          color: pal.hex,
          transparent: true,
          opacity: 0.75 - i * 0.15,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const tMesh = new THREE.Mesh(energyTrailGeo, tMat);
        tMesh.position.set(startLocalX, startLocalY, 0.015);
        tMesh.scale.setScalar(0.85 - i * 0.15);
        boardRoot.add(tMesh);
        trails.push({ mesh: tMesh, mat: tMat });
      }

      // Slight curved arc offset so the power line looks organic
      const perpX = -startLocalY * 0.22;
      const perpY = startLocalX * 0.22;

      powerPulses.push({
        mesh,
        mat,
        haloMat,
        trails,
        startX: startLocalX,
        startY: startLocalY,
        ctrlX: startLocalX * 0.5 + perpX,
        ctrlY: startLocalY * 0.5 + perpY,
        age: 0,
        duration: 0.38,
        pal,
        fillContribution
      });
    }

    // --- Tile Touch Sparkle Burst ---
    function spawnHexPopEffect(worldPos, colorHex, haloHex) {
      const fMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const fMesh = new THREE.Mesh(flashSphereGeo, fMat);
      fMesh.position.copy(worldPos);
      scene.add(fMesh);
      activeEffects.push({
        mesh: fMesh, mat: fMat,
        vx: 0, vy: 0, vz: 0, rx: 0, ry: 0, rz: 0,
        age: 0, maxAge: 0.18, kind: 'scale', startScale: 0.7, endScale: 2.3
      });

      const rMat = new THREE.MeshBasicMaterial({
        color: haloHex,
        transparent: true,
        opacity: 0.95,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const rMesh = new THREE.Mesh(shockwaveGeo, rMat);
      rMesh.position.copy(worldPos);
      rMesh.rotation.y = boardState.yaw;
      scene.add(rMesh);
      activeEffects.push({
        mesh: rMesh, mat: rMat,
        vx: 0, vy: 0, vz: 0, rx: 0, ry: 0, rz: 0,
        age: 0, maxAge: 0.34, kind: 'scale', startScale: 0.65, endScale: 3.1
      });

      for (let i = 0; i < 10; i++) {
        const mat = new THREE.MeshStandardMaterial({
          color: i % 2 === 0 ? colorHex : 0xffffff,
          emissive: colorHex,
          emissiveIntensity: 0.85,
          roughness: 0.1,
          flatShading: true,
          transparent: true,
          opacity: 1.0
        });
        const mesh = new THREE.Mesh(shardGeo, mat);
        mesh.position.copy(worldPos);
        scene.add(mesh);

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        const spd = 0.6 + Math.random() * 0.8;
        activeEffects.push({
          mesh, mat,
          vx: Math.sin(phi) * Math.cos(theta) * spd,
          vy: Math.cos(phi) * spd + 0.22,
          vz: Math.sin(phi) * Math.sin(theta) * spd,
          rx: (Math.random() - 0.5) * 16,
          ry: (Math.random() - 0.5) * 16,
          rz: (Math.random() - 0.5) * 16,
          age: 0,
          maxAge: 0.5,
          kind: 'shard'
        });
      }
    }

    // --- Bare Hands (Primary) & Optional Controller Ray (for Setup) ---
    const touchProbes = [];
    const raycaster = new THREE.Raycaster();
    let activeDrag = null;

    function handleRaySelectStart(origin, dir, dragOwner, pulseFn) {
      raycaster.set(origin, dir);

      if (isEditMode) {
        if (raycaster.intersectObject(lockBtn).length > 0) {
          playClickTone();
          if (pulseFn) pulseFn(0.45, 50);
          setEditMode(false);
          return true;
        }
        if (raycaster.intersectObject(bringHereBtn).length > 0) {
          playClickTone();
          if (pulseFn) pulseFn(0.45, 50);
          snapBoardInFrontOfUser(false);
          return true;
        }

        const cornerMeshes = cornerHandles.map(c => c.hitMesh);
        const cornerHits = raycaster.intersectObjects(cornerMeshes, false);
        if (cornerHits.length > 0) {
          const hitHandle = cornerHandles.find(c => c.hitMesh === cornerHits[0].object);
          if (hitHandle) {
            if (pulseFn) pulseFn(0.35, 40);
            activeDrag = {
              owner: dragOwner,
              type: 'resize',
              distance: cornerHits[0].distance
            };
            return true;
          }
        }

        const boardHits = raycaster.intersectObject(backPlane, false);
        if (boardHits.length > 0) {
          if (pulseFn) pulseFn(0.3, 35);
          const localHit = boardRoot.worldToLocal(boardHits[0].point.clone());
          activeDrag = {
            owner: dragOwner,
            type: 'move',
            distance: boardHits[0].distance,
            offsetLocalX: localHit.x,
            offsetLocalY: localHit.y
          };
          return true;
        }
      } else {
        if (raycaster.intersectObject(editBtn).length > 0) {
          playClickTone();
          if (pulseFn) pulseFn(0.45, 50);
          setEditMode(true);
          return true;
        }
      }
      return false;
    }

    function setupInputRayController(index) {
      const controller = renderer.xr.getController(index);
      scene.add(controller);

      // Subtle aiming line shown ONLY during Wall Setup (Edit Mode) so dragging/resizing is effortless
      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, -0.02),
        new THREE.Vector3(0, 0, -3.5)
      ]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x4dd0e1, transparent: true, opacity: 0.65 });
      const rayLine = new THREE.Line(lineGeo, lineMat);
      rayLine.visible = false;
      controller.add(rayLine);

      const state = {
        controller,
        rayLine,
        inputSource: null,
        connected: false
      };

      controller.addEventListener('connected', (e) => {
        state.inputSource = e.data;
        state.connected = true;
      });
      controller.addEventListener('disconnected', () => {
        state.inputSource = null;
        state.connected = false;
        rayLine.visible = false;
        if (activeDrag && activeDrag.owner === state) activeDrag = null;
      });

      const pulseHaptic = (strength = 0.45, ms = 40) => {
        const gp = state.inputSource && state.inputSource.gamepad;
        if (gp && gp.hapticActuators && gp.hapticActuators[0]) {
          gp.hapticActuators[0].pulse(strength, ms);
        }
      };

      const onSelectStart = () => {
        const origin = new THREE.Vector3();
        const dir = new THREE.Vector3();
        controller.getWorldPosition(origin);
        dir.set(0, 0, -1).applyQuaternion(controller.quaternion).normalize();
        handleRaySelectStart(origin, dir, state, pulseHaptic);
      };

      const onSelectEnd = () => {
        if (activeDrag && activeDrag.owner === state) {
          activeDrag = null;
          saveBoardSize();
        }
      };

      controller.addEventListener('selectstart', onSelectStart);
      controller.addEventListener('selectend', onSelectEnd);
      controller.addEventListener('squeezestart', onSelectStart);
      controller.addEventListener('squeezeend', onSelectEnd);

      return state;
    }

    function setupBareHand(index) {
      const hand = renderer.xr.getHand(index);
      scene.add(hand);

      const trackedJoints = [
        { name: 'index-finger-tip',          showCursor: true },
        { name: 'middle-finger-tip',         showCursor: false },
        { name: 'ring-finger-tip',           showCursor: false },
        { name: 'thumb-tip',                 showCursor: false },
        { name: 'middle-finger-metacarpal',  showCursor: false }
      ];

      for (const jCfg of trackedJoints) {
        let cursorGroup = null;
        if (jCfg.showCursor) {
          cursorGroup = new THREE.Group();
          const core = new THREE.Mesh(
            new THREE.SphereGeometry(0.011, 14, 14),
            new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.92 })
          );
          const aura = new THREE.Mesh(
            new THREE.SphereGeometry(0.022, 16, 16),
            new THREE.MeshBasicMaterial({
              color: 0x00e5ff,
              transparent: true,
              opacity: 0.35,
              blending: THREE.AdditiveBlending,
              depthWrite: false
            })
          );
          cursorGroup.add(core, aura);
          cursorGroup.visible = false;
          scene.add(cursorGroup);
        }

        touchProbes.push({
          getPoint: (outPt) => {
            const joint = hand.joints && hand.joints[jCfg.name];
            if (!joint) {
              if (cursorGroup) cursorGroup.visible = false;
              return false;
            }
            joint.getWorldPosition(outPt);
            if (outPt.lengthSq() < 0.0001) {
              if (cursorGroup) cursorGroup.visible = false;
              return false;
            }
            if (cursorGroup) {
              cursorGroup.position.copy(outPt);
              cursorGroup.visible = true;
            }
            return true;
          }
        });
      }
    }

    const rayControllers = [setupInputRayController(0), setupInputRayController(1)];
    setupBareHand(0);
    setupBareHand(1);

    // --- Check WebXR Support & Start Directly Into Freefall Wall Setup ---
    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-ar').then(supported => {
        if (supported) {
          startBtn.disabled = false;
          startBtn.textContent = 'START AR';
        } else {
          startBtn.textContent = 'AR Not Supported Here';
          statusEl.textContent = 'Open this page inside the Meta Quest Browser on Quest 3.';
        }
      }).catch(err => {
        statusEl.textContent = 'XR Check Error: ' + err.message;
      });
    } else {
      startBtn.textContent = 'WebXR Unavailable';
      statusEl.textContent = 'Requires HTTPS and Meta Quest Browser.';
    }

    startBtn.addEventListener('click', async () => {
      try {
        statusEl.textContent = 'Launching AR...';
        initAudio();

        // Always start in freefall Wall Setup mode, snapped cleanly in front of the player
        isEditMode = true;
        needsInitialSnapToFront = true;
        stageNumber = 1;
        targetColorIdx = 0; // Purple first
        rebuildHexGrid();
        updateBoardLayout(false);

        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['local-floor'],
          optionalFeatures: ['hand-tracking']
        });

        launchScreen.style.display = 'none';
        statusEl.textContent = '';

        renderer.xr.setReferenceSpaceType('local-floor');
        await renderer.xr.setSession(session);

        session.addEventListener('end', () => {
          activeDrag = null;
          launchScreen.style.display = 'block';
        });
      } catch (err) {
        launchScreen.style.display = 'block';
        statusEl.textContent = 'Could not start AR: ' + err.message;
      }
    });

    // --- Helper for Board-Local Button Poke Detection ---
    function isPointInsideBoardButton(localPt, btnObj) {
      const bx = btnObj.mesh.position.x;
      const by = btnObj.mesh.position.y;
      return (
        Math.abs(localPt.x - bx) <= btnObj.w * 0.56 &&
        Math.abs(localPt.y - by) <= btnObj.h * 0.65 &&
        localPt.z >= -0.09 &&
        localPt.z <= 0.12
      );
    }

    // --- Main Frame Loop ---
    const clock = new THREE.Clock();
    const probePt = new THREE.Vector3();
    const rayOrigin = new THREE.Vector3();
    const rayDir = new THREE.Vector3();
    const targetWorldPt = new THREE.Vector3();
    const localPt = new THREE.Vector3();

    const HEX_HIT_RADIUS = HEX_RADIUS * 1.18;
    let buttonCooldownUntil = 0;

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      // Snap board directly in front of the user on the first tracked XR frame so it never spawns backwards
      if (needsInitialSnapToFront) {
        camera.getWorldPosition(targetWorldPt);
        if (targetWorldPt.lengthSq() > 0.0001) {
          snapBoardInFrontOfUser(false);
          needsInitialSnapToFront = false;
        }
      }

      // Show aiming rays only during Wall Setup Mode
      for (const rc of rayControllers) {
        rc.rayLine.visible = isEditMode && rc.connected;
      }

      // 1. Handle Active Board Dragging or Corner Resizing
      if (activeDrag && isEditMode) {
        activeDrag.owner.controller.getWorldPosition(rayOrigin);
        rayDir.set(0, 0, -1).applyQuaternion(activeDrag.owner.controller.quaternion).normalize();
        targetWorldPt.copy(rayOrigin).addScaledVector(rayDir, activeDrag.distance);

        if (activeDrag.type === 'move') {
          const flatDirX = -rayDir.x;
          const flatDirZ = -rayDir.z;
          if (flatDirX * flatDirX + flatDirZ * flatDirZ > 0.01) {
            boardState.yaw = Math.atan2(flatDirX, flatDirZ);
          }

          const cosY = Math.cos(boardState.yaw);
          const sinY = Math.sin(boardState.yaw);
          const worldOffsetX = activeDrag.offsetLocalX * cosY;
          const worldOffsetZ = -activeDrag.offsetLocalX * sinY;

          boardState.x = targetWorldPt.x - worldOffsetX;
          boardState.y = Math.max(0.45, targetWorldPt.y - activeDrag.offsetLocalY);
          boardState.z = targetWorldPt.z - worldOffsetZ;
          updateBoardLayout(false);
        } else if (activeDrag.type === 'resize') {
          localPt.copy(targetWorldPt);
          boardRoot.worldToLocal(localPt);

          const newWidth = Math.max(0.85, Math.min(4.2, Math.abs(localPt.x) * 2));
          const newHeight = Math.max(0.75, Math.min(3.0, Math.abs(localPt.y) * 2));

          if (Math.abs(newWidth - boardState.width) > 0.015 || Math.abs(newHeight - boardState.height) > 0.015) {
            boardState.width = newWidth;
            boardState.height = newHeight;
            updateBoardLayout(true);
          }
        }
      }

      // 2. Stage Timer & Power-Fill Progression (Only when locked & playing)
      if (!isEditMode) {
        if (stageClearPause > 0) {
          stageClearPause -= dt;
          if (stageClearPause <= 0) {
            startNewStage(true, true);
          }
        } else {
          timeRemaining -= dt;
          if (timeRemaining <= 0) {
            timeRemaining = 0;
            playGentleResetTone();
            startNewStage(false, true);
          }
        }
      }

      // Smoothly animate liquid energy level inside center hexagon
      displayFill += (targetFill - displayFill) * Math.min(1, dt * 8.5);
      if (Math.abs(targetFill - displayFill) < 0.002) displayFill = targetFill;

      // Trigger stage completion once energy has finished filling the middle hexagon
      if (!isEditMode && stageClearPause <= 0 && collectedCount >= requiredTiles && displayFill >= 0.985) {
        displayFill = 1.0;
        stageClearPause = 1.05;
        const pal = COLOR_PALETTE[targetColorIdx];
        spawnBoardRipple(centerBeaconGroup.position, pal.halo, 2.3);
        playStageCompleteChord();
      }

      renderCenterGaugeCanvas(elapsed);

      // 3. Animate Center Hexagon & Little Wall Hexagons
      boardRoot.updateMatrixWorld(true);

      const beaconPulse = 1.0 + Math.sin(elapsed * 3.8) * 0.035 + (stageClearPause > 0 ? 0.06 : 0);
      centerBeaconMesh.scale.setScalar(beaconPulse);
      centerHaloMat.opacity = 0.58 + displayFill * 0.35 + Math.sin(elapsed * 4.0) * 0.1;

      for (let i = 0; i < tiles.length; i++) {
        const t = tiles[i];
        if (t.nudgeTimer > 0) {
          t.nudgeTimer = Math.max(0, t.nudgeTimer - dt);
        }

        const isMatchingColor = t.isLit && (t.colorIdx === targetColorIdx);
        const breathe = (t.isLit && !isEditMode) ? Math.sin(elapsed * 4.8 + i * 0.7) : 0;

        if (t.isLit && !isEditMode) {
          t.mat.emissiveIntensity = isMatchingColor ? (1.45 + breathe * 0.28) : 1.15;
          t.haloMat.opacity = isMatchingColor ? (0.68 + breathe * 0.18) : 0.45;
          t.mesh.scale.setScalar(isMatchingColor ? (1.0 + breathe * 0.025) : 1.0);
        } else {
          t.mesh.scale.setScalar(1.0);
        }

        const pulseZ = isMatchingColor ? breathe * 0.004 : 0;
        const nudgeDip = t.nudgeTimer > 0 ? -Math.sin((t.nudgeTimer / 0.25) * Math.PI) * 0.014 : 0;
        const targetZ = (t.isLit && !isEditMode) ? (0.026 + pulseZ + nudgeDip) : 0.006;

        t.popZ += (targetZ - t.popZ) * Math.min(1, dt * 15);
        t.mesh.position.z = t.popZ;
        if (t.isLit) t.mesh.getWorldPosition(t.worldPos);
      }

      // 4. Animate Travelling Energy Packets Along Invisible Power Lines Into Center
      for (let i = powerPulses.length - 1; i >= 0; i--) {
        const pp = powerPulses[i];
        pp.age += dt;
        const rawT = Math.min(1, pp.age / pp.duration);
        // Smooth ease-in-out curve
        const t = rawT < 0.5 ? 2 * rawT * rawT : 1 - Math.pow(-2 * rawT + 2, 2) / 2;

        // Quadratic Bezier curve from touched hexagon to center (0, 0)
        const invT = 1 - t;
        const bx = invT * invT * pp.startX + 2 * invT * t * pp.ctrlX;
        const by = invT * invT * pp.startY + 2 * invT * t * pp.ctrlY;
        pp.mesh.position.set(bx, by, 0.024);

        // Update trailing streak dots
        for (let k = 0; k < pp.trails.length; k++) {
          const trailT = Math.max(0, t - (k + 1) * 0.065);
          const invTrail = 1 - trailT;
          const tx = invTrail * invTrail * pp.startX + 2 * invTrail * trailT * pp.ctrlX;
          const ty = invTrail * invTrail * pp.startY + 2 * invTrail * trailT * pp.ctrlY;
          pp.trails[k].mesh.position.set(tx, ty, 0.022);
        }

        if (rawT >= 1) {
          // Arrived at middle hexagon: transfer power into the center gauge!
          targetFill = Math.min(1.0, targetFill + pp.fillContribution);
          spawnBoardRipple(centerBeaconGroup.position, pp.pal.halo, 1.35);
          playPowerAbsorbSound(targetFill);

          boardRoot.remove(pp.mesh);
          pp.mat.dispose();
          pp.haloMat.dispose();
          pp.trails.forEach(tr => {
            boardRoot.remove(tr.mesh);
            tr.mat.dispose();
          });
          powerPulses.splice(i, 1);
        }
      }

      // 5. Bare-Hand Touch Detection (Buttons & Wall Hexagons)
      const nowMs = performance.now();
      for (let p = 0; p < touchProbes.length; p++) {
        const probe = touchProbes[p];
        if (!probe.getPoint(probePt)) continue;

        localPt.copy(probePt);
        boardRoot.worldToLocal(localPt);

        // Direct finger poke on dock buttons
        if (nowMs >= buttonCooldownUntil) {
          if (isEditMode) {
            if (isPointInsideBoardButton(localPt, lockBtnObj)) {
              buttonCooldownUntil = nowMs + 600;
              playClickTone();
              setEditMode(false);
              break;
            }
            if (isPointInsideBoardButton(localPt, bringHereBtnObj)) {
              buttonCooldownUntil = nowMs + 600;
              playClickTone();
              snapBoardInFrontOfUser(false);
              break;
            }
          } else {
            if (isPointInsideBoardButton(localPt, editBtnObj)) {
              buttonCooldownUntil = nowMs + 600;
              playClickTone();
              setEditMode(true);
              break;
            }
          }
        }

        if (isEditMode || stageClearPause > 0) continue;

        // Check Lit Hexagons
        for (let i = 0; i < tiles.length; i++) {
          const t = tiles[i];
          if (!t.isLit) continue;

          const planarDist = Math.hypot(localPt.x - t.localX, localPt.y - t.localY);
          const isHit = (planarDist <= HEX_HIT_RADIUS && localPt.z >= -0.09 && localPt.z <= 0.11);

          if (isHit) {
            if (t.colorIdx === targetColorIdx) {
              const pal = COLOR_PALETTE[t.colorIdx];
              spawnBoardRipple(t.mesh.position, pal.halo, 1.1);
              spawnHexPopEffect(t.worldPos, pal.hex, pal.halo);
              playTileTouchChime();

              resetTileToIdle(t);
              collectedCount++;

              const fillShare = 1.0 / requiredTiles;
              spawnPowerTransferPacket(t.localX, t.localY, pal, fillShare);
            } else if (t.nudgeTimer <= 0) {
              t.nudgeTimer = 0.25;
              playGentleWrongTap();
            }
            break;
          }
        }
      }

      // 6. Animate Board Ripples & 3D Pop Particles
      for (let i = boardRipples.length - 1; i >= 0; i--) {
        const r = boardRipples[i];
        r.age += dt;
        const prog = r.age / 0.44;
        if (prog >= 1) {
          boardRoot.remove(r.mesh);
          r.mat.dispose();
          boardRipples.splice(i, 1);
        } else {
          r.mesh.scale.setScalar((1 + prog * 1.25) * (r.scaleMult || 1));
          r.mat.opacity = 0.92 * (1 - prog);
        }
      }

      for (let i = activeEffects.length - 1; i >= 0; i--) {
        const ef = activeEffects[i];
        ef.age += dt;
        const prog = ef.age / ef.maxAge;
        if (prog >= 1) {
          scene.remove(ef.mesh);
          ef.mat.dispose();
          activeEffects.splice(i, 1);
          continue;
        }

        if (ef.kind === 'scale') {
          const s = ef.startScale + (ef.endScale - ef.startScale) * (1 - Math.pow(1 - prog, 2));
          ef.mesh.scale.setScalar(s);
          ef.mat.opacity = 0.92 * (1 - prog);
        } else {
          ef.vy -= 2.1 * dt;
          ef.mesh.position.x += ef.vx * dt;
          ef.mesh.position.y += ef.vy * dt;
          ef.mesh.position.z += ef.vz * dt;
          ef.mesh.rotation.x += ef.rx * dt;
          ef.mesh.rotation.y += ef.ry * dt;
          ef.mesh.rotation.z += ef.rz * dt;
          ef.mat.opacity = 1.0 - prog;
        }
      }

      renderer.render(scene, camera);
    });
  </script>
</body>
