<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MR Luminous Color Hex Wall</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0a1216;
      color: #eaf6f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #122026;
      border: 1px solid #243e48;
      border-radius: 24px;
      padding: 28px 24px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 10;
    }
    h1 { font-size: 1.65rem; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.02em; }
    p.sub { color: #90b4be; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.45; }
    .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: #7fa3ad; margin-bottom: 8px; display: block; }
    .pill-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .pill-group.two { grid-template-columns: repeat(2, 1fr); }
    .pill {
      background: #0c171c;
      border: 2px solid #223b44;
      color: #b8d4dc;
      padding: 12px 8px;
      border-radius: 13px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill.active {
      background: #193b46;
      border-color: #4dd0e1;
      color: #ffffff;
    }
    #start-btn {
      width: 100%;
      padding: 19px;
      font-size: 1.2rem;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #26c6da, #00acc1);
      color: #05161a;
      cursor: pointer;
      margin-top: 6px;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    #start-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    #start-btn:active:not(:disabled) { transform: scale(0.98); }
    #status { margin-top: 12px; font-size: 0.84rem; color: #90b4be; min-height: 1.2em; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="card" id="menu-card">
    <h1>MR Color Hex Wall</h1>
    <p class="sub">Touch the glowing hexagons that match the big center hexagon using your bare hands or a controller wand.</p>

    <span class="label">1. Active Colors</span>
    <div class="pill-group two" id="colors-group">
      <button class="pill active" data-val="5">5 Vibrant Colors</button>
      <button class="pill" data-val="3">3 Calm Colors</button>
    </div>

    <span class="label">2. Optional Controller Wand</span>
    <div class="pill-group" id="length-group">
      <button class="pill active" data-val="0.90">Saber (0.90m)</button>
      <button class="pill" data-val="0.50">Wand (0.50m)</button>
      <button class="pill" data-val="0.14">Short Tip (0.14m)</button>
    </div>

    <button id="start-btn" disabled>Checking Quest XR...</button>
    <div id="status"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    const menuCard = document.getElementById('menu-card');
    const startBtn = document.getElementById('start-btn');
    const statusEl = document.getElementById('status');

    window.addEventListener('error', (e) => {
      statusEl.textContent = 'Error: ' + (e.message || 'Unknown error');
    });

    // --- Pre-AR Settings ---
    let activeColorCount = 5;
    let bladeLength = 0.90;
    const bladeAngleDeg = 52;

    function bindPills(groupId, onChange) {
      const btns = document.querySelectorAll(`#${groupId} .pill`);
      btns.forEach(btn => {
        btn.addEventListener('click', () => {
          btns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          onChange(btn.dataset.val);
        });
      });
    }

    bindPills('colors-group', v => { activeColorCount = parseInt(v, 10); });
    bindPills('length-group', v => { bladeLength = parseFloat(v); });

    // --- Procedural Sound Effects (Web Audio API) ---
    let audioCtx = null;
    const pentatonicNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
    let noteIdx = 0;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function ensureAudioReady() {
      if (!audioCtx) return false;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return true;
    }

    function playHexChime() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const freq = pentatonicNotes[noteIdx % pentatonicNotes.length];
      noteIdx++;

      // Warm fundamental + soft octave shimmer
      [1, 2].forEach((mult, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq * mult, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(idx === 0 ? 0.17 : 0.05, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.6);
      });
    }

    function playColorChangeChime() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const notes = [392.00, 523.25, 659.25];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        const t0 = now + idx * 0.065;
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.exponentialRampToValueAtTime(0.14, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.48);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.52);
      });
    }

    function playGentleWrongTap() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(165, now);
      osc.frequency.exponentialRampToValueAtTime(135, now + 0.14);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.06, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.18);
    }

    function playClickTone() {
      if (!ensureAudioReady()) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, now);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    }

    // --- Three.js Scene & Renderer ---
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.domElement.style.position = 'fixed';
    renderer.domElement.style.inset = '0';
    renderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 30);

    // Rich multi-angle lighting so bevelled edges and clearcoat glass catch highlights
    scene.add(new THREE.HemisphereLight(0xdff8ff, 0x162830, 1.1));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.35);
    keyLight.position.set(1.6, 2.8, 2.6);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x80deea, 0.65);
    fillLight.position.set(-2.2, 0.8, 2.0);
    scene.add(fillLight);

    // --- Procedural Textures for Luminous Backlit LED Tiles & Additive Halo ---
    function createDiffuserTexture() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(size / 2, size / 2, size * 0.04, size / 2, size / 2, size * 0.5);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.45, 'rgba(235, 235, 235, 0.92)');
      grad.addColorStop(0.85, 'rgba(170, 170, 170, 0.78)');
      grad.addColorStop(1.0, 'rgba(130, 130, 130, 0.70)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    function createBloomHaloTexture() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(size / 2, size / 2, size * 0.05, size / 2, size / 2, size * 0.5);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 0.95)');
      grad.addColorStop(0.35, 'rgba(255, 255, 255, 0.45)');
      grad.addColorStop(0.70, 'rgba(255, 255, 255, 0.12)');
      grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(canvas);
    }

    const diffuserTex = createDiffuserTexture();
    const bloomHaloTex = createBloomHaloTexture();

    // --- Shared Effect Geometries ---
    const shockwaveGeo = new THREE.RingGeometry(0.085, 0.118, 36);
    const flashSphereGeo = new THREE.SphereGeometry(0.10, 18, 18);
    const shardGeo = new THREE.ConeGeometry(0.018, 0.048, 4);

    const activeEffects = [];
    const boardRipples = [];

    // --- High-Contrast, Luminous Color Palette ---
    const FULL_PALETTE = [
      { name: 'Electric Blue',  hex: 0x00b0ff, emissive: 0x0091ea, rim: 0xb3e5fc, halo: 0x40c4ff },
      { name: 'Neon Pink',      hex: 0xff4081, emissive: 0xf50057, rim: 0xffcce0, halo: 0xff80ab },
      { name: 'Solar Gold',     hex: 0xffc400, emissive: 0xffab00, rim: 0xfff8e1, halo: 0xffd740 },
      { name: 'Emerald Mint',   hex: 0x00e676, emissive: 0x00c853, rim: 0xd0f8ce, halo: 0x69f0ae },
      { name: 'Vivid Violet',   hex: 0xd500f9, emissive: 0xaa00ff, rim: 0xf3e5f5, halo: 0xea80fc }
    ];

    function getCurrentPalette() {
      return FULL_PALETTE.slice(0, activeColorCount);
    }

    // --- Saved Board Layout ---
    const STORAGE_KEY = 'mr_play_wall_layout_v1';
    const DEFAULT_STATE = {
      x: 0,
      y: 1.25,
      z: -1.35,
      yaw: 0,
      width: 1.95,
      height: 1.30
    };

    function loadBoardState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { state: { ...DEFAULT_STATE }, hasSaved: false };
        const parsed = JSON.parse(raw);
        return {
          state: {
            x: Number.isFinite(parsed.x) ? parsed.x : DEFAULT_STATE.x,
            y: Number.isFinite(parsed.y) ? parsed.y : DEFAULT_STATE.y,
            z: Number.isFinite(parsed.z) ? parsed.z : DEFAULT_STATE.z,
            yaw: Number.isFinite(parsed.yaw) ? parsed.yaw : DEFAULT_STATE.yaw,
            width: Math.max(0.75, Math.min(4.5, parsed.width || DEFAULT_STATE.width)),
            height: Math.max(0.65, Math.min(3.2, parsed.height || DEFAULT_STATE.height))
          },
          hasSaved: true
        };
      } catch {
        return { state: { ...DEFAULT_STATE }, hasSaved: false };
      }
    }

    function saveBoardState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(boardState));
      } catch {}
    }

    const loaded = loadBoardState();
    let boardState = loaded.state;
    let isEditMode = !loaded.hasSaved;
    let activeXRSession = null;

    // --- Movable & Resizable Game Board Group ---
    const boardRoot = new THREE.Group();
    scene.add(boardRoot);

    function spawnBoardRipple(localPos, colorHex, scaleMult = 1.0) {
      const mat = new THREE.MeshBasicMaterial({
        color: colorHex,
        transparent: true,
        opacity: 0.95,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(shockwaveGeo, mat);
      mesh.position.copy(localPos);
      mesh.position.z += 0.032;
      boardRoot.add(mesh);
      boardRipples.push({ mesh, mat, age: 0, scaleMult });
    }

    const backPlaneMat = new THREE.MeshPhysicalMaterial({
      color: 0x071217,
      roughness: 0.25,
      metalness: 0.1,
      transparent: true,
      opacity: 0.36,
      side: THREE.DoubleSide
    });
    const backPlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), backPlaneMat);
    boardRoot.add(backPlane);

    const frameMat = new THREE.MeshStandardMaterial({
      color: 0x26c6da,
      emissive: 0x00acc1,
      emissiveIntensity: 0.65,
      roughness: 0.25,
      metalness: 0.6,
      transparent: true,
      opacity: 0.85
    });
    const topBar = new THREE.Mesh(new THREE.BoxGeometry(1, 0.016, 0.018), frameMat);
    const botBar = new THREE.Mesh(new THREE.BoxGeometry(1, 0.016, 0.018), frameMat);
    const leftBar = new THREE.Mesh(new THREE.BoxGeometry(0.016, 1, 0.018), frameMat);
    const rightBar = new THREE.Mesh(new THREE.BoxGeometry(0.016, 1, 0.018), frameMat);
    boardRoot.add(topBar, botBar, leftBar, rightBar);

    const cornerHandles = [];
    const cornerSigns = [
      { sx: -1, sy:  1 },
      { sx:  1, sy:  1 },
      { sx: -1, sy: -1 },
      { sx:  1, sy: -1 }
    ];
    const handleGeo = new THREE.SphereGeometry(0.055, 20, 20);
    const handleHitGeo = new THREE.SphereGeometry(0.11, 12, 12);

    for (const sign of cornerSigns) {
      const hMat = new THREE.MeshStandardMaterial({
        color: 0xffc400,
        emissive: 0xff8f00,
        emissiveIntensity: 0.7,
        roughness: 0.2
      });
      const visMesh = new THREE.Mesh(handleGeo, hMat);
      const hitMesh = new THREE.Mesh(handleHitGeo, new THREE.MeshBasicMaterial({ visible: false }));
      visMesh.add(hitMesh);
      visMesh.position.z = 0.022;
      boardRoot.add(visMesh);
      cornerHandles.push({ mesh: visMesh, hitMesh, mat: hMat, sx: sign.sx, sy: sign.sy });
    }

    function create3DButton(label, bgHex, textHex, w = 0.34, h = 0.095) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 144;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = bgHex;
      ctx.beginPath();
      ctx.roundRect(6, 6, 500, 132, 66);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 6;
      ctx.stroke();

      ctx.fillStyle = textHex;
      ctx.font = 'bold 46px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 256, 74);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      mesh.position.z = 0.025;
      return { mesh, w, h };
    }

    // Dock Buttons (tracked in list so both controller rays AND bare fingers can tap them)
    const lockBtnObj = create3DButton('Lock & Play', '#26c6da', '#05181c', 0.34, 0.09);
    const resetBtnObj = create3DButton('Reset Center', '#1b3840', '#d0eaef', 0.34, 0.09);
    const editMenuBtnObj = create3DButton('Main Menu', '#2b1e29', '#f8bbd0', 0.32, 0.09);

    const editBtnObj = create3DButton('Move / Resize', '#162b32', '#9bd2dc', 0.32, 0.08);
    const playMenuBtnObj = create3DButton('Main Menu', '#2b1e29', '#f8bbd0', 0.28, 0.08);

    const lockBtn = lockBtnObj.mesh;
    const resetBtn = resetBtnObj.mesh;
    const editMenuBtn = editMenuBtnObj.mesh;
    const editBtn = editBtnObj.mesh;
    const playMenuBtn = playMenuBtnObj.mesh;

    boardRoot.add(lockBtn, resetBtn, editMenuBtn, editBtn, playMenuBtn);

    // --- Architectural Hexagon Grid + Radiant Center Target Hexagon ---
    const hexContainer = new THREE.Group();
    boardRoot.add(hexContainer);

    const HEX_RADIUS = 0.132;
    const CENTER_HEX_RADIUS = 0.255;

    function makeHexShape(r) {
      const s = new THREE.Shape();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i === 0) s.moveTo(x, y);
        else s.lineTo(x, y);
      }
      s.closePath();
      return s;
    }

    // Normalized UVs on ExtrudeGeometry so radial diffuser texture maps centered on every hexagon
    function applyCenteredHexUVs(geo, radius) {
      const pos = geo.attributes.position;
      const uv = geo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        const u = (pos.getX(i) / (radius * 2)) + 0.5;
        const v = (pos.getY(i) / (radius * 2)) + 0.5;
        uv.setXY(i, u, v);
      }
      uv.needsUpdate = true;
    }

    // Outer Dark Metallic Bevel Socket
    const socketGeo = new THREE.ExtrudeGeometry(makeHexShape(HEX_RADIUS * 0.94), {
      depth: 0.008,
      bevelEnabled: true,
      bevelSegments: 2,
      steps: 1,
      bevelSize: 0.004,
      bevelThickness: 0.003
    });
    const socketMat = new THREE.MeshStandardMaterial({
      color: 0x0b161b,
      roughness: 0.35,
      metalness: 0.65,
      transparent: true,
      opacity: 0.85
    });

    // Inner Luminous Frosted-Glass Tile Core
    const tileRadius = HEX_RADIUS * 0.84;
    const hexGeo = new THREE.ExtrudeGeometry(makeHexShape(tileRadius), {
      depth: 0.018,
      bevelEnabled: true,
      bevelSegments: 3,
      steps: 1,
      bevelSize: 0.005,
      bevelThickness: 0.005
    });
    applyCenteredHexUVs(hexGeo, tileRadius);

    // Crisp Inner Neon Trim Ring
    const ringGeo = new THREE.RingGeometry(HEX_RADIUS * 0.72, HEX_RADIUS * 0.84, 6);

    // Additive Glow Halo Plane behind each tile
    const haloPlaneGeo = new THREE.PlaneGeometry(HEX_RADIUS * 2.7, HEX_RADIUS * 2.7);

    // Big Center Beacon Hexagon Assembly
    const centerSocketGeo = new THREE.ExtrudeGeometry(makeHexShape(CENTER_HEX_RADIUS * 0.98), {
      depth: 0.012,
      bevelEnabled: true,
      bevelSegments: 3,
      steps: 1,
      bevelSize: 0.006,
      bevelThickness: 0.005
    });
    const centerCoreRadius = CENTER_HEX_RADIUS * 0.88;
    const centerHexGeo = new THREE.ExtrudeGeometry(makeHexShape(centerCoreRadius), {
      depth: 0.026,
      bevelEnabled: true,
      bevelSegments: 4,
      steps: 1,
      bevelSize: 0.007,
      bevelThickness: 0.007
    });
    applyCenteredHexUVs(centerHexGeo, centerCoreRadius);

    const centerOuterRingGeo = new THREE.RingGeometry(CENTER_HEX_RADIUS * 0.92, CENTER_HEX_RADIUS * 1.03, 6);
    const centerInnerRingGeo = new THREE.RingGeometry(CENTER_HEX_RADIUS * 0.70, CENTER_HEX_RADIUS * 0.78, 6);
    const centerHaloGeo = new THREE.PlaneGeometry(CENTER_HEX_RADIUS * 3.2, CENTER_HEX_RADIUS * 3.2);

    const centerMat = new THREE.MeshPhysicalMaterial({
      color: FULL_PALETTE[0].hex,
      map: diffuserTex,
      emissive: FULL_PALETTE[0].emissive,
      emissiveMap: diffuserTex,
      emissiveIntensity: 1.45,
      roughness: 0.12,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06
    });
    const centerOuterRingMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.98 });
    const centerInnerRingMat = new THREE.MeshBasicMaterial({ color: FULL_PALETTE[0].rim, transparent: true, opacity: 0.95 });
    const centerHaloMat = new THREE.MeshBasicMaterial({
      color: FULL_PALETTE[0].halo,
      map: bloomHaloTex,
      transparent: true,
      opacity: 0.72,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const centerBeaconGroup = new THREE.Group();
    const centerSocketMesh = new THREE.Mesh(centerSocketGeo, socketMat);
    const centerHaloMesh = new THREE.Mesh(centerHaloGeo, centerHaloMat);
    centerHaloMesh.position.z = 0.008;

    const centerBeaconMesh = new THREE.Mesh(centerHexGeo, centerMat);
    centerBeaconMesh.position.z = 0.010;
    const centerOuterRing = new THREE.Mesh(centerOuterRingGeo, centerOuterRingMat);
    centerOuterRing.position.z = 0.034;
    const centerInnerRing = new THREE.Mesh(centerInnerRingGeo, centerInnerRingMat);
    centerInnerRing.position.z = 0.036;

    centerBeaconMesh.add(centerOuterRing, centerInnerRing);
    centerBeaconGroup.add(centerSocketMesh, centerHaloMesh, centerBeaconMesh);
    centerBeaconGroup.position.set(0, 0, 0.008);
    boardRoot.add(centerBeaconGroup);

    let targetColorIdx = 0;
    let tiles = [];

    function setCenterTargetColor(newIdx, withRipple = true) {
      targetColorIdx = newIdx;
      const pal = FULL_PALETTE[targetColorIdx];
      centerMat.color.setHex(pal.hex);
      centerMat.emissive.setHex(pal.emissive);
      centerInnerRingMat.color.setHex(pal.rim);
      centerHaloMat.color.setHex(pal.halo);
      if (withRipple) {
        spawnBoardRipple(centerBeaconGroup.position, pal.halo, 1.9);
      }
    }

    function lightTileWithColor(tile, cIdx) {
      const pal = FULL_PALETTE[cIdx];
      tile.isLit = true;
      tile.colorIdx = cIdx;
      tile.mat.color.setHex(pal.hex);
      tile.mat.emissive.setHex(pal.emissive);
      tile.mat.emissiveIntensity = 1.35;
      tile.mat.opacity = 1.0;

      tile.rimMat.color.setHex(pal.rim);
      tile.rimMat.opacity = 1.0;

      tile.haloMat.color.setHex(pal.halo);
      tile.haloMesh.visible = true;
    }

    function resetTileToIdle(t) {
      t.isLit = false;
      t.mat.color.setHex(0x162b33);
      t.mat.emissive.setHex(0x0b1c22);
      t.mat.emissiveIntensity = 0.25;
      t.mat.opacity = 0.88;

      t.rimMat.color.setHex(0x284e5c);
      t.rimMat.opacity = 0.55;

      t.haloMesh.visible = false;
    }

    function populateColorMatchRound(pickNewColor = true, withRipple = true) {
      if (tiles.length === 0) return;

      for (const t of tiles) resetTileToIdle(t);

      const paletteCount = activeColorCount;
      if (pickNewColor) {
        let nextIdx = Math.floor(Math.random() * paletteCount);
        if (nextIdx === targetColorIdx) {
          nextIdx = (nextIdx + 1) % paletteCount;
        }
        setCenterTargetColor(nextIdx, withRipple);
      } else {
        targetColorIdx = targetColorIdx % paletteCount;
        setCenterTargetColor(targetColorIdx, withRipple);
      }

      const shuffled = [...tiles].sort(() => Math.random() - 0.5);
      const matchCount = Math.min(3, Math.max(1, Math.floor(shuffled.length * 0.25)));
      const distractorCount = Math.min(6, Math.max(0, shuffled.length - matchCount));

      let idx = 0;
      for (let i = 0; i < matchCount; i++, idx++) {
        lightTileWithColor(shuffled[idx], targetColorIdx);
      }

      for (let i = 0; i < distractorCount; i++, idx++) {
        let otherColor = Math.floor(Math.random() * paletteCount);
        if (otherColor === targetColorIdx) {
          otherColor = (otherColor + 1) % paletteCount;
        }
        lightTileWithColor(shuffled[idx], otherColor);
      }
    }

    function rebuildHexGrid() {
      while (hexContainer.children.length > 0) {
        hexContainer.remove(hexContainer.children[0]);
      }
      tiles = [];

      const halfW = boardState.width / 2 - HEX_RADIUS * 0.98;
      const halfH = boardState.height / 2 - HEX_RADIUS * 0.98;
      if (halfW <= 0 || halfH <= 0) return;

      const dx = HEX_RADIUS * 1.56;
      const dy = HEX_RADIUS * Math.sqrt(3) * 0.93;
      const centerClearance = CENTER_HEX_RADIUS + HEX_RADIUS * 1.05;
      let col = 0;

      for (let x = -halfW; x <= halfW; x += dx) {
        const yOffset = (col % 2 === 1) ? dy * 0.5 : 0;
        for (let y = -halfH + yOffset; y <= halfH; y += dy) {
          if (Math.hypot(x, y) < centerClearance) continue;

          // Recessed dark housing socket
          const socketMesh = new THREE.Mesh(socketGeo, socketMat);
          socketMesh.position.set(x, y, 0.002);
          hexContainer.add(socketMesh);

          // Additive bloom glow halo
          const haloMat = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            map: bloomHaloTex,
            transparent: true,
            opacity: 0.65,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          const haloMesh = new THREE.Mesh(haloPlaneGeo, haloMat);
          haloMesh.position.set(x, y, 0.006);
          haloMesh.visible = false;
          hexContainer.add(haloMesh);

          // Luminous frosted-glass tile core
          const tileMat = new THREE.MeshPhysicalMaterial({
            color: 0x162b33,
            map: diffuserTex,
            emissive: 0x0b1c22,
            emissiveMap: diffuserTex,
            emissiveIntensity: 0.25,
            roughness: 0.14,
            metalness: 0.05,
            clearcoat: 1.0,
            clearcoatRoughness: 0.08,
            transparent: true,
            opacity: 0.88
          });
          const rimMat = new THREE.MeshBasicMaterial({
            color: 0x284e5c,
            transparent: true,
            opacity: 0.55
          });

          const mesh = new THREE.Mesh(hexGeo, tileMat);
          const rim = new THREE.Mesh(ringGeo, rimMat);
          rim.position.z = 0.024;
          mesh.add(rim);

          mesh.position.set(x, y, 0.006);
          hexContainer.add(mesh);

          tiles.push({
            mesh,
            rim,
            haloMesh,
            mat: tileMat,
            rimMat,
            haloMat,
            localX: x,
            localY: y,
            worldPos: new THREE.Vector3(),
            isLit: false,
            colorIdx: 0,
            popZ: 0.006,
            nudgeTimer: 0
          });
        }
        col++;
      }

      populateColorMatchRound(false, false);
    }

    function updateBoardLayout(rebuildTiles = true) {
      boardRoot.position.set(boardState.x, boardState.y, boardState.z);
      boardRoot.rotation.set(0, boardState.yaw, 0);

      const w = boardState.width;
      const h = boardState.height;

      backPlane.scale.set(w, h, 1);
      backPlaneMat.opacity = isEditMode ? 0.48 : 0.22;

      topBar.scale.set(w, 1, 1);
      topBar.position.set(0, h / 2, 0.01);

      botBar.scale.set(w, 1, 1);
      botBar.position.set(0, -h / 2, 0.01);

      leftBar.scale.set(1, h, 1);
      leftBar.position.set(-w / 2, 0, 0.01);

      rightBar.scale.set(1, h, 1);
      rightBar.position.set(w / 2, 0, 0.01);

      frameMat.opacity = isEditMode ? 0.95 : 0.35;

      for (const ch of cornerHandles) {
        ch.mesh.visible = isEditMode;
        ch.mesh.position.set(ch.sx * (w / 2), ch.sy * (h / 2), 0.022);
      }

      lockBtn.visible = isEditMode;
      resetBtn.visible = isEditMode;
      editMenuBtn.visible = isEditMode;

      editBtn.visible = !isEditMode;
      playMenuBtn.visible = !isEditMode;

      const dockY = -h / 2 - 0.095;
      lockBtn.position.set(-0.37, dockY, 0.025);
      resetBtn.position.set(0.00, dockY, 0.025);
      editMenuBtn.position.set(0.36, dockY, 0.025);

      editBtn.position.set(-0.17, -h / 2 - 0.085, 0.025);
      playMenuBtn.position.set(0.17, -h / 2 - 0.085, 0.025);

      if (rebuildTiles) rebuildHexGrid();
    }

    function setEditMode(enabled) {
      isEditMode = enabled;
      updateBoardLayout(false);
      saveBoardState();
    }

    function returnToMainMenu() {
      playClickTone();
      if (activeXRSession) {
        activeXRSession.end().catch(() => {});
      }
    }

    updateBoardLayout(true);

    // --- Hex Pop Particle Burst ---
    function spawnHexPopEffect(worldPos, colorHex, haloHex) {
      const fMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const fMesh = new THREE.Mesh(flashSphereGeo, fMat);
      fMesh.position.copy(worldPos);
      scene.add(fMesh);
      activeEffects.push({
        mesh: fMesh, mat: fMat,
        vx: 0, vy: 0, vz: 0, rx: 0, ry: 0, rz: 0,
        age: 0, maxAge: 0.18, kind: 'scale', startScale: 0.7, endScale: 2.4
      });

      const rMat = new THREE.MeshBasicMaterial({
        color: haloHex,
        transparent: true,
        opacity: 0.95,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const rMesh = new THREE.Mesh(shockwaveGeo, rMat);
      rMesh.position.copy(worldPos);
      rMesh.rotation.y = boardState.yaw;
      scene.add(rMesh);
      activeEffects.push({
        mesh: rMesh, mat: rMat,
        vx: 0, vy: 0, vz: 0, rx: 0, ry: 0, rz: 0,
        age: 0, maxAge: 0.36, kind: 'scale', startScale: 0.65, endScale: 3.3
      });

      for (let i = 0; i < 12; i++) {
        const mat = new THREE.MeshStandardMaterial({
          color: i % 2 === 0 ? colorHex : 0xffffff,
          emissive: colorHex,
          emissiveIntensity: 0.85,
          roughness: 0.1,
          flatShading: true,
          transparent: true,
          opacity: 1.0
        });
        const mesh = new THREE.Mesh(shardGeo, mat);
        mesh.position.copy(worldPos);
        scene.add(mesh);

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        const spd = 0.65 + Math.random() * 0.85;
        activeEffects.push({
          mesh, mat,
          vx: Math.sin(phi) * Math.cos(theta) * spd,
          vy: Math.cos(phi) * spd + 0.25,
          vz: Math.sin(phi) * Math.sin(theta) * spd,
          rx: (Math.random() - 0.5) * 16,
          ry: (Math.random() - 0.5) * 16,
          rz: (Math.random() - 0.5) * 16,
          age: 0,
          maxAge: 0.55,
          kind: 'shard'
        });
      }
    }

    // --- Bare Hands (Primary) & Controllers (Optional Saber) ---
    const controllers = [];
    const touchProbes = []; // { isPointProbe, state, getPoints: (pA, pB) => bool, triggerHaptic?: fn }
    const raycaster = new THREE.Raycaster();
    let activeDrag = null;

    function getSaberRay(state, outOrigin, outDir) {
      state.hiltOriginMesh.getWorldPosition(outOrigin);
      state.tipMesh.getWorldPosition(outDir);
      outDir.sub(outOrigin).normalize();
    }

    function resetBoardToCenter() {
      const headPos = new THREE.Vector3();
      const headDir = new THREE.Vector3();
      camera.getWorldPosition(headPos);
      camera.getWorldDirection(headDir);
      headDir.y = 0;
      if (headDir.lengthSq() < 0.001) headDir.set(0, 0, -1);
      headDir.normalize();

      boardState.x = headPos.x + headDir.x * 1.35;
      boardState.y = Math.max(0.95, headPos.y - 0.15);
      boardState.z = headPos.z + headDir.z * 1.35;
      boardState.yaw = Math.atan2(-headDir.x, -headDir.z);
      boardState.width = DEFAULT_STATE.width;
      boardState.height = DEFAULT_STATE.height;
      updateBoardLayout(true);
      saveBoardState();
    }

    function handleRaySelectStart(origin, dir, dragOwner, pulseFn) {
      raycaster.set(origin, dir);

      if (isEditMode) {
        if (raycaster.intersectObject(lockBtn).length > 0) {
          playClickTone();
          if (pulseFn) pulseFn(0.45, 50);
          setEditMode(false);
          return true;
        }
        if (raycaster.intersectObject(resetBtn).length > 0) {
          playClickTone();
          if (pulseFn) pulseFn(0.45, 50);
          resetBoardToCenter();
          return true;
        }
        if (raycaster.intersectObject(editMenuBtn).length > 0) {
          if (pulseFn) pulseFn(0.45, 50);
          returnToMainMenu();
          return true;
        }

        const cornerMeshes = cornerHandles.map(c => c.hitMesh);
        const cornerHits = raycaster.intersectObjects(cornerMeshes, false);
        if (cornerHits.length > 0) {
          const hitHandle = cornerHandles.find(c => c.hitMesh === cornerHits[0].object);
          if (hitHandle) {
            if (pulseFn) pulseFn(0.35, 40);
            activeDrag = {
              owner: dragOwner,
              type: 'resize',
              distance: cornerHits[0].distance
            };
            return true;
          }
        }

        const boardHits = raycaster.intersectObject(backPlane, false);
        if (boardHits.length > 0) {
          if (pulseFn) pulseFn(0.3, 35);
          const localHit = boardRoot.worldToLocal(boardHits[0].point.clone());
          activeDrag = {
            owner: dragOwner,
            type: 'move',
            distance: boardHits[0].distance,
            offsetLocalX: localHit.x,
            offsetLocalY: localHit.y
          };
          return true;
        }
      } else {
        if (raycaster.intersectObject(editBtn).length > 0) {
          playClickTone();
          if (pulseFn) pulseFn(0.45, 50);
          setEditMode(true);
          return true;
        }
        if (raycaster.intersectObject(playMenuBtn).length > 0) {
          if (pulseFn) pulseFn(0.45, 50);
          returnToMainMenu();
          return true;
        }
      }
      return false;
    }

    function setupController(index) {
      const controller = renderer.xr.getController(index);
      scene.add(controller);

      const bladePivot = new THREE.Group();
      bladePivot.rotation.x = THREE.MathUtils.degToRad(bladeAngleDeg);
      bladePivot.visible = false;
      controller.add(bladePivot);

      const bladeColor = index === 0 ? 0x00e5ff : 0xffc400;

      const hiltGeo = new THREE.CylinderGeometry(0.015, 0.017, 0.13, 16);
      hiltGeo.rotateX(Math.PI / 2);
      hiltGeo.translate(0, 0, 0.045);
      const hiltMat = new THREE.MeshStandardMaterial({ color: 0x37474f, roughness: 0.35, metalness: 0.8 });
      bladePivot.add(new THREE.Mesh(hiltGeo, hiltMat));

      const emitterGeo = new THREE.CylinderGeometry(0.019, 0.019, 0.018, 16);
      emitterGeo.rotateX(Math.PI / 2);
      emitterGeo.translate(0, 0, -0.022);
      const emitterMat = new THREE.MeshStandardMaterial({ color: 0xb0bec5, roughness: 0.25, metalness: 0.9 });
      bladePivot.add(new THREE.Mesh(emitterGeo, emitterMat));

      const coreGeo = new THREE.CylinderGeometry(0.0075, 0.009, bladeLength, 14);
      coreGeo.rotateX(Math.PI / 2);
      coreGeo.translate(0, 0, -0.025 - bladeLength / 2);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      bladePivot.add(new THREE.Mesh(coreGeo, coreMat));

      const auraGeo = new THREE.CylinderGeometry(0.018, 0.022, bladeLength + 0.01, 16);
      auraGeo.rotateX(Math.PI / 2);
      auraGeo.translate(0, 0, -0.025 - bladeLength / 2);
      const auraMat = new THREE.MeshBasicMaterial({
        color: bladeColor,
        transparent: true,
        opacity: 0.45
      });
      bladePivot.add(new THREE.Mesh(auraGeo, auraMat));

      const tipAuraGeo = new THREE.SphereGeometry(0.020, 16, 16);
      const tipAuraMesh = new THREE.Mesh(tipAuraGeo, auraMat);
      tipAuraMesh.position.set(0, 0, -0.025 - bladeLength);
      bladePivot.add(tipAuraMesh);

      const hiltOriginMesh = new THREE.Object3D();
      hiltOriginMesh.position.set(0, 0, -0.025);
      bladePivot.add(hiltOriginMesh);

      const tipMesh = new THREE.Object3D();
      tipMesh.position.set(0, 0, -0.025 - bladeLength);
      bladePivot.add(tipMesh);

      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, -0.025 - bladeLength),
        new THREE.Vector3(0, 0, -4.5)
      ]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0xffc400, transparent: true, opacity: 0.75 });
      const rayLine = new THREE.Line(lineGeo, lineMat);
      bladePivot.add(rayLine);

      const state = {
        controller,
        bladePivot,
        hiltOriginMesh,
        tipMesh,
        rayLine,
        inputSource: null,
        isHandSource: false
      };

      controller.addEventListener('connected', (e) => {
        state.inputSource = e.data;
        state.isHandSource = Boolean(e.data && e.data.hand);
        bladePivot.visible = !state.isHandSource;
      });
      controller.addEventListener('disconnected', () => {
        state.inputSource = null;
        state.isHandSource = false;
        bladePivot.visible = false;
        if (activeDrag && activeDrag.owner === state) activeDrag = null;
      });

      const pulseHaptic = (strength = 0.55, ms = 50) => {
        const gp = state.inputSource && state.inputSource.gamepad;
        if (gp && gp.hapticActuators && gp.hapticActuators[0]) {
          gp.hapticActuators[0].pulse(strength, ms);
        }
      };

      const onSelectStart = () => {
        const origin = new THREE.Vector3();
        const dir = new THREE.Vector3();
        if (state.isHandSource) {
          controller.getWorldPosition(origin);
          dir.set(0, 0, -1).applyQuaternion(controller.quaternion).normalize();
        } else {
          getSaberRay(state, origin, dir);
        }
        handleRaySelectStart(origin, dir, state, pulseHaptic);
      };

      const onSelectEnd = () => {
        if (activeDrag && activeDrag.owner === state) {
          activeDrag = null;
          saveBoardState();
        }
      };

      controller.addEventListener('selectstart', onSelectStart);
      controller.addEventListener('selectend', onSelectEnd);
      controller.addEventListener('squeezestart', onSelectStart);
      controller.addEventListener('squeezeend', onSelectEnd);

      touchProbes.push({
        isPointProbe: false,
        state,
        getPoints: (outA, outB) => {
          if (!state.bladePivot.visible) return false;
          state.hiltOriginMesh.getWorldPosition(outA);
          state.tipMesh.getWorldPosition(outB);
          return true;
        },
        triggerHaptic: (strength = 0.65, ms = 50) => pulseHaptic(strength, ms)
      });

      controllers.push(state);
    }

    function setupBareHand(index) {
      const hand = renderer.xr.getHand(index);
      scene.add(hand);

      // Clean luminous fingertip halo only on index tip; invisible probes on other fingers + palm
      const trackedJoints = [
        { name: 'index-finger-tip',          showCursor: true },
        { name: 'middle-finger-tip',         showCursor: false },
        { name: 'ring-finger-tip',           showCursor: false },
        { name: 'thumb-tip',                 showCursor: false },
        { name: 'middle-finger-metacarpal',  showCursor: false }
      ];

      for (const jCfg of trackedJoints) {
        let cursorGroup = null;
        if (jCfg.showCursor) {
          cursorGroup = new THREE.Group();
          const core = new THREE.Mesh(
            new THREE.SphereGeometry(0.011, 14, 14),
            new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.92 })
          );
          const aura = new THREE.Mesh(
            new THREE.SphereGeometry(0.022, 16, 16),
            new THREE.MeshBasicMaterial({
              color: 0x00e5ff,
              transparent: true,
              opacity: 0.35,
              blending: THREE.AdditiveBlending,
              depthWrite: false
            })
          );
          cursorGroup.add(core, aura);
          cursorGroup.visible = false;
          scene.add(cursorGroup);
        }

        touchProbes.push({
          isPointProbe: true,
          getPoints: (outPt) => {
            const joint = hand.joints && hand.joints[jCfg.name];
            if (!joint) {
              if (cursorGroup) cursorGroup.visible = false;
              return false;
            }
            joint.getWorldPosition(outPt);
            if (outPt.lengthSq() < 0.0001) {
              if (cursorGroup) cursorGroup.visible = false;
              return false;
            }
            if (cursorGroup) {
              cursorGroup.position.copy(outPt);
              cursorGroup.visible = true;
            }
            return true;
          },
          triggerHaptic: null
        });
      }
    }

    setupController(0);
    setupController(1);
    setupBareHand(0);
    setupBareHand(1);

    // --- Check WebXR Support & Attach Start AR Handler ---
    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-ar').then(supported => {
        if (supported) {
          startBtn.disabled = false;
          startBtn.textContent = 'START AR';
        } else {
          startBtn.textContent = 'AR Not Supported Here';
          statusEl.textContent = 'Open this page inside the Meta Quest Browser on Quest 3.';
        }
      }).catch(err => {
        statusEl.textContent = 'XR Check Error: ' + err.message;
      });
    } else {
      startBtn.textContent = 'WebXR Unavailable';
      statusEl.textContent = 'Requires HTTPS and Meta Quest Browser.';
    }

    startBtn.addEventListener('click', async () => {
      try {
        statusEl.textContent = 'Starting AR...';
        initAudio();
        rebuildHexGrid();

        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['local-floor'],
          optionalFeatures: ['hand-tracking']
        });

        activeXRSession = session;
        menuCard.style.display = 'none';
        statusEl.textContent = '';

        renderer.xr.setReferenceSpaceType('local-floor');
        await renderer.xr.setSession(session);

        session.addEventListener('end', () => {
          activeXRSession = null;
          activeDrag = null;
          menuCard.style.display = 'block';
        });
      } catch (err) {
        menuCard.style.display = 'block';
        statusEl.textContent = 'Could not start AR: ' + err.message;
      }
    });

    // --- Helper for Board-Local Button Poke Detection ---
    function isPointInsideBoardButton(localPt, btnObj) {
      const bx = btnObj.mesh.position.x;
      const by = btnObj.mesh.position.y;
      return (
        Math.abs(localPt.x - bx) <= btnObj.w * 0.56 &&
        Math.abs(localPt.y - by) <= btnObj.h * 0.65 &&
        localPt.z >= -0.09 &&
        localPt.z <= 0.12
      );
    }

    // --- Main Frame Loop ---
    const clock = new THREE.Clock();
    const segA = new THREE.Vector3();
    const segB = new THREE.Vector3();
    const midOuterA = new THREE.Vector3();
    const closestPt = new THREE.Vector3();
    const outerBladeLine = new THREE.Line3();
    const rayOrigin = new THREE.Vector3();
    const rayDir = new THREE.Vector3();
    const targetWorldPt = new THREE.Vector3();
    const localPt = new THREE.Vector3();

    const HEX_HIT_RADIUS = HEX_RADIUS * 1.16;
    let buttonCooldownUntil = 0;

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      for (const c of controllers) {
        if (c.rayLine) c.rayLine.visible = isEditMode && c.bladePivot.visible;
      }

      // 1. Handle Active Board Dragging or Corner Resizing
      if (activeDrag && isEditMode) {
        if (activeDrag.owner.isHandSource) {
          activeDrag.owner.controller.getWorldPosition(rayOrigin);
          rayDir.set(0, 0, -1).applyQuaternion(activeDrag.owner.controller.quaternion).normalize();
        } else {
          getSaberRay(activeDrag.owner, rayOrigin, rayDir);
        }
        targetWorldPt.copy(rayOrigin).addScaledVector(rayDir, activeDrag.distance);

        if (activeDrag.type === 'move') {
          const flatDirX = -rayDir.x;
          const flatDirZ = -rayDir.z;
          if (flatDirX * flatDirX + flatDirZ * flatDirZ > 0.01) {
            boardState.yaw = Math.atan2(flatDirX, flatDirZ);
          }

          const cosY = Math.cos(boardState.yaw);
          const sinY = Math.sin(boardState.yaw);
          const worldOffsetX = activeDrag.offsetLocalX * cosY;
          const worldOffsetZ = -activeDrag.offsetLocalX * sinY;

          boardState.x = targetWorldPt.x - worldOffsetX;
          boardState.y = Math.max(0.45, targetWorldPt.y - activeDrag.offsetLocalY);
          boardState.z = targetWorldPt.z - worldOffsetZ;
          updateBoardLayout(false);
        } else if (activeDrag.type === 'resize') {
          localPt.copy(targetWorldPt);
          boardRoot.worldToLocal(localPt);

          const newWidth = Math.max(0.75, Math.min(4.2, Math.abs(localPt.x) * 2));
          const newHeight = Math.max(0.65, Math.min(3.0, Math.abs(localPt.y) * 2));

          if (Math.abs(newWidth - boardState.width) > 0.015 || Math.abs(newHeight - boardState.height) > 0.015) {
            boardState.width = newWidth;
            boardState.height = newHeight;
            updateBoardLayout(true);
          }
        }
      }

      // 2. Animate Big Center Target Hexagon & Luminous Board Hexagons
      boardRoot.updateMatrixWorld(true);

      const beaconPulse = 1.0 + Math.sin(elapsed * 3.8) * 0.045;
      centerBeaconMesh.scale.setScalar(beaconPulse);
      centerHaloMat.opacity = 0.62 + Math.sin(elapsed * 3.8) * 0.16;

      for (let i = 0; i < tiles.length; i++) {
        const t = tiles[i];
        if (t.nudgeTimer > 0) {
          t.nudgeTimer = Math.max(0, t.nudgeTimer - dt);
        }

        const isMatchingColor = t.isLit && (t.colorIdx === targetColorIdx);
        const breathe = (t.isLit && !isEditMode) ? Math.sin(elapsed * 4.8 + i * 0.7) : 0;

        if (t.isLit && !isEditMode) {
          t.mat.emissiveIntensity = isMatchingColor ? (1.45 + breathe * 0.28) : 1.15;
          t.haloMat.opacity = isMatchingColor ? (0.68 + breathe * 0.18) : 0.45;
          const s = isMatchingColor ? (1.0 + breathe * 0.025) : 1.0;
          t.mesh.scale.setScalar(s);
        } else {
          t.mesh.scale.setScalar(1.0);
        }

        const pulseZ = isMatchingColor ? breathe * 0.004 : 0;
        const nudgeDip = t.nudgeTimer > 0 ? -Math.sin((t.nudgeTimer / 0.25) * Math.PI) * 0.014 : 0;
        const targetZ = (t.isLit && !isEditMode) ? (0.026 + pulseZ + nudgeDip) : 0.006;

        t.popZ += (targetZ - t.popZ) * Math.min(1, dt * 15);
        t.mesh.position.z = t.popZ;
        if (t.isLit) t.mesh.getWorldPosition(t.worldPos);
      }

      // 3. Check Bare Hand & Saber Collisions
      const nowMs = performance.now();
      for (let p = 0; p < touchProbes.length; p++) {
        const probe = touchProbes[p];
        if (!probe.getPoints(segA, segB)) continue;

        // Convert active contact point into boardRoot local coordinates for forgiving wall depth detection
        localPt.copy(probe.isPointProbe ? segA : segB);
        boardRoot.worldToLocal(localPt);

        // Dock Button Pokes (Works with both bare fingers and wand tip)
        if (nowMs >= buttonCooldownUntil) {
          if (isEditMode) {
            if (isPointInsideBoardButton(localPt, lockBtnObj)) {
              buttonCooldownUntil = nowMs + 600;
              playClickTone();
              if (probe.triggerHaptic) probe.triggerHaptic(0.45, 50);
              setEditMode(false);
              break;
            }
            if (isPointInsideBoardButton(localPt, resetBtnObj)) {
              buttonCooldownUntil = nowMs + 600;
              playClickTone();
              if (probe.triggerHaptic) probe.triggerHaptic(0.45, 50);
              resetBoardToCenter();
              break;
            }
            if (isPointInsideBoardButton(localPt, editMenuBtnObj)) {
              buttonCooldownUntil = nowMs + 600;
              if (probe.triggerHaptic) probe.triggerHaptic(0.45, 50);
              returnToMainMenu();
              break;
            }
          } else {
            if (isPointInsideBoardButton(localPt, editBtnObj)) {
              buttonCooldownUntil = nowMs + 600;
              playClickTone();
              if (probe.triggerHaptic) probe.triggerHaptic(0.45, 50);
              setEditMode(true);
              break;
            }
            if (isPointInsideBoardButton(localPt, playMenuBtnObj)) {
              buttonCooldownUntil = nowMs + 600;
              if (probe.triggerHaptic) probe.triggerHaptic(0.45, 50);
              returnToMainMenu();
              break;
            }
          }
        }

        if (isEditMode) continue;

        // Prepare saber segment if using a controller
        if (!probe.isPointProbe) {
          midOuterA.lerpVectors(segA, segB, 0.35);
          outerBladeLine.set(midOuterA, segB);
        }

        // Check Lit Hexagons
        for (let i = 0; i < tiles.length; i++) {
          const t = tiles[i];
          if (!t.isLit) continue;

          let isHit = false;
          if (probe.isPointProbe) {
            // Bare-hand check: within hexagon face radius in XY and within [-9cm, +11cm] of board plane in Z
            const planarDist = Math.hypot(localPt.x - t.localX, localPt.y - t.localY);
            isHit = (planarDist <= HEX_HIT_RADIUS && localPt.z >= -0.09 && localPt.z <= 0.11);
          } else {
            outerBladeLine.closestPointToPoint(t.worldPos, true, closestPt);
            isHit = (closestPt.distanceTo(t.worldPos) <= HEX_HIT_RADIUS);
          }

          if (isHit) {
            if (t.colorIdx === targetColorIdx) {
              const pal = FULL_PALETTE[t.colorIdx];
              spawnBoardRipple(t.mesh.position, pal.halo, 1.15);
              spawnHexPopEffect(t.worldPos, pal.hex, pal.halo);
              playHexChime();
              if (probe.triggerHaptic) probe.triggerHaptic(0.55, 45);

              resetTileToIdle(t);

              const remainingMatches = tiles.some(other => other.isLit && other.colorIdx === targetColorIdx);
              if (!remainingMatches) {
                playColorChangeChime();
                populateColorMatchRound(true, true);
              }
            } else if (t.nudgeTimer <= 0) {
              t.nudgeTimer = 0.25;
              playGentleWrongTap();
              if (probe.triggerHaptic) probe.triggerHaptic(0.15, 25);
            }
            break;
          }
        }
      }

      // 4. Animate Board Ripples & 3D Pop Particles
      for (let i = boardRipples.length - 1; i >= 0; i--) {
        const r = boardRipples[i];
        r.age += dt;
        const prog = r.age / 0.44;
        if (prog >= 1) {
          boardRoot.remove(r.mesh);
          r.mat.dispose();
          boardRipples.splice(i, 1);
        } else {
          r.mesh.scale.setScalar((1 + prog * 1.25) * (r.scaleMult || 1));
          r.mat.opacity = 0.92 * (1 - prog);
        }
      }

      for (let i = activeEffects.length - 1; i >= 0; i--) {
        const ef = activeEffects[i];
        ef.age += dt;
        const prog = ef.age / ef.maxAge;
        if (prog >= 1) {
          scene.remove(ef.mesh);
          ef.mat.dispose();
          activeEffects.splice(i, 1);
          continue;
        }

        if (ef.kind === 'scale') {
          const s = ef.startScale + (ef.endScale - ef.startScale) * (1 - Math.pow(1 - prog, 2));
          ef.mesh.scale.setScalar(s);
          ef.mat.opacity = 0.92 * (1 - prog);
        } else {
          ef.vy -= 2.1 * dt;
          ef.mesh.position.x += ef.vx * dt;
          ef.mesh.position.y += ef.vy * dt;
          ef.mesh.position.z += ef.vz * dt;
          ef.mesh.rotation.x += ef.rx * dt;
          ef.mesh.rotation.y += ef.ry * dt;
          ef.mesh.rotation.z += ef.rz * dt;
          ef.mat.opacity = 1.0 - prog;
        }
      }

      renderer.render(scene, camera);
    });
  </script>
